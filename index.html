function cleanToken(token){
    return token.toLowerCase().replace(/[’']/g,'').replace(/[^a-z-]/g,'').replace(/^-+|-+$/g,'');
}
function extractWords(text){
    const matches=text.match(/[A-Za-z][A-Za-z'-]{2,18}/g)||[];
    const out=[];
    for(const raw of matches){
        const w=cleanToken(raw);
        if(!w||w.length<3) continue;
        if(WORD_BLACKLIST.has(w)) continue;
        if(/^[ivxlcdm]+$/i.test(w)) continue;
        out.push(w);
    }
    return [...new Set(out)];
}
let NAME_WORDS=[...new Set(DW.map(cleanToken).filter(Boolean))];
function pickWord(){return NAME_WORDS[(Math.random()*NAME_WORDS.length)|0];}
function titleCase(w){return w.charAt(0).toUpperCase()+w.slice(1);}
function genName(){
    let a=pickWord(),b=pickWord();
    while(b===a) b=pickWord();
    return `${titleCase(a)} ${titleCase(b)}`;
}

const loadedTextures=[];
ALL_SETS.forEach(s=>{
    loadedTextures.push({
        ...s,
        front:texLoader.load(s.front),
        side:texLoader.load(s.side),
        side_r:texLoader.load(s.side_r),

function buildMascotHead(idx){
    const charData=loadedTextures[idx%loadedTextures.length];
    const g=new THREE.Group();
    const mat=new THREE.MeshBasicMaterial({transparent:true,alphaTest:0.5,side:THREE.DoubleSide});
    const headSizeFront=charData.frontSize||10.5;
    const headSizeSide=charData.sideSize||10.5;
    const geoFront=new THREE.PlaneGeometry(headSizeFront,headSizeFront);
    const geoSide=new THREE.PlaneGeometry(headSizeSide,headSizeFront);
    const plane=new THREE.Mesh(geoFront,mat);
    plane.position.z=1.3;
    g.add(plane);
    g.userData.multiAngle=charData;
    g.userData.headMat=mat;
    g.userData.headMesh=plane;
    g.userData.isHead=true;
    g.userData.sideGeo=geoSide;
    g.userData.frontGeo=geoFront;
    return g;
}

const _headWorldPos=new THREE.Vector3();
const _camToHead=new THREE.Vector3();
const _horseForward=new THREE.Vector3();
const _parentWorldQuat=new THREE.Quaternion();
const _targetQuat=new THREE.Quaternion();
const _lookMatrix=new THREE.Matrix4();

function updateHeadAngle(horseRoot,jockeyGroup,cam){
    const headGroup=jockeyGroup.children[jockeyGroup.children.length-1];
    if(!headGroup||!headGroup.userData.isHead) return;

    headGroup.updateWorldMatrix(true,false);
    headGroup.getWorldPosition(_headWorldPos);
    _lookMatrix.lookAt(cam.position,_headWorldPos,THREE.Object3D.DefaultUp);
    _targetQuat.setFromRotationMatrix(_lookMatrix);
    headGroup.parent.updateWorldMatrix(true,false);
    headGroup.parent.getWorldQuaternion(_parentWorldQuat);
    _parentWorldQuat.invert();
    headGroup.quaternion.copy(_targetQuat.premultiply(_parentWorldQuat));

    const texSet=headGroup.userData.multiAngle;
    const mat=headGroup.userData.headMat;
    const mesh=headGroup.userData.headMesh;

    const rotY=horseRoot.rotation.y;
    _horseForward.set(Math.cos(rotY),0,-Math.sin(rotY)).normalize();
    _camToHead.subVectors(cam.position,_headWorldPos);
    _camToHead.y=0;
    _camToHead.normalize();

    const angle=Math.atan2(
        _horseForward.x*_camToHead.z-_horseForward.z*_camToHead.x,
        _horseForward.x*_camToHead.x+_horseForward.z*_camToHead.z
    );
    const deg=angle*180/Math.PI;

    let zone='front';
    if(deg<=-135||deg>=135) zone='back';
    else if(deg>=45&&deg<135) zone=texSet.swapSideViews?'side_r':'side';
    else if(deg<=-45&&deg>-135) zone=texSet.swapSideViews?'side':'side_r';

    const riderBody=jockeyGroup.userData.riderBody;
    if(riderBody){
        const bodyPeek=texSet.bodyPeek ?? 0.45;
        const sideSign=deg>=0?1:-1;
        const targetZ=(zone==='front'||zone==='back') ? sideSign*(bodyPeek*0.42) : sideSign*bodyPeek;
        const targetY=texSet.name==='liberty' ? -0.18 : 0;
        riderBody.position.z += (targetZ-riderBody.position.z)*0.22;
        riderBody.position.y += (targetY-riderBody.position.y)*0.22;
    }

    if(texSet.name==='liberty'||texSet.name==='lt'){
        const targetGeo=(zone==='front'||zone==='back') ? headGroup.userData.frontGeo : headGroup.userData.sideGeo;
        if(mesh.geometry!==targetGeo) mesh.geometry=targetGeo;
    }

    const newTex=texSet[zone];
    if(newTex&&mat.map!==newTex){
        mat.map=newTex;
        mat.needsUpdate=true;
    }
}

// --- TAPPING ---
function startTapping(){
    if(tapping)return;tapping=true;playerHorse.taps=0;
    const st=Date.now();
    const ti=setInterval(()=>{
        let r=(10-(Date.now()-st)/1000).toFixed(1);
        if(r<=0){r=0;clearInterval(ti);endTapping();}
        document.getElementById('timer-display').innerText=r;
    },100);
}
document.getElementById('tap-zone').addEventListener('pointerdown',e=>{e.preventDefault();playerHorse.taps++;});

async function endTapping(){
    tappingDone=true;
    document.getElementById('tapping-phase').classList.add('hidden');
    if(isMultiplayer&&gameDocRef){
        await db.runTransaction(async(t)=>{
            const s=await t.get(gameDocRef);const d=s.data();
            const players=(d.players||[]).slice();
            if(players[myPlayerSlot]) players[myPlayerSlot].taps=playerHorse.taps;
            const allDone=players.every(p=>p.taps!==null);
            t.update(gameDocRef,{players,status:allDone?'racing':'tapping'});
        });
    } else { startSoloRace(); }
}

// --- RACE ---
let raceStarted=false;
function startRaceFromData(d){
    if(raceStarted)return;raceStarted=true;
    const rng=mulberry32(d.seed);
    const humans=d.players||[];
    humans.forEach((p,idx)=>{
        gameHorses.push({name:p.name,taps:p.taps,isPlayer:p.id===myPlayerId,color:p.color,number:p.number,isHuman:true,style:Math.floor(rng()*3)});
    });
    const usedNums=new Set(humans.map(p=>p.number));
    const botsNeeded=6-humans.length;
    for(let i=0;i<botsNeeded;i++){
        let n;do{n=Math.floor(rng()*20)+1;}while(usedNums.has(n));usedNums.add(n);
        gameHorses.push({name:genName(),taps:Math.floor(rng()*45)+20,isPlayer:false,color:botColors[i%botColors.length],number:n,style:Math.floor(rng()*3),isHuman:false});
    }
    buildAndStartRace(rng);
}

function startSoloRace(){
    if(raceStarted)return;raceStarted=true;
    const rng=mulberry32(Date.now());
    gameHorses.push(playerHorse);
    for(let i=0;i<5;i++){
        let n;do{n=Math.floor(rng()*20)+1;}while(gameHorses.some(h=>h.number===n));
        gameHorses.push({name:genName(),taps:Math.floor(rng()*45)+20,isPlayer:false,color:botColors[i],number:n,style:Math.floor(rng()*3),isHuman:false});
    }
    buildAndStartRace(rng);
}

function buildAndStartRace(rng){
    // FIX: Hide title so it doesn't overlap race UI
    document.getElementById('main-title').classList.add('hidden');
    document.getElementById('race-phase').classList.remove('hidden');
    raceStartTime=Date.now();
    for(let i=gameHorses.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[gameHorses[i],gameHorses[j]]=[gameHorses[j],gameHorses[i]];}
    const mascotPool=[0,1,2,3,4,5];
    for(let i=mascotPool.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[mascotPool[i],mascotPool[j]]=[mascotPool[j],mascotPool[i]];}

    gameHorses.forEach((h,i)=>{
        h.angle=START_ANGLE-(0.02+i*.015);
        h.baseSpeed=AVG_SPEED*.85+(h.taps*0.000007);
        h.earlyMod=h.style===0?1.08:h.style===1?0.98:0.92;
        h.lateMod=h.style===0?0.94:h.style===1?1.04:1.12;
        h.energy=1;h.finished=false;h.laneOffset=5+i*8;
        const model=createHorse(h.color,h.number,mascotPool[i]);
        scene.add(model.root);h.model=model;
    });
    updateLB();animate();
}

function updateLB(){
    const sorted=[...gameHorses].sort((a,b)=>{if(a.finished&&!b.finished)return-1;if(!a.finished&&b.finished)return 1;return b.angle-a.angle;});
    const list=document.getElementById('standings-list');list.innerHTML='';
    sorted.forEach((h,i)=>{
        list.innerHTML+=`<div class="lb-row${h.isPlayer?' you':''}"><span class="lb-num">${h.number}</span><div class="lb-color" style="background:${h.color}"></div><span class="lb-name">${h.name}</span></div>`;
    });
}
function showNotif(t){const e=document.createElement('div');e.className='finish-notif';e.innerText=t;
document.getElementById('notifications-container').appendChild(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),500);},3000);}

const clock=new THREE.Clock();
function animate(){
    if(!raceFinished)requestAnimationFrame(animate);
    const time=clock.getElapsedTime(),gSpeed=24;
    if(!raceFinished){
        const el=((Date.now()-raceStartTime)/1000);
        document.getElementById('race-timer').innerText=`${Math.floor(el/60)}:${(el%60).toFixed(1).padStart(4,'0')}`;
    }
    let leader=null,leaderAngle=-999,maxA=-999;
    gameHorses.forEach(h=>{if(h.angle>maxA)maxA=h.angle;});
    const progress=(maxA-START_ANGLE)/(FINISH_ANGLE-START_ANGLE);
    if(progress>.78&&!stretchCalled){
        stretchCalled=true;camMode='stretch';
        const sc=document.getElementById('stretch-call');sc.innerHTML="AND DOWN THE<br>STRETCH THEY COME!";sc.classList.add('show');
        setTimeout(()=>sc.classList.remove('show'),3500);
    }
    

    gameHorses.forEach((h,i)=>{
        const raceMod=progress<.5?h.earlyMod:h.lateMod;
        h.energy+=(Math.random()-.5)*.003;h.energy=Math.max(.93,Math.min(1.07,h.energy));
        h.angle+=Math.max(h.baseSpeed*raceMod*h.energy+(Math.random()-.0005)*.0001,.0004);
        const rank=gameHorses.filter(o=>o.angle>h.angle).length;
        h.targetLane=Math.max(5,Math.min(5+rank*5.5+Math.sin(time*.5+i)*2,DIRT_W-8));
        gameHorses.forEach((other,j)=>{
            if(i===j)return;
            const angleDist=Math.abs(h.angle-other.angle),laneDist=Math.abs(h.laneOffset-other.laneOffset);
            if(angleDist<0.045&&laneDist<6){
                const push=(6-laneDist)*0.1;
                if(h.laneOffset>other.laneOffset) h.laneOffset+=push; else h.laneOffset-=push;
            }
        });
        h.laneOffset+=(h.targetLane-h.laneOffset)*.025;
        const r=BASE_R+h.laneOffset;
        const x=Math.cos(h.angle)*r*TRACK_SX,z=Math.sin(h.angle)*r;
        const dx=-Math.sin(h.angle)*r*TRACK_SX,dz=Math.cos(h.angle)*r;
        h.model.root.position.set(x,0,z);h.model.root.rotation.y=Math.atan2(-dz,dx);

        const c=time*gSpeed+i*1.7,bound=Math.max(0,Math.sin(c))*2;
        h.model.body.position.y=bound;h.model.body.rotation.z=Math.sin(c)*.06;
        h.model.legs.forEach((leg,li)=>{
            const offset=li<2?0:Math.PI;
            const swing=Math.sin(c+offset+(li%2?0.7:0))*.55;
            leg.thigh.rotation.z=swing;
            leg.shin.rotation.z=li<2?(.2+Math.max(0,-swing)*1.2):(-.1+Math.max(0,swing)*1);
        });
        h.model.jG.position.y=9.2+bound*.28;
        updateHeadAngle(h.model.root,h.model.jG,camera);

        if(h.angle>=FINISH_ANGLE&&!h.finished){
            h.finished=true;finishOrder.push(h);
            showNotif(`🏁 #${h.number} ${h.name} finishes.`);
        }
        if(!h.finished&&h.angle>leaderAngle){leaderAngle=h.angle;leader=h;}
    });
    updateLB();

    if(leader){
        const r=BASE_R+leader.laneOffset+(camMode==='broadcast'?70:25);
        const camPos=camMode==='broadcast'?new THREE.Vector3(Math.cos(leader.angle+.06)*r*TRACK_SX,32,Math.sin(leader.angle+.06)*r):new THREE.Vector3(80,55,-(BASE_R+DIRT_W/2)+15);
        camera.position.lerp(camPos,.08);
        camTarget.lerp(new THREE.Vector3(Math.cos(leader.angle)*BASE_R*TRACK_SX,5,Math.sin(leader.angle)*BASE_R),.08);
        camera.lookAt(camTarget);
    }

    if(finishOrder.length===gameHorses.length&&!raceFinished){
        raceFinished=true;
        setTimeout(()=>{
            const rl=document.getElementById('results-list');
            finishOrder.forEach((h,i)=>{
                const t=i===0?'WIN':i===1?'PLACE':i===2?'SHOW':`${i+1}TH`;
                rl.innerHTML+=`<div class="result-row"><span class="result-place">${t}</span><div class="lb-color" style="background:${h.color}"></div><span style="color:${h.isPlayer?'#ffeb3b':'#fff'}">#${h.number} ${h.name}${h.isPlayer?' ⭐':''}</span></div>`;
            });
            document.getElementById('results-modal').style.display='flex';
        },2000);
    }
    renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
</body>
</html>
