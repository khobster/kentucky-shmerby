<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Shmerby</title>
    <style>
        /* Blocky Arcade Aesthetic */
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #6bd0e0; /* Sky blue from Smashy Road */
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow-x: hidden;
            user-select: none;
        }

        h1 { 
            color: #ffd700; 
            font-size: 28px; 
            text-shadow: 4px 4px 0px #000; 
            margin-bottom: 40px;
        }
        
        .hidden { display: none !important; }

        #game-container { max-width: 800px; margin: 0 auto; }

        /* Chunky UI Elements */
        #tap-zone {
            width: 100%;
            height: 300px;
            background-color: #e53935;
            border: 8px solid #000;
            box-shadow: 0px 10px 0px #b71c1c;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 16px;
            cursor: pointer;
            margin-top: 20px;
            box-sizing: border-box;
            color: white;
            line-height: 1.8;
            text-shadow: 2px 2px 0px #000;
            border-radius: 8px;
        }

        #tap-zone:active { 
            transform: translateY(10px);
            box-shadow: 0px 0px 0px #b71c1c;
        }

        button {
            padding: 15px 30px;
            font-size: 16px;
            font-family: 'Press Start 2P', monospace;
            cursor: pointer;
            background: #ffeb3b;
            color: #000;
            border: 6px solid #000;
            box-shadow: 0px 6px 0px #f57f17;
            margin-top: 20px;
            text-transform: uppercase;
        }
        button:hover { background: #fff176; }
        button:disabled { background: #999; box-shadow: 0px 6px 0px #666; cursor: not-allowed; }

        /* Voxel 3D Race Track */
        #race-phase {
            perspective: 800px; /* Gives the 3D depth */
            margin-top: 50px;
        }

        #track-container {
            background-color: #545454; /* Asphalt grey */
            border-left: 60px solid #a4e054; /* Chunky green grass */
            border-right: 60px solid #a4e054;
            border-top: 8px solid #000;
            border-bottom: 8px solid #000;
            padding: 20px 0;
            /* Tilt the track back to mimic the screenshot */
            transform: rotateX(45deg); 
            box-shadow: 0px 20px 0px #3b3b3b;
            position: relative;
        }

        .lane {
            border-bottom: 6px dashed #fff; /* Road markings */
            position: relative;
            height: 60px;
            text-align: left;
            margin-bottom: 10px;
        }
        .lane:last-child { border-bottom: none; }
        
        .horse-wrapper {
            position: absolute;
            left: 0;
            top: 10px;
            transition: left 0.1s linear;
            display: flex;
            flex-direction: column;
            align-items: center;
            /* Counter-rotate the horses so they stand straight up on the tilted track */
            transform: rotateX(-45deg); 
            transform-origin: bottom center;
        }

        /* Voxel/Blocky CSS Horse */
        .voxel-horse {
            width: 30px;
            height: 20px;
            background: #8B4513;
            border: 4px solid #000;
            position: relative;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.3);
        }
        .voxel-horse::after {
            content: '';
            position: absolute;
            right: -10px;
            top: -15px;
            width: 15px;
            height: 15px;
            background: #8B4513;
            border: 4px solid #000;
        }

        .horse-name { 
            font-size: 8px; 
            color: #fff; 
            background: #000; 
            padding: 4px; 
            white-space: nowrap; 
            margin-bottom: 25px; /* Push name above the horse head */
            border: 2px solid #fff;
        }
        
        .finish-line {
            position: absolute;
            right: 10%;
            top: 0;
            bottom: 0;
            width: 20px;
            background: repeating-linear-gradient( 0deg, #fff, #fff 15px, #000 15px, #000 30px );
            border-left: 4px solid #000;
            z-index: 0;
        }

        #timer-display { font-size: 40px; color: #fff; text-shadow: 4px 4px #000; }
        #race-status { text-shadow: 3px 3px #000; line-height: 1.5; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>KENTUCKY SHMERBY</h1>

        <div id="lobby">
            <p>Your Racer:</p>
            <h2 id="player-horse-name" style="color: #ffeb3b; text-shadow: 2px 2px #000;">Loading...</h2>
            <button id="start-btn" disabled>ENTER DERBY</button>
        </div>

        <div id="tapping-phase" class="hidden">
            <h2 id="timer-display">10.0</h2>
            <div id="tap-zone">
                TAP HERE!<br><br>
                Speed, not force.<br>
                Your count is hidden!
            </div>
        </div>

        <div id="race-phase" class="hidden">
            <h2 id="race-status">THE GATES ARE OPEN!</h2>
            <div id="track-container">
                <div class="finish-line"></div>
                <div id="lanes"></div>
            </div>
            <button id="restart-btn" class="hidden" onclick="location.reload()">Race Again</button>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let playerHorse = { name: "Loading...", taps: 0, isPlayer: true, color: "#e91e63" }; // Player is pink/red
        let horses = [];
        let timeRemaining = 10;
        const TAP_DURATION = 10; 

        const fallbackWords = ["Cosmic", "Potato", "Angry", "Toaster", "Midnight", "Goblin", "Sweaty", "Pancake", "Liquid", "Taxpayer"];
        const botColors = ["#2196f3", "#4caf50", "#ff9800", "#9c27b0", "#00bcd4"];

        // --- DOM ELEMENTS ---
        const lobbyEl = document.getElementById('lobby');
        const startBtn = document.getElementById('start-btn');
        const tapPhaseEl = document.getElementById('tapping-phase');
        const tapZone = document.getElementById('tap-zone');
        const timerDisplay = document.getElementById('timer-display');
        const racePhaseEl = document.getElementById('race-phase');
        const lanesEl = document.getElementById('lanes');
        const raceStatus = document.getElementById('race-status');
        const restartBtn = document.getElementById('restart-btn');

        // --- INIT ---
        async function fetchRandomName() {
            try {
                const response = await fetch('https://random-word-api.herokuapp.com/word?number=2');
                const words = await response.json();
                return words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
            } catch (e) {
                const w1 = fallbackWords[Math.floor(Math.random() * fallbackWords.length)];
                const w2 = fallbackWords[Math.floor(Math.random() * fallbackWords.length)];
                return `${w1} ${w2}`;
            }
        }

        async function initGame() {
            playerHorse.name = await fetchRandomName();
            document.getElementById('player-horse-name').innerText = playerHorse.name;
            startBtn.disabled = false;
        }

        initGame();

        // --- PHASE 2: TAPPING LOGIC ---
        startBtn.addEventListener('click', () => {
            lobbyEl.classList.add('hidden');
            tapPhaseEl.classList.remove('hidden');
            
            let startTime = Date.now();
            let timerInterval = setInterval(() => {
                let elapsedTime = (Date.now() - startTime) / 1000;
                timeRemaining = (TAP_DURATION - elapsedTime).toFixed(1);
                
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    clearInterval(timerInterval);
                    startRace();
                }
                timerDisplay.innerText = timeRemaining;
            }, 100);
        });

        tapZone.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            playerHorse.taps++;
        });

        // --- PHASE 3: RACE LOGIC ---
        async function startRace() {
            tapPhaseEl.classList.add('hidden');
            racePhaseEl.classList.remove('hidden');

            horses.push(playerHorse);
            for(let i=0; i<3; i++){
                horses.push({
                    name: await fetchRandomName(),
                    taps: Math.floor(Math.random() * 50) + 30, 
                    isPlayer: false,
                    color: botColors[i % botColors.length]
                });
            }

            horses.sort(() => Math.random() - 0.5);

            horses.forEach((horse, index) => {
                horse.position = 0; 
                horse.baseSpeed = 0.1; 
                horse.speedMultiplier = horse.baseSpeed + (horse.taps * 0.005); 

                const lane = document.createElement('div');
                lane.className = 'lane';
                lane.innerHTML = `
                    <div class="horse-wrapper" id="horse-${index}">
                        <div class="horse-name" style="color: ${horse.isPlayer ? '#ffeb3b' : '#fff'}">${horse.name}</div>
                        <div class="voxel-horse" style="background-color: ${horse.color};"></div>
                    </div>
                `;
                lanesEl.appendChild(lane);
                
                // Color the bot horse heads to match their body
                document.styleSheets[0].insertRule(`#horse-${index} .voxel-horse::after { background-color: ${horse.color}; }`, 0);
            });

            setTimeout(raceLoop, 1000); 
        }

        function raceLoop() {
            let raceFinished = false;

            horses.forEach((horse, index) => {
                let randomJitter = Math.random() * 0.3; 
                horse.position += horse.speedMultiplier + randomJitter;

                const horseDiv = document.getElementById(`horse-${index}`);
                horseDiv.style.left = `${horse.position}%`;

                if (horse.position >= 80 && !raceFinished) { 
                    raceFinished = true;
                    raceStatus.innerText = `${horse.name} WINS!`;
                    if(horse.isPlayer) {
                        raceStatus.style.color = "#ffeb3b";
                        raceStatus.innerText += `\n(You had ${horse.taps} taps!)`; 
                    } else {
                        raceStatus.style.color = "#fff";
                        raceStatus.innerText += `\n(You lost. You had ${playerHorse.taps} taps.)`;
                    }
                    restartBtn.classList.remove('hidden');
                }
            });

            if (!raceFinished) {
                requestAnimationFrame(raceLoop);
            }
        }
    </script>
</body>
</html>
