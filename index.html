<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Shmerby</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #87CEEB; /* Sky blue */
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            user-select: none;
        }

        h1 { color: #ffd700; font-size: 28px; text-shadow: 4px 4px 0px #000; margin-bottom: 20px; }
        .hidden { display: none !important; }
        #game-container { max-width: 900px; margin: 0 auto; position: relative; }

        /* Tapping Phase UI */
        #tap-zone {
            width: 100%; max-width: 600px; height: 300px; margin: 20px auto;
            background-color: #e53935; border: 8px solid #000;
            box-shadow: 0px 10px 0px #b71c1c;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; color: white; line-height: 1.8;
            text-shadow: 2px 2px 0px #000; border-radius: 8px;
        }
        #tap-zone:active { transform: translateY(10px); box-shadow: 0px 0px 0px #b71c1c; }

        button {
            padding: 15px 30px; font-size: 16px; font-family: inherit; cursor: pointer;
            background: #ffeb3b; color: #000; border: 6px solid #000;
            box-shadow: 0px 6px 0px #f57f17; margin-top: 20px; text-transform: uppercase;
        }
        button:hover { background: #fff176; }
        button:disabled { background: #999; box-shadow: 0px 6px 0px #666; cursor: not-allowed; }

        /* 3D Derby Track */
        #race-phase {
            perspective: 800px; 
            margin-top: 40px;
            display: flex;
            justify-content: center;
        }

        #track-container {
            width: 750px;
            height: 450px;
            background-color: #4caf50; /* Infield Grass */
            border-radius: 50%;
            border: 55px solid #bd9a6c; /* Dirt Track */
            outline: 6px solid #fff; /* Outer White Rail */
            box-shadow: inset 0 0 0 6px #fff; /* Inner White Rail */
            transform: rotateX(55deg); 
            position: relative;
            transform-style: preserve-3d;
        }

        /* The Finish Line */
        .finish-line {
            position: absolute;
            top: -55px; left: 50%;
            width: 10px; height: 55px;
            background: repeating-linear-gradient(0deg, #fff, #fff 8px, #000 8px, #000 16px);
            border-left: 2px solid #000;
        }

        /* Voxel Horses & Jockeys */
        .racer-wrapper {
            position: absolute;
            left: 50%; top: 50%; 
            display: flex; flex-direction: column; align-items: center;
            margin-left: -15px; margin-top: -15px;
        }

        .voxel-horse {
            width: 32px; height: 14px;
            background-color: #5c3a21; /* Dark brown horse body */
            position: relative;
            box-shadow: 0px 4px 0px rgba(0,0,0,0.5); 
            border-radius: 4px;
        }
        
        /* Horse Head */
        .voxel-horse::before {
            content: ''; position: absolute;
            right: -8px; top: -10px; width: 12px; height: 14px;
            background-color: #5c3a21;
            border-radius: 4px;
        }

        /* Colored Saddlecloth with Number */
        .saddle {
            position: absolute;
            left: 8px; top: 0px;
            width: 14px; height: 12px;
            background-color: var(--racer-color);
            color: #fff;
            font-size: 8px;
            font-family: sans-serif;
            font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #000;
            box-sizing: border-box;
            text-shadow: 1px 1px 0px #000;
        }

        /* Jockey */
        .jockey {
            position: absolute;
            left: 10px; top: -10px;
            width: 10px; height: 10px;
            background-color: var(--racer-color);
            border-radius: 5px 5px 0 0;
            border: 1px solid #000;
        }
        /* Jockey Helmet bill */
        .jockey::after {
            content: ''; position: absolute;
            right: -3px; top: 2px; width: 4px; height: 2px;
            background-color: #000;
        }

        .horse-name { 
            font-size: 10px; color: #fff; background: rgba(0,0,0,0.7); 
            padding: 4px; white-space: nowrap; margin-bottom: 25px; 
            border: 2px solid #fff;
            transform: rotateX(-55deg) translateY(-20px); 
        }

        #timer-display { font-size: 40px; color: #fff; text-shadow: 4px 4px #000; }
        #race-status { text-shadow: 3px 3px #000; line-height: 1.5; height: 60px; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>KENTUCKY SHMERBY</h1>

        <div id="lobby">
            <p>Your Steed:</p>
            <h2 id="player-horse-name" style="color: #ffeb3b; text-shadow: 2px 2px #000;">Loading...</h2>
            <button id="start-btn" disabled>ENTER DERBY</button>
        </div>

        <div id="tapping-phase" class="hidden">
            <h2 id="timer-display">10.0</h2>
            <div id="tap-zone">
                TAP HERE!<br><br>
                Speed, not force.<br>
                Your count is hidden!
            </div>
        </div>

        <div id="race-phase" class="hidden">
            <div style="position: absolute; top: -60px; width: 100%;">
                <h2 id="race-status">AND THEY'RE OFF!</h2>
                <button id="restart-btn" class="hidden" onclick="location.reload()">Race Again</button>
            </div>
            
            <div id="track-container">
                <div class="finish-line"></div>
                <div id="racers-container"></div>
            </div>
        </div>
    </div>

    <script>
        // --- LOCAL DICTIONARY ---
        const adjectives = ["Cosmic", "Angry", "Sweaty", "Liquid", "Temperamental", "Melancholy", "Magnificent", "Electric", "Spicy", "Crusty", "Glorious", "Chaotic", "Feral", "Majestic", "Jumpy", "Greasy", "Secretive", "Loud", "Invisible", "Chunky", "Darkliest", "Grumbling", "Wobbly", "Suspicious", "Neon"];
        const nouns = ["Potato", "Toaster", "Goblin", "Pancake", "Taxpayer", "Turnip", "Spatula", "Spittles", "Overworking", "Inflorescences", "Meatball", "Cylinder", "Noodle", "Grandpa", "Socks", "Algorithm", "Bicycle", "Gravel", "Cactus", "Tornado", "Sandwich", "Disappointment", "Chihuahua"];

        function fetchRandomName() {
            const adj = adjectives[Math.floor(Math.random() * adjectives.length)];
            const noun = nouns[Math.floor(Math.random() * nouns.length)];
            return `${adj} ${noun}`;
        }

        // --- GAME STATE ---
        let playerHorse = { name: "Loading...", taps: 0, isPlayer: true, color: "#e91e63", number: Math.floor(Math.random() * 20) + 1 }; 
        let horses = [];
        let timeRemaining = 10;
        const TAP_DURATION = 10; 
        const botColors = ["#2196f3", "#4caf50", "#ff9800", "#9c27b0"];

        // Track Dimensions
        const laneRadii = [
            { rx: 340, ry: 190 }, 
            { rx: 355, ry: 205 }, 
            { rx: 370, ry: 220 }, 
            { rx: 385, ry: 235 }  
        ];

        // --- DOM ELEMENTS ---
        const lobbyEl = document.getElementById('lobby');
        const startBtn = document.getElementById('start-btn');
        const tapPhaseEl = document.getElementById('tapping-phase');
        const tapZone = document.getElementById('tap-zone');
        const timerDisplay = document.getElementById('timer-display');
        const racePhaseEl = document.getElementById('race-phase');
        const racersContainer = document.getElementById('racers-container');
        const raceStatus = document.getElementById('race-status');
        const restartBtn = document.getElementById('restart-btn');

        // --- INIT ---
        function initGame() {
            playerHorse.name = fetchRandomName();
            document.getElementById('player-horse-name').innerText = `#${playerHorse.number} ${playerHorse.name}`;
            startBtn.disabled = false;
        }
        initGame();

        // --- PHASE 2: TAPPING LOGIC ---
        startBtn.addEventListener('click', () => {
            lobbyEl.classList.add('hidden');
            tapPhaseEl.classList.remove('hidden');
            
            let startTime = Date.now();
            let timerInterval = setInterval(() => {
                let elapsedTime = (Date.now() - startTime) / 1000;
                timeRemaining = (TAP_DURATION - elapsedTime).toFixed(1);
                
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    clearInterval(timerInterval);
                    startRace();
                }
                timerDisplay.innerText = timeRemaining;
            }, 100);
        });

        tapZone.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            playerHorse.taps++;
        });

        // --- PHASE 3: RACE LOGIC ---
        function startRace() {
            tapPhaseEl.classList.add('hidden');
            racePhaseEl.classList.remove('hidden');

            horses.push(playerHorse);
            for(let i=0; i<3; i++){
                horses.push({
                    name: fetchRandomName(),
                    taps: Math.floor(Math.random() * 50) + 30, 
                    isPlayer: false,
                    color: botColors[i],
                    number: Math.floor(Math.random() * 20) + 1
                });
            }
            horses.sort(() => Math.random() - 0.5);

            horses.forEach((horse, index) => {
                horse.angle = -Math.PI / 2; 
                
                // MATH FOR APPROX 2-MINUTE RACE
                horse.baseSpeed = 0.00080; 
                horse.speedMultiplier = horse.baseSpeed + (horse.taps * 0.000004); 
                
                horse.lane = laneRadii[index];

                const wrapper = document.createElement('div');
                wrapper.className = 'racer-wrapper';
                wrapper.id = `horse-${index}`;
                
                wrapper.innerHTML = `
                    <div class="horse-name" style="color: ${horse.isPlayer ? '#ffeb3b' : '#fff'}">${horse.name}</div>
                    <div class="voxel-horse" style="--racer-color: ${horse.color};">
                        <div class="jockey"></div>
                        <div class="saddle">${horse.number}</div>
                    </div>
                `;
                racersContainer.appendChild(wrapper);
            });

            setTimeout(raceLoop, 1000); 
        }

        function raceLoop() {
            let raceFinished = false;

            horses.forEach((horse, index) => {
                // Tiny random jitter so the horses visually fight for position
                let randomJitter = (Math.random() * 0.0002); 
                horse.angle += horse.speedMultiplier + randomJitter;

                let x = horse.lane.rx * Math.cos(horse.angle);
                let y = horse.lane.ry * Math.sin(horse.angle);

                let rotation = Math.atan2(
                    horse.lane.ry * Math.cos(horse.angle), 
                    -horse.lane.rx * Math.sin(horse.angle)
                ) * (180 / Math.PI);

                const horseDiv = document.getElementById(`horse-${index}`);
                horseDiv.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;

                // 3 * Math.PI / 2 represents one full lap back to the top center line
                if (horse.angle >= (3 * Math.PI / 2) && !raceFinished) { 
                    raceFinished = true;
                    
                    if(horse.isPlayer) {
                        raceStatus.style.color = "#ffeb3b";
                        raceStatus.innerText = `YOU WIN! \n ${horse.name} takes the Derby!`; 
                    } else {
                        raceStatus.style.color = "#fff";
                        raceStatus.innerText = `YOU LOST. \n ${horse.name} takes the Derby!`;
                    }
                    restartBtn.classList.remove('hidden');
                }
            });

            if (!raceFinished) {
                requestAnimationFrame(raceLoop);
            }
        }
    </script>
</body>
</html>
