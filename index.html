<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Shmerby</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #87CEEB; 
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; /* Crucial for the dynamic camera */
            user-select: none;
        }

        h1 { color: #ffd700; font-size: 28px; text-shadow: 4px 4px 0px #000; margin: 20px 0; position: relative; z-index: 10; }
        .hidden { display: none !important; }
        #game-container { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; align-items: center; }

        /* Tapping Phase UI */
        #tap-zone {
            width: 90%; max-width: 600px; height: 300px; margin: 20px auto;
            background-color: #e53935; border: 8px solid #000;
            box-shadow: 0px 10px 0px #b71c1c;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; color: white; line-height: 1.8;
            text-shadow: 2px 2px 0px #000; border-radius: 8px;
            z-index: 10; position: relative;
        }
        #tap-zone:active { transform: translateY(10px); box-shadow: 0px 0px 0px #b71c1c; }

        button {
            padding: 15px 30px; font-size: 16px; font-family: inherit; cursor: pointer;
            background: #ffeb3b; color: #000; border: 6px solid #000;
            box-shadow: 0px 6px 0px #f57f17; margin-top: 20px; text-transform: uppercase;
            z-index: 10; position: relative;
        }
        button:hover { background: #fff176; }
        button:disabled { background: #999; box-shadow: 0px 6px 0px #666; cursor: not-allowed; }

        /* Broadcast Chyron (Bottom Ticker) */
        #leaderboard {
            position: absolute;
            bottom: 0; left: 0; width: 100%; height: 60px;
            background: rgba(17, 17, 17, 0.95);
            border-top: 4px solid #ffd700;
            display: flex; align-items: center; justify-content: space-evenly;
            z-index: 100;
            font-size: 10px;
            box-shadow: 0px -4px 15px rgba(0,0,0,0.5);
        }
        .leaderboard-row {
            display: flex; align-items: center;
        }
        .leaderboard-place { color: #ffd700; margin-right: 8px; font-size: 12px; }
        .leaderboard-color {
            width: 15px; height: 15px; border: 2px solid #fff; margin-right: 8px;
            display: inline-block;
        }
        .leaderboard-name {
            white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis;
        }

        /* 3D Derby Track - CAMERA VIEW */
        #race-phase {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            perspective: 800px; 
            display: flex; justify-content: center; align-items: center;
            overflow: hidden;
        }

        #track-container {
            width: 900px; height: 500px;
            background-color: #4caf50; 
            border-radius: 50%;
            border: 70px solid #bd9a6c; 
            outline: 6px solid #fff; 
            box-shadow: inset 0 0 0 6px #fff; 
            /* Initial transform, JS will override this to zoom and pan */
            transform: scale(1.6) rotateX(55deg); 
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
        }

        .finish-line {
            position: absolute; top: -70px; left: 50%;
            width: 14px; height: 70px;
            background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px);
            border-left: 2px solid #000;
        }

        /* Voxel Horses & Jockeys */
        .racer-wrapper {
            position: absolute; left: 50%; top: 50%; 
            display: flex; flex-direction: column; align-items: center;
            margin-left: -22px; margin-top: -22px;
        }

        /* Muybridge Gallop Animation */
        @keyframes gallop {
            0% { transform: translateY(0px) rotate(-3deg); }
            25% { transform: translateY(-5px) rotate(3deg); }
            50% { transform: translateY(0px) rotate(-3deg); }
            75% { transform: translateY(3px) rotate(-6deg); }
            100% { transform: translateY(0px) rotate(-3deg); }
        }

        .voxel-horse {
            width: 44px; height: 20px;
            background-color: #5c3a21; 
            position: relative;
            box-shadow: 0px 6px 0px rgba(0,0,0,0.5); 
            border-radius: 4px;
            /* Apply the galloping animation */
            animation: gallop 0.35s infinite linear;
        }
        
        .voxel-horse::before {
            content: ''; position: absolute;
            right: -10px; top: -14px; width: 16px; height: 20px;
            background-color: #5c3a21; border-radius: 4px;
        }

        .saddle {
            position: absolute; left: 12px; top: 0px;
            width: 18px; height: 16px;
            background-color: var(--racer-color);
            color: #fff; font-size: 10px; font-family: sans-serif; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #000; box-sizing: border-box; text-shadow: 1px 1px 0px #000;
        }

        /* Plump Robot Jockey */
        .jockey {
            position: absolute; left: 12px; top: -18px;
            width: 18px; height: 18px;
            background-color: #e0e0e0; /* Silver body */
            border-radius: 8px 8px 4px 4px; /* Plump shape */
            border: 2px solid #000;
            box-shadow: inset -2px -2px 0px rgba(0,0,0,0.3);
        }
        /* Glowing Cyan Eye */
        .jockey::before {
            content: ''; position: absolute;
            right: 2px; top: 4px; width: 6px; height: 4px;
            background-color: #0ff; border-radius: 2px;
            box-shadow: 0 0 4px #0ff;
        }
        /* Antenna Line */
        .jockey::after {
            content: ''; position: absolute;
            left: 6px; top: -6px; width: 2px; height: 6px;
            background-color: #000;
        }
        /* Red Antenna Ball */
        .antenna-ball {
            position: absolute; left: 4px; top: -10px;
            width: 6px; height: 6px; background-color: #f00;
            border-radius: 50%; border: 1px solid #000;
        }

        #timer-display { font-size: 40px; color: #fff; text-shadow: 4px 4px #000; position: relative; z-index: 10;}
        #race-status { text-shadow: 3px 3px #000; line-height: 1.5; text-align: center; position: relative; z-index: 10;}
        
        #lobby { position: relative; z-index: 10; margin-top: 50px; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1 id="main-title">KENTUCKY SHMERBY</h1>

        <div id="lobby">
            <p>Your Steed:</p>
            <h2 id="player-horse-name" style="color: #ffeb3b; text-shadow: 2px 2px #000;">Generating Steed...</h2>
            <button id="start-btn" disabled>LOADING...</button>
        </div>

        <div id="tapping-phase" class="hidden">
            <h2 id="timer-display">10.0</h2>
            <div id="tap-zone">
                TAP HERE!<br><br>
                Speed, not force.<br>
                Your count is hidden!
            </div>
        </div>

        <div id="race-phase" class="hidden">
            
            <div style="position: absolute; top: 20px; width: 100%; z-index: 100;">
                <h2 id="race-status">AND THEY'RE OFF!</h2>
                <button id="restart-btn" class="hidden" onclick="location.reload()" style="margin: 0 auto; display: block;">Race Again</button>
            </div>
            
            <div id="track-container">
                <div class="finish-line"></div>
                <div id="racers-container"></div>
            </div>

            <div id="leaderboard">
                <div id="standings-list" style="display: flex; width: 100%; justify-content: space-evenly;"></div>
            </div>

        </div>
    </div>

    <script>
        // --- THE DATAMUSE ENGINE ---
        let adjsPool = [];
        let nounsPool = [];

        async function buildDictionaryPool() {
            const letters = "abcdefghijklmnopqrstuvwxyz";
            let fetchPromises = [];

            for(let i=0; i<3; i++) {
                let adjLetter = letters[Math.floor(Math.random() * 26)];
                let nounLetter = letters[Math.floor(Math.random() * 26)];
                
                fetchPromises.push(fetch(`https://api.datamuse.com/words?sp=${adjLetter}*&md=p&max=1000`));
                fetchPromises.push(fetch(`https://api.datamuse.com/words?sp=${nounLetter}*&md=p&max=1000`));
            }

            try {
                const responses = await Promise.all(fetchPromises);
                for (let res of responses) {
                    let data = await res.json();
                    adjsPool.push(...data.filter(w => w.tags && w.tags.includes('adj')).map(w => w.word));
                    nounsPool.push(...data.filter(w => w.tags && w.tags.includes('n')).map(w => w.word));
                }
            } catch (e) {
                console.log("Dictionary backup triggered.");
            }
        }

        function generateWeirdName() {
            if (adjsPool.length === 0 || nounsPool.length === 0) return "Cosmic Potato";
            let adj = adjsPool[Math.floor(Math.random() * adjsPool.length)];
            let noun = nounsPool[Math.floor(Math.random() * nounsPool.length)];
            return `${adj.charAt(0).toUpperCase() + adj.slice(1)} ${noun.charAt(0).toUpperCase() + noun.slice(1)}`;
        }

        // --- GAME STATE & CAMERA ---
        let playerHorse = { name: "Loading...", taps: 0, isPlayer: true, color: "#e91e63", number: Math.floor(Math.random() * 20) + 1 }; 
        let horses = [];
        let timeRemaining = 10;
        const TAP_DURATION = 10; 
        const botColors = ["#2196f3", "#4caf50", "#ff9800", "#9c27b0"];
        
        // Camera smoothing variables
        let camX = 0;
        let camY = 0;

        // Expanded Track Radii for the larger track
        const laneRadii = [
            { rx: 395, ry: 195 }, 
            { rx: 415, ry: 215 }, 
            { rx: 435, ry: 235 }, 
            { rx: 455, ry: 255 }  
        ];

        // --- DOM ELEMENTS ---
        const lobbyEl = document.getElementById('lobby');
        const startBtn = document.getElementById('start-btn');
        const tapPhaseEl = document.getElementById('tapping-phase');
        const tapZone = document.getElementById('tap-zone');
        const timerDisplay = document.getElementById('timer-display');
        const racePhaseEl = document.getElementById('race-phase');
        const racersContainer = document.getElementById('racers-container');
        const raceStatus = document.getElementById('race-status');
        const restartBtn = document.getElementById('restart-btn');
        const standingsList = document.getElementById('standings-list');
        const trackContainer = document.getElementById('track-container');
        const mainTitle = document.getElementById('main-title');

        // --- INIT ---
        async function initGame() {
            await buildDictionaryPool();
            playerHorse.name = generateWeirdName();
            document.getElementById('player-horse-name').innerText = `#${playerHorse.number} ${playerHorse.name}`;
            startBtn.disabled = false;
            startBtn.innerText = "ENTER DERBY";
        }
        initGame();

        // --- PHASE 2: TAPPING LOGIC ---
        startBtn.addEventListener('click', () => {
            lobbyEl.classList.add('hidden');
            mainTitle.classList.add('hidden'); // Hide title during action
            tapPhaseEl.classList.remove('hidden');
            
            let startTime = Date.now();
            let timerInterval = setInterval(() => {
                let elapsedTime = (Date.now() - startTime) / 1000;
                timeRemaining = (TAP_DURATION - elapsedTime).toFixed(1);
                
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    clearInterval(timerInterval);
                    startRace();
                }
                timerDisplay.innerText = timeRemaining;
            }, 100);
        });

        tapZone.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            playerHorse.taps++;
        });

        // --- PHASE 3: RACE LOGIC ---
        function startRace() {
            tapPhaseEl.classList.add('hidden');
            racePhaseEl.classList.remove('hidden');

            horses.push(playerHorse);
            
            for(let i=0; i<3; i++){
                let newNum;
                do { newNum = Math.floor(Math.random() * 20) + 1; } while (horses.some(h => h.number === newNum));

                horses.push({
                    name: generateWeirdName(),
                    taps: Math.floor(Math.random() * 50) + 30, 
                    isPlayer: false,
                    color: botColors[i],
                    number: newNum
                });
            }
            horses.sort(() => Math.random() - 0.5);

            horses.forEach((horse, index) => {
                horse.angle = -Math.PI / 2; 
                
                // MATH FOR APPROX 2-MINUTE RACE
                horse.baseSpeed = 0.00080; 
                horse.speedMultiplier = horse.baseSpeed + (horse.taps * 0.000004); 
                
                horse.lane = laneRadii[index];

                const wrapper = document.createElement('div');
                wrapper.className = 'racer-wrapper';
                wrapper.id = `horse-${index}`;
                
                // Robot Jockey implemented here
                wrapper.innerHTML = `
                    <div class="voxel-horse" style="--racer-color: ${horse.color};">
                        <div class="jockey"><div class="antenna-ball"></div></div>
                        <div class="saddle">${horse.number}</div>
                    </div>
                `;
                racersContainer.appendChild(wrapper);
            });

            updateLeaderboard();
            setTimeout(raceLoop, 1000); 
        }

        function updateLeaderboard() {
            const sorted = [...horses].sort((a, b) => b.angle - a.angle);
            
            standingsList.innerHTML = '';
            sorted.forEach((horse, i) => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row';
                let place = i === 0 ? '1ST' : i === 1 ? '2ND' : i === 2 ? '3RD' : '4TH';
                
                row.innerHTML = `
                    <span class="leaderboard-place">${place}</span>
                    <div class="leaderboard-color" style="background-color: ${horse.color};"></div>
                    <span class="leaderboard-name" style="color: ${horse.isPlayer ? '#ffeb3b' : '#fff'};">
                        #${horse.number} ${horse.name}
                    </span>
                `;
                standingsList.appendChild(row);
            });
        }

        function raceLoop() {
            let raceFinished = false;

            const sortedHorses = [...horses].map((h, i) => ({...h, index: i})).sort((a, b) => {
                 let yA = a.lane.ry * Math.sin(a.angle);
                 let yB = b.lane.ry * Math.sin(b.angle);
                 return yA - yB;
            });

            // Calculate Lead Horse for the Camera Pan
            const leadHorse = horses[sortedHorses[sortedHorses.length - 1].index]; // The one furthest ahead
            let targetCamX = -leadHorse.lane.rx * Math.cos(leadHorse.angle);
            let targetCamY = -leadHorse.lane.ry * Math.sin(leadHorse.angle);

            // Smoothly move the camera toward the lead horse (Lerp)
            camX += (targetCamX - camX) * 0.05;
            camY += (targetCamY - camY) * 0.05;
            
            // Apply scale (zoom) and translation (pan) to the track
            trackContainer.style.transform = `scale(1.7) rotateX(55deg) translate(${camX * 0.6}px, ${camY * 0.6}px)`;

            horses.forEach((horse, i) => {
                let randomJitter = (Math.random() * 0.0002); 
                horse.angle += horse.speedMultiplier + randomJitter;
            });

            updateLeaderboard();

            sortedHorses.forEach((horseData, zIndex) => {
                const horse = horses[horseData.index];
                const index = horseData.index;

                let x = horse.lane.rx * Math.cos(horse.angle);
                let y = horse.lane.ry * Math.sin(horse.angle);

                let rotation = Math.atan2(
                    horse.lane.ry * Math.cos(horse.angle), 
                    -horse.lane.rx * Math.sin(horse.angle)
                ) * (180 / Math.PI);

                const horseDiv = document.getElementById(`horse-${index}`);
                horseDiv.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;
                horseDiv.style.zIndex = zIndex; 

                // Finish line check
                if (horse.angle >= (3 * Math.PI / 2) && !raceFinished) { 
                    raceFinished = true;
                    
                    if(horse.isPlayer) {
                        raceStatus.style.color = "#ffeb3b";
                        raceStatus.innerText = `YOU WIN! \n ${horse.name} takes the Derby!`; 
                    } else {
                        raceStatus.style.color = "#fff";
                        raceStatus.innerText = `YOU LOST. \n ${horse.name} takes the Derby!`;
                    }
                    restartBtn.classList.remove('hidden');
                }
            });

            if (!raceFinished) {
                requestAnimationFrame(raceLoop);
            }
        }
    </script>
</body>
</html>
