<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Shmerby</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', monospace; background-color: #87CEEB; color: #fff;
            text-align: center; margin: 0; padding: 0; overflow: hidden; user-select: none;
        }
        h1 { color: #ffd700; font-size: 28px; text-shadow: 4px 4px 0px #000; margin: 20px 0; position: relative; z-index: 10; }
        .hidden { display: none !important; }
        #game-container { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; align-items: center; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #lobby, #tapping-phase { position: relative; z-index: 10; margin-top: 50px; }

        #tap-zone {
            width: 90%; max-width: 600px; height: 300px; margin: 20px auto; background-color: #e53935; border: 8px solid #000;
            box-shadow: 0px 10px 0px #b71c1c; display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; color: white; line-height: 1.8; text-shadow: 2px 2px 0px #000; border-radius: 8px;
        }
        #tap-zone:active { transform: translateY(10px); box-shadow: 0px 0px 0px #b71c1c; }

        button {
            padding: 15px 30px; font-size: 16px; font-family: inherit; cursor: pointer; background: #ffeb3b; color: #000;
            border: 6px solid #000; box-shadow: 0px 6px 0px #f57f17; margin-top: 20px; text-transform: uppercase;
        }
        button:hover { background: #fff176; }

        #notifications-container {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; flex-direction: column; align-items: center; pointer-events: none;
        }
        .finish-notif {
            background: rgba(0,0,0,0.9); border: 2px solid #ffd700; color: #fff;
            padding: 12px 24px; margin-bottom: 8px; font-size: 12px; border-radius: 4px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.6); transition: opacity 0.5s ease;
        }

        #leaderboard {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60px;
            background: rgba(17, 17, 17, 0.95); border-top: 4px solid #ffd700;
            display: flex; align-items: center; justify-content: center;
            z-index: 100; box-shadow: 0px -4px 15px rgba(0,0,0,0.5); padding: 0 10px; box-sizing: border-box;
        }
        #standings-list { display: flex; width: 100%; height: 100%; max-width: 1400px; justify-content: space-evenly; align-items: center; gap: 8px; }
        .leaderboard-row {
            display: flex; align-items: center; flex: 1; min-width: 0;
            background: #333; padding: 8px 10px; border-radius: 4px; border: 1px solid #555;
        }
        .leaderboard-place { color: #ffd700; margin-right: 6px; font-size: 10px; flex-shrink: 0; }
        .leaderboard-color { width: 12px; height: 12px; border: 2px solid #fff; margin-right: 6px; display: inline-block; flex-shrink: 0; }
        .leaderboard-name { white-space: nowrap; font-size: 10px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-grow: 1; text-align: left; }

        #results-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 6px solid #ffd700; padding: 30px;
            z-index: 1000; text-align: left; width: 90%; max-width: 500px; display: none; flex-direction: column; box-shadow: 0px 20px 50px rgba(0,0,0,0.8);
        }
        .result-row { display: flex; align-items: center; margin: 10px 0; font-size: 12px; border-bottom: 2px dashed #444; padding-bottom: 10px; }
        .result-place { width: 60px; color: #ffd700; }

        #timer-display { font-size: 40px; color: #fff; text-shadow: 4px 4px #000; position: relative; z-index: 10;}
        #race-status { text-shadow: 3px 3px #000; line-height: 1.5; text-align: center; position: relative; z-index: 10;}

        /* Lap counter */
        #lap-display {
            position: absolute; top: 60px; width: 100%; z-index: 100; font-size: 14px;
            text-shadow: 2px 2px #000; color: #ffd700;
        }
    </style>
</head>
<body>

    <div id="game-container">
        <div id="canvas-container"></div>
        <h1 id="main-title">KENTUCKY SHMERBY</h1>

        <div id="lobby">
            <p>Your Steed:</p>
            <h2 id="player-horse-name" style="color: #ffeb3b; text-shadow: 2px 2px #000;">Loading...</h2>
            <p style="font-size: 10px; color: #ffd700; margin-top: 10px;">1½ MILES • THE TEST OF THE CHAMPION</p>
            <button id="start-btn">ENTER DERBY</button>
        </div>

        <div id="tapping-phase" class="hidden">
            <h2 id="timer-display">10.0</h2>
            <div id="tap-zone">
                TAP HERE!<br><br>Speed, not force.<br>Your count is hidden!
            </div>
        </div>

        <div id="race-phase" class="hidden">
            <div style="position: absolute; top: 20px; width: 100%; z-index: 100;">
                <h2 id="race-status">AND THEY'RE OFF!</h2>
            </div>
            <div id="lap-display"></div>
            <div id="notifications-container"></div>
            <div id="leaderboard">
                <div id="standings-list"></div>
            </div>
        </div>

        <div id="results-modal">
            <h2 id="results-title" style="text-align: center; margin-bottom: 20px;"></h2>
            <div id="results-list"></div>
            <button onclick="location.reload()" style="margin: 20px auto 0 auto; display: block;">Race Again</button>
        </div>
    </div>

    <script>
        // --- GAME DATA ---
        const derbyWords = [
            "Affirmed","Agile","Alan","Dale","Dreaming","Alysheba","American","Pharoah","Animal","Kingdom",
            "Apollo","Aristides","Assault","Authentic","Azra","Baden","Barbaro","Behave","Yourself","Ben","Ali",
            "Brush","Brown","Black","Gold","Bold","Forbes","Venture","Brokers","Tip","Bubbling","Over",
            "Buchanan","Burgoo","King","California","Chrome","Cannonade","Canonero","Carry","Back","Cavalcade",
            "Chant","Charismatic","Chateaugay","Citation","Clyde","Dusen","Count","Fleet","Turf","Country","House",
            "Dark","Star","Decidedly","Determine","Donau","Donerail","Dust","Commander","Elwood","Exterminator",
            "Ferdinand","Flying","Ebony","Fonso","Foolish","Pleasure","Forward","Pass","Funny","Cide","Fusaichi",
            "Pegasus","Gallahadion","Gallant","Fox","Gato","Del","Sol","Genuine","Risk","George","Smith","Giacomo",
            "Gin","Grindstone","Halma","Hill","Gail","Hindoo","Eminence","Hoop","Iron","Liege","Jet","Pilot",
            "Joe","Cotton","Johnstown","Judge","Himes","Justify","Kauai","Lawrin","Leonatus","Gibson","Lil",
            "Tee","Lookout","Lord","Murphy","Lucky","Debonair","Macbeth","Mage","Majestic","Prince","Mandaloun",
            "Manuel","Meridian","Middleground","Mine","Bird","Monarchos","Montrose","Morvich","Mystik","Dan",
            "Needles","Northern","Dancer","Nyquist","Rosebud","Omaha","Omar","Khayyam","Orb","Paul","Jones",
            "Pensive","Pink","Plaudit","Pleasant","Colony","Ponder","Proud","Clarion","Real","Quiet","Regret",
            "Reigh","Strike","Riley","Riva","Ridge","Sea","Hero","Seattle","Slew","Secretariat","Shut","Out",
            "Silver","Charm","Barton","Huon","Smarty","Sovereignty","Spectacular","Bid","Spend","Buck",
            "Spokane","Stone","Street","Sense","Sunday","Silence","Sunny","Halo","Super","Saver","Swale","Swaps",
            "Thunder","Gulch","Tim","Tam","Tomy","Lee","Twenty","Grand","Typhoon","Unbridled","Vagrant","Venetian",
            "Way","War","Admiral","Emblem","Whirlaway","Whiskery","Winning","Colors","Wintergreen","Worth","Zev"
        ];

        function generateWeirdName() {
            return derbyWords[Math.floor(Math.random() * derbyWords.length)] + ' ' + derbyWords[Math.floor(Math.random() * derbyWords.length)];
        }

        let playerHorse = { name: generateWeirdName(), taps: 0, isPlayer: true, color: "#e91e63", number: Math.floor(Math.random() * 20) + 1 };
        let gameHorses = [];
        let finishOrder = [];
        let raceFinished = false;
        const botColors = ["#2196f3", "#4caf50", "#ff9800", "#9c27b0", "#00bcd4"];

        const trackScaleX = 1.6;
        const baseRadius = 180;
        const laneWidth = 8;

        // Belmont = 1.5 miles. We'll do 1.5 laps.
        // Start at -PI/2, one lap = 2*PI, so 1.5 laps = 3*PI
        // Finish angle = -PI/2 + 3*PI = 5*PI/2
        const START_ANGLE_OFFSET = -Math.PI / 2;
        const FINISH_ANGLE = START_ANGLE_OFFSET + (3 * Math.PI); // 1.5 laps

        // --- THREE.JS SETUP ---
        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0x87CEEB);
        scene.fog = new THREE.Fog(0x87CEEB, 500, 900);

        const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 1, 2000);
        let cameraLookTarget = new THREE.Vector3(0, 0, 0);

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        container.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.55);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.8);
        dirLight.position.set(100, 200, 50);
        dirLight.castShadow = true;
        dirLight.shadow.camera.top = 400; dirLight.shadow.camera.bottom = -400;
        dirLight.shadow.camera.left = -400; dirLight.shadow.camera.right = 400;
        scene.add(dirLight);

        // --- MOWED GRASS TEXTURE ---
        function createMowedGrassTexture() {
            const c = document.createElement('canvas');
            c.width = 512; c.height = 512;
            const ctx = c.getContext('2d');
            const stripeCount = 16;
            const stripeH = c.height / stripeCount;
            for (let i = 0; i < stripeCount; i++) {
                ctx.fillStyle = i % 2 === 0 ? '#4da843' : '#3d8a35';
                ctx.fillRect(0, i * stripeH, c.width, stripeH);
            }
            const imageData = ctx.getImageData(0, 0, c.width, c.height);
            for (let j = 0; j < imageData.data.length; j += 4) {
                const n = (Math.random() - 0.5) * 10;
                imageData.data[j] += n; imageData.data[j+1] += n; imageData.data[j+2] += n;
            }
            ctx.putImageData(imageData, 0, 0);
            const tex = new THREE.CanvasTexture(c);
            tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
            tex.repeat.set(4, 4);
            return tex;
        }

        // --- ZEBRA STRIPE TEXTURE ---
        function createZebraTexture() {
            const c = document.createElement('canvas');
            c.width = 128; c.height = 128;
            const ctx = c.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, 128, 128);
            ctx.fillStyle = '#222222';
            const stripes = 8;
            const h = 128 / stripes;
            for (let i = 0; i < stripes; i += 2) {
                ctx.fillRect(0, i * h, 128, h);
            }
            return new THREE.CanvasTexture(c);
        }

        // --- SADDLE TEXTURE ---
        function createSaddleTexture(number, color) {
            const c = document.createElement('canvas');
            c.width = 128; c.height = 128;
            const ctx = c.getContext('2d');
            ctx.fillStyle = color; ctx.fillRect(0, 0, 128, 128);
            ctx.strokeStyle = '#000'; ctx.lineWidth = 8; ctx.strokeRect(0, 0, 128, 128);
            ctx.fillStyle = '#fff'; ctx.font = 'bold 70px "Press Start 2P", monospace';
            ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
            ctx.fillText(number, 64, 72);
            ctx.lineWidth = 4; ctx.strokeText(number, 64, 72);
            return new THREE.CanvasTexture(c);
        }

        // --- MARSHMALLOW JOCKEY FACE TEXTURE ---
        function createMarshmallowFaceTexture() {
            const c = document.createElement('canvas');
            c.width = 128; c.height = 128;
            const ctx = c.getContext('2d');
            // Yellow base
            ctx.fillStyle = '#FFD54F';
            ctx.fillRect(0, 0, 128, 128);
            // Eyes - simple cute dots
            ctx.fillStyle = '#222';
            ctx.beginPath(); ctx.arc(45, 50, 5, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(83, 50, 5, 0, Math.PI * 2); ctx.fill();
            // Eye highlights
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(47, 48, 2, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(85, 48, 2, 0, Math.PI * 2); ctx.fill();
            // Cute little smile
            ctx.strokeStyle = '#222'; ctx.lineWidth = 3;
            ctx.beginPath(); ctx.arc(64, 65, 12, 0.15 * Math.PI, 0.85 * Math.PI, false); ctx.stroke();
            // Rosy cheeks
            ctx.fillStyle = 'rgba(255, 130, 130, 0.4)';
            ctx.beginPath(); ctx.arc(35, 68, 8, 0, Math.PI * 2); ctx.fill();
            ctx.beginPath(); ctx.arc(93, 68, 8, 0, Math.PI * 2); ctx.fill();
            return new THREE.CanvasTexture(c);
        }
        const marshmallowFaceTex = createMarshmallowFaceTexture();
        const zebraTex = createZebraTexture();

        // --- BUILD TRACK ---
        function createTrack() {
            const trackGroup = new THREE.Group();

            // Mowed infield
            const grassGeo = new THREE.CircleGeometry(baseRadius - 2, 64);
            const grassMat = new THREE.MeshLambertMaterial({ map: createMowedGrassTexture() });
            const grass = new THREE.Mesh(grassGeo, grassMat);
            grass.rotation.x = -Math.PI / 2; grass.receiveShadow = true;
            trackGroup.add(grass);

            // Dirt track
            const dirtGeo = new THREE.RingGeometry(baseRadius - 2, baseRadius + 60, 64);
            const dirtMat = new THREE.MeshLambertMaterial({ color: 0xbd9a6c });
            const dirt = new THREE.Mesh(dirtGeo, dirtMat);
            dirt.rotation.x = -Math.PI / 2; dirt.receiveShadow = true;
            trackGroup.add(dirt);

            // Outer ground
            const outerGeo = new THREE.RingGeometry(baseRadius + 60, baseRadius + 250, 64);
            const outerMat = new THREE.MeshLambertMaterial({ color: 0x5a9e4b });
            const outer = new THREE.Mesh(outerGeo, outerMat);
            outer.rotation.x = -Math.PI / 2; outer.position.y = -0.1;
            trackGroup.add(outer);

            // Rails
            const railMat = new THREE.MeshBasicMaterial({ color: 0xffffff });
            const innerRail = new THREE.Mesh(new THREE.TorusGeometry(baseRadius - 2, 0.5, 8, 64), railMat);
            innerRail.rotation.x = -Math.PI / 2; innerRail.position.y = 2;
            trackGroup.add(innerRail);
            const outerRail = new THREE.Mesh(new THREE.TorusGeometry(baseRadius + 60, 0.5, 8, 64), railMat);
            outerRail.rotation.x = -Math.PI / 2; outerRail.position.y = 2;
            trackGroup.add(outerRail);

            // Checkered finish line
            const fc = document.createElement('canvas');
            fc.width = 64; fc.height = 64;
            const fctx = fc.getContext('2d');
            for (let r = 0; r < 8; r++) for (let col = 0; col < 8; col++) {
                fctx.fillStyle = (r + col) % 2 === 0 ? '#fff' : '#000';
                fctx.fillRect(col * 8, r * 8, 8, 8);
            }
            const finishLine = new THREE.Mesh(
                new THREE.PlaneGeometry(64, 4),
                new THREE.MeshBasicMaterial({ map: new THREE.CanvasTexture(fc) })
            );
            finishLine.rotation.x = -Math.PI / 2; finishLine.rotation.z = Math.PI / 2;
            finishLine.position.set(0, 0.15, -(baseRadius + 29));
            trackGroup.add(finishLine);

            trackGroup.scale.set(trackScaleX, 1, 1);
            scene.add(trackGroup);
        }
        createTrack();

        // --- 3D ZEBRA + MARSHMALLOW JOCKEY ---
        function create3DZebra(colorHex, number) {
            const horseGroup = new THREE.Group();
            const bodyGroup = new THREE.Group();
            horseGroup.add(bodyGroup);

            const zebraMat = new THREE.MeshLambertMaterial({ map: zebraTex });
            const darkMat = new THREE.MeshLambertMaterial({ color: 0x222222 });
            const whiteMat = new THREE.MeshLambertMaterial({ color: 0xeeeeee });
            const hoofMat = new THREE.MeshLambertMaterial({ color: 0x111111 });

            // Body - striped
            const body = new THREE.Mesh(new THREE.BoxGeometry(12, 5, 5), zebraMat);
            body.position.y = 6; body.castShadow = true;
            bodyGroup.add(body);

            // Saddlecloths with number
            const saddleTex = createSaddleTexture(number.toString(), colorHex);
            const saddleMat = new THREE.MeshLambertMaterial({ map: saddleTex });
            const saddleR = new THREE.Mesh(new THREE.PlaneGeometry(6, 4.5), saddleMat);
            saddleR.position.set(0, 6, 2.6);
            bodyGroup.add(saddleR);
            const saddleL = new THREE.Mesh(new THREE.PlaneGeometry(6, 4.5), saddleMat);
            saddleL.position.set(0, 6, -2.6); saddleL.rotation.y = Math.PI;
            bodyGroup.add(saddleL);

            // Neck - striped
            const neck = new THREE.Mesh(new THREE.BoxGeometry(3, 7, 3.5), zebraMat);
            neck.position.set(6, 9, 0); neck.rotation.z = 0.4; neck.castShadow = true;
            bodyGroup.add(neck);

            // HEAD WITH HOOD (covers the face so we don't need detail)
            // Hood is a colored piece that matches the saddlecloth
            const hoodMat = new THREE.MeshLambertMaterial({ color: new THREE.Color(colorHex) });
            
            // Base head shape under the hood
            const head = new THREE.Mesh(new THREE.BoxGeometry(5, 3.5, 3.5), darkMat);
            head.position.set(9, 12, 0); head.castShadow = true;
            bodyGroup.add(head);

            // Hood covering the head
            const hood = new THREE.Mesh(new THREE.BoxGeometry(5.2, 3.7, 3.7), hoodMat);
            hood.position.set(9, 12, 0);
            bodyGroup.add(hood);

            // Eye holes in the hood (dark circles on the sides)
            const eyeHoleGeo = new THREE.CircleGeometry(0.7, 8);
            const eyeHoleMat = new THREE.MeshBasicMaterial({ color: 0x111111 });
            const eyeL = new THREE.Mesh(eyeHoleGeo, eyeHoleMat);
            eyeL.position.set(10, 12.5, 1.86); eyeL.rotation.y = 0;
            bodyGroup.add(eyeL);
            const eyeR = new THREE.Mesh(eyeHoleGeo, eyeHoleMat);
            eyeR.position.set(10, 12.5, -1.86); eyeR.rotation.y = Math.PI;
            bodyGroup.add(eyeR);

            // Snout peeking out of hood
            const snout = new THREE.Mesh(new THREE.BoxGeometry(2.5, 2, 2.5), whiteMat);
            snout.position.set(12, 11.2, 0);
            bodyGroup.add(snout);
            // Nostrils
            const nostrilMat = new THREE.MeshBasicMaterial({ color: 0x333333 });
            const nostrilL = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 6), nostrilMat);
            nostrilL.position.set(13.3, 11.2, 0.6); bodyGroup.add(nostrilL);
            const nostrilR = new THREE.Mesh(new THREE.SphereGeometry(0.3, 6, 6), nostrilMat);
            nostrilR.position.set(13.3, 11.2, -0.6); bodyGroup.add(nostrilR);

            // Ears poking through hood
            const earGeo = new THREE.ConeGeometry(0.7, 2.5, 4);
            const earL = new THREE.Mesh(earGeo, hoodMat);
            earL.position.set(8.5, 14.5, 1.2); earL.rotation.z = 0.2;
            bodyGroup.add(earL);
            const earR = new THREE.Mesh(earGeo, hoodMat);
            earR.position.set(8.5, 14.5, -1.2); earR.rotation.z = 0.2;
            bodyGroup.add(earR);

            // Mane (dark tufts between ears)
            const maneMat = new THREE.MeshLambertMaterial({ color: 0x111111 });
            for (let i = 0; i < 4; i++) {
                const tuft = new THREE.Mesh(new THREE.BoxGeometry(1, 2, 3), maneMat);
                tuft.position.set(5 + i * 1.4, 10.5 + i * 0.6, 0);
                tuft.rotation.z = 0.3 + i * 0.05;
                bodyGroup.add(tuft);
            }

            // Tail
            const tail = new THREE.Mesh(new THREE.BoxGeometry(4, 1.5, 1.5), darkMat);
            tail.position.set(-8.5, 6.5, 0); tail.rotation.z = -0.3;
            bodyGroup.add(tail);

            // Legs (striped) with hooves
            const legGeo = new THREE.BoxGeometry(1.5, 5.5, 1.5);
            legGeo.translate(0, -2.75, 0);
            const legs = [];
            const legPositions = [[4,4,1.8],[4,4,-1.8],[-4,4,1.8],[-4,4,-1.8]];
            legPositions.forEach(pos => {
                const leg = new THREE.Mesh(legGeo, zebraMat);
                leg.position.set(pos[0], pos[1], pos[2]); leg.castShadow = true;
                bodyGroup.add(leg);
                const hoof = new THREE.Mesh(new THREE.BoxGeometry(1.8, 1.2, 1.8), hoofMat);
                hoof.position.set(0, -5.5, 0);
                leg.add(hoof);
                legs.push(leg);
            });

            // --- MARSHMALLOW JOCKEY (chubby little guy sitting on the back) ---
            const jockeyGroup = new THREE.Group();
            jockeyGroup.position.set(-1, 9.5, 0);
            bodyGroup.add(jockeyGroup);

            const marshmallowColor = 0xFFD54F; // Yellow
            const mMat = new THREE.MeshLambertMaterial({ color: marshmallowColor });

            // Chubby body (squashed sphere)
            const jBody = new THREE.Mesh(new THREE.SphereGeometry(2.8, 16, 16), mMat);
            jBody.scale.set(0.85, 1, 0.85);
            jBody.position.y = 2;
            jockeyGroup.add(jBody);

            // Head with face texture
            const headFaceMat = new THREE.MeshLambertMaterial({ map: marshmallowFaceTex });
            const jHead = new THREE.Mesh(new THREE.SphereGeometry(2, 16, 16), headFaceMat);
            jHead.position.y = 5;
            // Rotate so face points forward (+X direction on the horse)
            jHead.rotation.y = -Math.PI / 2;
            jockeyGroup.add(jHead);

            // Stubby arms
            const armGeo = new THREE.SphereGeometry(0.8, 8, 8);
            armGeo.scale(1, 1.4, 1);
            const armL = new THREE.Mesh(armGeo, mMat);
            armL.position.set(0.8, 3.2, 2.2); armL.rotation.z = -0.6;
            jockeyGroup.add(armL);
            const armR = new THREE.Mesh(armGeo, mMat);
            armR.position.set(0.8, 3.2, -2.2); armR.rotation.z = -0.6;
            jockeyGroup.add(armR);

            // Little sailor hat (like Stay Puft)
            const hatBrim = new THREE.Mesh(
                new THREE.CylinderGeometry(2.3, 2.3, 0.3, 16),
                new THREE.MeshLambertMaterial({ color: 0xffffff })
            );
            hatBrim.position.y = 6.8;
            jockeyGroup.add(hatBrim);
            const hatTop = new THREE.Mesh(
                new THREE.CylinderGeometry(1.6, 1.8, 1.2, 16),
                new THREE.MeshLambertMaterial({ color: 0xffffff })
            );
            hatTop.position.y = 7.5;
            jockeyGroup.add(hatTop);
            // Hat band (colored to match saddlecloth)
            const hatBand = new THREE.Mesh(
                new THREE.CylinderGeometry(1.85, 1.85, 0.35, 16),
                new THREE.MeshLambertMaterial({ color: new THREE.Color(colorHex) })
            );
            hatBand.position.y = 7.1;
            jockeyGroup.add(hatBand);

            return { root: horseGroup, bodyGroup, head, tail, legs, jockeyGroup, jHead };
        }

        // --- UI ---
        document.getElementById('player-horse-name').innerText = `#${playerHorse.number} ${playerHorse.name}`;

        document.getElementById('start-btn').addEventListener('click', () => {
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('main-title').classList.add('hidden');
            document.getElementById('tapping-phase').classList.remove('hidden');
            let startTime = Date.now();
            let timerInterval = setInterval(() => {
                let remaining = (10 - (Date.now() - startTime) / 1000).toFixed(1);
                if (remaining <= 0) { remaining = 0; clearInterval(timerInterval); start3DRace(); }
                document.getElementById('timer-display').innerText = remaining;
            }, 100);
        });

        document.getElementById('tap-zone').addEventListener('pointerdown', (e) => { e.preventDefault(); playerHorse.taps++; });

        // --- RACE ---
        function start3DRace() {
            document.getElementById('tapping-phase').classList.add('hidden');
            document.getElementById('race-phase').classList.remove('hidden');

            gameHorses.push(playerHorse);
            for (let i = 0; i < 5; i++) {
                let newNum; do { newNum = Math.floor(Math.random() * 20) + 1; } while (gameHorses.some(h => h.number === newNum));
                gameHorses.push({ name: generateWeirdName(), taps: Math.floor(Math.random() * 50) + 30, isPlayer: false, color: botColors[i], number: newNum });
            }
            gameHorses.sort(() => Math.random() - 0.5);

            gameHorses.forEach((horse, index) => {
                horse.angle = START_ANGLE_OFFSET - (0.05 + (index * 0.03));
                horse.baseSpeed = 0.0008;
                horse.speedMultiplier = horse.baseSpeed + (horse.taps * 0.000008);
                horse.radius = baseRadius + 10 + (index * laneWidth);
                horse.finished = false;

                const model = create3DZebra(horse.color, horse.number);
                scene.add(model.root);
                horse.model = model;
            });

            updateLeaderboard();
            animate();
        }

        function updateLeaderboard() {
            const sorted = [...gameHorses].sort((a, b) => {
                if (a.finished && !b.finished) return -1;
                if (!a.finished && b.finished) return 1;
                return b.angle - a.angle;
            });
            const list = document.getElementById('standings-list');
            list.innerHTML = '';
            sorted.forEach((horse, i) => {
                let place = ['1ST','2ND','3RD','4TH','5TH','6TH'][i];
                list.innerHTML += `
                    <div class="leaderboard-row">
                        <span class="leaderboard-place">${place}</span>
                        <div class="leaderboard-color" style="background-color: ${horse.color};"></div>
                        <span class="leaderboard-name" style="color: ${horse.isPlayer ? '#ffeb3b' : '#fff'};">#${horse.number} ${horse.name}</span>
                    </div>`;
            });
        }

        function showNotif(text) {
            const el = document.createElement('div');
            el.className = 'finish-notif'; el.innerText = text;
            document.getElementById('notifications-container').appendChild(el);
            setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.remove(), 500); }, 3000);
        }

        // --- RENDER LOOP ---
        const clock = new THREE.Clock();

        function animate() {
            if (!raceFinished) requestAnimationFrame(animate);

            const time = clock.getElapsedTime();
            const gallopSpeed = 20;

            let activeLeader = null;
            let highestAngle = -999;

            // Calculate laps for display
            let leaderAngle = -999;
            gameHorses.forEach(h => { if (h.angle > leaderAngle) leaderAngle = h.angle; });
            const totalRace = FINISH_ANGLE - START_ANGLE_OFFSET; // 3*PI
            const progress = (leaderAngle - START_ANGLE_OFFSET) / totalRace;
            const currentLap = Math.min(Math.floor(progress * 1.5) + 1, 2); // 1 or 2
            if (!raceFinished) {
                const lapEl = document.getElementById('lap-display');
                if (progress < 0.667) {
                    lapEl.innerText = 'LAP 1 OF 1½';
                } else {
                    lapEl.innerText = 'FINAL LAP';
                    lapEl.style.color = '#ff4444';
                }
            }

            gameHorses.forEach((horse, i) => {
                horse.angle += horse.speedMultiplier + (Math.random() * 0.0004);

                const x = Math.cos(horse.angle) * horse.radius * trackScaleX;
                const z = Math.sin(horse.angle) * horse.radius;

                const dx = -Math.sin(horse.angle) * horse.radius * trackScaleX;
                const dz = Math.cos(horse.angle) * horse.radius;
                const tangent = Math.atan2(-dz, dx);

                horse.model.root.position.set(x, 0, z);
                horse.model.root.rotation.y = tangent;

                // Gallop animation
                const cycle = time * gallopSpeed + (i * 1.5);
                horse.model.bodyGroup.position.y = Math.abs(Math.sin(cycle)) * 2;
                horse.model.bodyGroup.rotation.z = Math.cos(cycle) * 0.12;
                horse.model.head.rotation.z = -0.15 + Math.sin(cycle) * 0.15;
                horse.model.tail.rotation.z = -0.3 + Math.sin(cycle) * 0.25;

                // Leg scissor
                const legSwing = Math.sin(cycle) * 0.7;
                horse.model.legs[0].rotation.z = legSwing;
                horse.model.legs[1].rotation.z = legSwing * 0.8;
                horse.model.legs[2].rotation.z = -legSwing;
                horse.model.legs[3].rotation.z = -legSwing * 0.8;

                // Jockey bounce (the little chub bounces on the back)
                horse.model.jockeyGroup.position.y = 9.5 + Math.abs(Math.sin(cycle)) * 1.2;
                horse.model.jockeyGroup.rotation.z = Math.sin(cycle) * 0.08;

                // Finish check
                if (horse.angle >= FINISH_ANGLE && !horse.finished) {
                    horse.finished = true;
                    finishOrder.push(horse);
                    let placeStr = finishOrder.length === 1 ? "WINS!" : finishOrder.length === 2 ? "takes 2nd!" : finishOrder.length === 3 ? "takes 3rd!" : "finishes.";
                    showNotif(`🏁 #${horse.number} ${horse.name} ${placeStr}`);
                }

                if (!horse.finished && horse.angle > highestAngle) {
                    highestAngle = horse.angle;
                    activeLeader = horse;
                }
            });

            updateLeaderboard();

            // Broadcast camera
            if (activeLeader) {
                const camAngle = activeLeader.angle - 0.15;
                const camRadius = activeLeader.radius + 65;
                const targetX = Math.cos(camAngle) * camRadius * trackScaleX;
                const targetZ = Math.sin(camAngle) * camRadius;
                camera.position.lerp(new THREE.Vector3(targetX, 35, targetZ), 0.05);

                const lookAngle = activeLeader.angle + 0.08;
                const lookX = Math.cos(lookAngle) * activeLeader.radius * trackScaleX;
                const lookZ = Math.sin(lookAngle) * activeLeader.radius;
                cameraLookTarget.lerp(new THREE.Vector3(lookX, 3, lookZ), 0.05);
                camera.lookAt(cameraLookTarget);
            }

            // End
            if (finishOrder.length === gameHorses.length && !raceFinished) {
                raceFinished = true;
                document.getElementById('race-status').innerText = "RACE COMPLETE!";
                document.getElementById('lap-display').innerText = '';
                setTimeout(() => {
                    const rList = document.getElementById('results-list');
                    finishOrder.forEach((h, i) => {
                        let title = i === 0 ? 'WIN' : i === 1 ? 'PLACE' : i === 2 ? 'SHOW' : `${i+1}TH`;
                        rList.innerHTML += `
                            <div class="result-row">
                                <span class="result-place">${title}</span>
                                <div class="leaderboard-color" style="background-color: ${h.color};"></div>
                                <span style="color: ${h.isPlayer ? '#ffeb3b' : '#fff'}">#${h.number} ${h.name}</span>
                            </div>`;
                    });
                    document.getElementById('results-title').innerText = finishOrder[0].isPlayer ? "DERBY CHAMPION!" : "YOU LOST";
                    document.getElementById('results-modal').style.display = 'flex';
                }, 3000);
            }

            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });
    </script>
</body>
</html>
