<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Shmerby</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #6bd0e0; 
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 20px;
            overflow: hidden;
            user-select: none;
        }

        h1 { color: #ffd700; font-size: 28px; text-shadow: 4px 4px 0px #000; margin-bottom: 20px; }
        .hidden { display: none !important; }
        #game-container { max-width: 900px; margin: 0 auto; position: relative; }

        /* Tapping Phase UI */
        #tap-zone {
            width: 100%; max-width: 600px; height: 300px; margin: 20px auto;
            background-color: #e53935; border: 8px solid #000;
            box-shadow: 0px 10px 0px #b71c1c;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; color: white; line-height: 1.8;
            text-shadow: 2px 2px 0px #000; border-radius: 8px;
        }
        #tap-zone:active { transform: translateY(10px); box-shadow: 0px 0px 0px #b71c1c; }

        button {
            padding: 15px 30px; font-size: 16px; font-family: inherit; cursor: pointer;
            background: #ffeb3b; color: #000; border: 6px solid #000;
            box-shadow: 0px 6px 0px #f57f17; margin-top: 20px; text-transform: uppercase;
        }
        button:hover { background: #fff176; }
        button:disabled { background: #999; box-shadow: 0px 6px 0px #666; cursor: not-allowed; }

        /* 3D Oval Track */
        #race-phase {
            perspective: 800px; /* The 3D camera */
            margin-top: 40px;
            display: flex;
            justify-content: center;
        }

        #track-container {
            width: 700px;
            height: 400px;
            background-color: #6bd0e0;
            border-radius: 50%;
            border: 60px solid #545454; /* The Asphalt Road */
            box-shadow: 0 0 0 15px #a4e054, inset 0 0 0 15px #a4e054; /* Grass borders */
            transform: rotateX(55deg); /* Tilts the track back into 3D space */
            position: relative;
            transform-style: preserve-3d;
        }

        /* The Finish Line */
        .finish-line {
            position: absolute;
            top: 0; left: 50%;
            width: 15px; height: 60px;
            background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px);
            transform: translateY(-60px); /* Move onto the top part of the road */
        }

        /* Smashy Road Style Cars */
        .racer-wrapper {
            position: absolute;
            left: 50%; top: 50%; /* Start at center, math will move them */
            display: flex; flex-direction: column; align-items: center;
            /* Center the anchor point */
            margin-left: -15px; margin-top: -10px;
        }

        .car {
            width: 30px; height: 18px;
            background-color: var(--car-color);
            border: 3px solid #000;
            border-radius: 4px;
            position: relative;
            box-shadow: 0px 4px 0px rgba(0,0,0,0.5); /* 3D thickness */
        }
        /* Windshield */
        .car::after {
            content: ''; position: absolute;
            right: 4px; top: 2px; bottom: 2px; width: 6px;
            background: #e0f7fa; border: 2px solid #000;
            border-radius: 2px;
        }

        .horse-name { 
            font-size: 10px; color: #fff; background: #000; 
            padding: 4px; white-space: nowrap; margin-bottom: 20px; 
            border: 2px solid #fff;
            /* Counter-rotate text so it faces the camera, not the track */
            transform: rotateX(-55deg) translateY(-20px); 
        }

        #timer-display { font-size: 40px; color: #fff; text-shadow: 4px 4px #000; }
        #race-status { text-shadow: 3px 3px #000; line-height: 1.5; height: 60px; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1>KENTUCKY SHMERBY</h1>

        <div id="lobby">
            <p>Your Derby Kart:</p>
            <h2 id="player-horse-name" style="color: #ffeb3b; text-shadow: 2px 2px #000;">Loading...</h2>
            <button id="start-btn" disabled>ENTER DERBY</button>
        </div>

        <div id="tapping-phase" class="hidden">
            <h2 id="timer-display">10.0</h2>
            <div id="tap-zone">
                TAP HERE!<br><br>
                Speed, not force.<br>
                Your count is hidden!
            </div>
        </div>

        <div id="race-phase" class="hidden">
            <div style="position: absolute; top: -60px; width: 100%;">
                <h2 id="race-status">THE GATES ARE OPEN!</h2>
                <button id="restart-btn" class="hidden" onclick="location.reload()">Race Again</button>
            </div>
            
            <div id="track-container">
                <div class="finish-line"></div>
                <div id="racers-container"></div>
            </div>
        </div>
    </div>

    <script>
        // --- GAME STATE ---
        let playerHorse = { name: "Loading...", taps: 0, isPlayer: true, color: "#e91e63" }; 
        let horses = [];
        let timeRemaining = 10;
        const TAP_DURATION = 10; 

        const fallbackWords = ["Cosmic", "Potato", "Angry", "Toaster", "Midnight", "Goblin", "Sweaty", "Pancake", "Liquid", "Taxpayer"];
        const botColors = ["#2196f3", "#4caf50", "#ff9800", "#9c27b0"];

        // Track Dimensions (matches CSS)
        const trackWidth = 700;
        const trackHeight = 400;
        // Lane radiuses (inner to outer)
        const laneRadii = [
            { rx: 320, ry: 170 }, 
            { rx: 340, ry: 190 }, 
            { rx: 360, ry: 210 }, 
            { rx: 380, ry: 230 }  
        ];

        // --- DOM ELEMENTS ---
        const lobbyEl = document.getElementById('lobby');
        const startBtn = document.getElementById('start-btn');
        const tapPhaseEl = document.getElementById('tapping-phase');
        const tapZone = document.getElementById('tap-zone');
        const timerDisplay = document.getElementById('timer-display');
        const racePhaseEl = document.getElementById('race-phase');
        const racersContainer = document.getElementById('racers-container');
        const raceStatus = document.getElementById('race-status');
        const restartBtn = document.getElementById('restart-btn');

        // --- INIT ---
        async function fetchRandomName() {
            try {
                const response = await fetch('https://random-word-api.herokuapp.com/word?number=2');
                const words = await response.json();
                return words.map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
            } catch (e) {
                const w1 = fallbackWords[Math.floor(Math.random() * fallbackWords.length)];
                const w2 = fallbackWords[Math.floor(Math.random() * fallbackWords.length)];
                return `${w1} ${w2}`;
            }
        }

        async function initGame() {
            playerHorse.name = await fetchRandomName();
            document.getElementById('player-horse-name').innerText = playerHorse.name;
            startBtn.disabled = false;
        }
        initGame();

        // --- PHASE 2: TAPPING LOGIC ---
        startBtn.addEventListener('click', () => {
            lobbyEl.classList.add('hidden');
            tapPhaseEl.classList.remove('hidden');
            
            let startTime = Date.now();
            let timerInterval = setInterval(() => {
                let elapsedTime = (Date.now() - startTime) / 1000;
                timeRemaining = (TAP_DURATION - elapsedTime).toFixed(1);
                
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    clearInterval(timerInterval);
                    startRace();
                }
                timerDisplay.innerText = timeRemaining;
            }, 100);
        });

        tapZone.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            playerHorse.taps++;
        });

        // --- PHASE 3: RACE LOGIC ---
        async function startRace() {
            tapPhaseEl.classList.add('hidden');
            racePhaseEl.classList.remove('hidden');

            horses.push(playerHorse);
            for(let i=0; i<3; i++){
                horses.push({
                    name: await fetchRandomName(),
                    taps: Math.floor(Math.random() * 50) + 30, 
                    isPlayer: false,
                    color: botColors[i]
                });
            }
            horses.sort(() => Math.random() - 0.5);

            horses.forEach((horse, index) => {
                // Start at top center (-90 degrees in radians)
                horse.angle = -Math.PI / 2; 
                horse.baseSpeed = 0.005; 
                horse.speedMultiplier = horse.baseSpeed + (horse.taps * 0.0003); 
                horse.lane = laneRadii[index];

                const wrapper = document.createElement('div');
                wrapper.className = 'racer-wrapper';
                wrapper.id = `horse-${index}`;
                
                // NO insertRule! Using inline CSS variables instead.
                wrapper.innerHTML = `
                    <div class="horse-name" style="color: ${horse.isPlayer ? '#ffeb3b' : '#fff'}">${horse.name}</div>
                    <div class="car" style="--car-color: ${horse.color};"></div>
                `;
                racersContainer.appendChild(wrapper);
            });

            setTimeout(raceLoop, 1000); 
        }

        function raceLoop() {
            let raceFinished = false;

            horses.forEach((horse, index) => {
                let randomJitter = (Math.random() * 0.002); 
                horse.angle += horse.speedMultiplier + randomJitter;

                // Calculate X and Y along the ellipse
                let x = horse.lane.rx * Math.cos(horse.angle);
                let y = horse.lane.ry * Math.sin(horse.angle);

                // Calculate rotation so the car faces the direction it's driving
                // atan2 gives us the angle of the tangent to the curve
                let rotation = Math.atan2(
                    horse.lane.ry * Math.cos(horse.angle), 
                    -horse.lane.rx * Math.sin(horse.angle)
                ) * (180 / Math.PI);

                const horseDiv = document.getElementById(`horse-${index}`);
                // Apply position and rotation
                horseDiv.style.transform = `translate(${x}px, ${y}px) rotate(${rotation}deg)`;

                // One full lap is completed when angle reaches 270 degrees (3 * Math.PI / 2)
                if (horse.angle >= (3 * Math.PI / 2) && !raceFinished) { 
                    raceFinished = true;
                    raceStatus.innerText = `${horse.name} WINS!`;
                    if(horse.isPlayer) {
                        raceStatus.style.color = "#ffeb3b";
                        raceStatus.innerText += `\n(You had ${horse.taps} taps!)`; 
                    } else {
                        raceStatus.style.color = "#fff";
                        raceStatus.innerText += `\n(You lost. You had ${playerHorse.taps} taps.)`;
                    }
                    restartBtn.classList.remove('hidden');
                }
            });

            if (!raceFinished) {
                requestAnimationFrame(raceLoop);
            }
        }
    </script>
</body>
</html>
