function genName(){return DW[Math.floor(Math.random()*DW.length)]+' '+DW[Math.floor(Math.random()*DW.length)];}

function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

// --- THREE.JS ---
const scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,600,1200);

sun.shadow.camera.top=500;sun.shadow.camera.bottom=-500;sun.shadow.camera.left=-600;sun.shadow.camera.right=600;scene.add(sun);

const gradCanvas=document.createElement('canvas');gradCanvas.width=4;gradCanvas.height=1;
const gctx=gradCanvas.getContext('2d');
gctx.fillStyle='#555';gctx.fillRect(0,0,1,1);
gctx.fillStyle='#999';gctx.fillRect(1,0,1,1);
gctx.fillStyle='#ccc';gctx.fillRect(2,0,1,1);
gctx.fillStyle='#fff';gctx.fillRect(3,0,1,1);
const gradMap=new THREE.CanvasTexture(gradCanvas);
gradMap.minFilter=THREE.NearestFilter;gradMap.magFilter=THREE.NearestFilter;

function toon(opts){return new THREE.MeshToonMaterial({...opts,gradientMap:gradMap});}

function mowedGrass(){const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');
for(let i=0;i<18;i++){x.fillStyle=i%2?'#3d8a35':'#4da843';x.fillRect(0,i*28.4,512,28.4);}
const d=x.getImageData(0,0,512,512);for(let j=0;j<d.data.length;j+=4){const n=(Math.random()-.5)*8;d.data[j]+=n;d.data[j+1]+=n;d.data[j+2]+=n;}
x.putImageData(d,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,6);return t;}

function saddleTex(num,col){const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');
x.fillStyle=col;x.fillRect(0,0,128,128);x.strokeStyle='#000';x.lineWidth=6;x.strokeRect(0,0,128,128);
x.fillStyle='#fff';x.font='bold 64px "Press Start 2P",monospace';x.textAlign='center';x.textBaseline='middle';
x.fillText(num,64,68);x.lineWidth=3;x.strokeText(num,64,68);return new THREE.CanvasTexture(c);}

// --- TRACK ---
(function(){const g=new THREE.Group();
const grassMesh=new THREE.Mesh(new THREE.CircleGeometry(BASE_R-3,80),toon({map:mowedGrass()}));grassMesh.rotation.x=-Math.PI/2;grassMesh.receiveShadow=true;g.add(grassMesh);
const dirt=new THREE.Mesh(new THREE.RingGeometry(BASE_R-3,BASE_R+DIRT_W,80),toon({color:0xbd9a6c}));dirt.rotation.x=-Math.PI/2;dirt.receiveShadow=true;g.add(dirt);
const out=new THREE.Mesh(new THREE.RingGeometry(BASE_R+DIRT_W,BASE_R+400,80),toon({color:0x5a9e4b}));out.rotation.x=-Math.PI/2;out.position.y=-.1;g.add(out);
const rm=new THREE.MeshBasicMaterial({color:0xffffff});
[BASE_R-3,BASE_R+DIRT_W].forEach(r=>{const t=new THREE.Mesh(new THREE.TorusGeometry(r,.6,8,80),rm);t.rotation.x=-Math.PI/2;t.position.y=2;g.add(t);});
for(let i=0;i<40;i++){const a=(i/40)*Math.PI*2;const p=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,4,4),toon({color:0xdddddd}));p.position.set(Math.cos(a)*(BASE_R-3),2,Math.sin(a)*(BASE_R-3));g.add(p);}
const fc=document.createElement('canvas');fc.width=64;fc.height=64;const fx=fc.getContext('2d');
for(let r=0;r<8;r++)for(let c=0;c<8;c++){fx.fillStyle=(r+c)%2?'#000':'#fff';fx.fillRect(c*8,r*8,8,8);}
const fl=new THREE.Mesh(new THREE.PlaneGeometry(DIRT_W+6,5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(fc)}));
fl.rotation.x=-Math.PI/2;fl.rotation.z=Math.PI/2;fl.position.set(0,.2,-(BASE_R+DIRT_W/2));g.add(fl);
[BASE_R-3,BASE_R+DIRT_W].forEach(off=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,22,8),toon({color:0xffffff}));p.position.set(0,11,-off);g.add(p);
const b=new THREE.Mesh(new THREE.SphereGeometry(1.2,8,8),toon({color:0xffd700}));b.position.set(0,22.5,-off);g.add(b);});
g.scale.set(TRACK_SX,1,1);scene.add(g);})();

// --- MASCOT SYSTEM ---
const loadingManager = new THREE.LoadingManager();
const texLoader = new THREE.TextureLoader(loadingManager);

const HEAD_IMAGES = {
  liberty: "liberty-front.png",
  david: "david-front.png",
  george: "george-front.png",
  christopher: "christopher-front.png",
  lt: "lt-front.png",
  maria: "maria-front.png",
  mike: "mike-front.png",
  yorick: "yorick-front.png",
};

// MULTI-ANGLE DEFINITIONS (Files referenced must exist in folder)
const LT_HEAD = { front: "lt-front.png", side: "lt-side.png", side_r: "lt-side-r.png", back: "lt-back.png" };
const GEORGE_HEAD = { front: "george-front.png", side: "george-side.png", side_r: "george-side-r.png", back: "george-back.png" };
const DAVID_HEAD = { front: "david-front.png", side: "david-side.png", side_r: "david-side-r.png", back: "david-back.png" };
const LIBERTY_HEAD = { front: "liberty-front.png", side: "liberty-side.png", side_r: "liberty-side-r.png", back: "liberty-back.png" };

const headTextures = {};
const HEAD_NAMES = Object.keys(HEAD_IMAGES);
HEAD_NAMES.forEach(name => { headTextures[name] = texLoader.load(HEAD_IMAGES[name]); });

const ltTextures = { front: texLoader.load(LT_HEAD.front), side: texLoader.load(LT_HEAD.side), side_r: texLoader.load(LT_HEAD.side_r), back: texLoader.load(LT_HEAD.back) };
const georgeTextures = { front: texLoader.load(GEORGE_HEAD.front), side: texLoader.load(GEORGE_HEAD.side), side_r: texLoader.load(GEORGE_HEAD.side_r), back: texLoader.load(GEORGE_HEAD.back) };
// Fixed David's orientation so side and side_r are correct
const davidTextures = { front: texLoader.load(DAVID_HEAD.front), side: texLoader.load(DAVID_HEAD.side_r), side_r: texLoader.load(DAVID_HEAD.side), back: texLoader.load(DAVID_HEAD.back) };
const libertyTextures = { front: texLoader.load(LIBERTY_HEAD.front), side: texLoader.load(LIBERTY_HEAD.side), side_r: texLoader.load(LIBERTY_HEAD.side_r), back: texLoader.load(LIBERTY_HEAD.back) };

function buildMascotHead(idx) {
    const name = HEAD_NAMES[idx % HEAD_NAMES.length];
    const g = new THREE.Group();
    const mat = new THREE.MeshBasicMaterial({ 
        transparent: true, 
        alphaTest: 0.5, 
        side: THREE.DoubleSide
    });
    
    let headSize = 10.5; // Standard size

    if (name === 'lt') {
        mat.map = ltTextures.front;
        g.userData.multiAngle = ltTextures;
        headSize = 11.5; // Make LT helmet bigger!
    } else if (name === 'george') {
        mat.map = georgeTextures.front;
        g.userData.multiAngle = georgeTextures;
    } else if (name === 'david') {
        mat.map = davidTextures.front;
        g.userData.multiAngle = davidTextures;
    } else if (name === 'liberty') {
        mat.map = libertyTextures.front;
        g.userData.multiAngle = libertyTextures;
    } else {
        mat.map = headTextures[name];
    }
    
    // The Plane: oversized and moved FORWARD on its Z-axis to avoid body clipping
    const plane = new THREE.Mesh(new THREE.PlaneGeometry(headSize, headSize), mat);
    plane.position.z = 1.2; 
    g.add(plane);
    
    g.userData.headMat = mat;
    g.userData.isHead = true;
    g.userData.charName = name; // Save for comparison
    return g;
}

const _headWorldPos = new THREE.Vector3();
const _camToHead = new THREE.Vector3();
const _horseForward = new THREE.Vector3();
const _parentWorldQuat = new THREE.Quaternion();
const _targetQuat = new THREE.Quaternion();
const _lookMatrix = new THREE.Matrix4();

function updateHeadAngle(horseRoot, jockeyGroup, cam) {
    const headGroup = jockeyGroup.children[jockeyGroup.children.length - 1];
    if (!headGroup || !headGroup.userData.isHead) return;
    
    headGroup.updateWorldMatrix(true, false);
    headGroup.getWorldPosition(_headWorldPos);
    _lookMatrix.lookAt(cam.position, _headWorldPos, THREE.Object3D.DefaultUp);
    _targetQuat.setFromRotationMatrix(_lookMatrix);
    headGroup.parent.updateWorldMatrix(true, false);
    headGroup.parent.getWorldQuaternion(_parentWorldQuat);
    _parentWorldQuat.invert();
    headGroup.quaternion.copy(_targetQuat.premultiply(_parentWorldQuat));
    
    if (!headGroup.userData.multiAngle) return;
    const texSet = headGroup.userData.multiAngle;
    const mat = headGroup.userData.headMat;
    
    const rotY = horseRoot.rotation.y;
    _horseForward.set(Math.cos(rotY), 0, -Math.sin(rotY)).normalize();
    _camToHead.subVectors(cam.position, _headWorldPos);
    _camToHead.y = 0; _camToHead.normalize();
    
    const angle = Math.atan2(
        _horseForward.x * _camToHead.z - _horseForward.z * _camToHead.x,
        _horseForward.x * _camToHead.x + _horseForward.z * _camToHead.z
    );
    
    const deg = angle * 180 / Math.PI;
    let zone;
    if (deg > -45 && deg < 45) zone = 'front';
    else if (deg >= 45 && deg < 135) zone = 'side';
    else if (deg <= -45 && deg > -135) zone = 'side_r';
    else zone = 'back';
    
    const newTex = texSet[zone];
    if (newTex && mat.map !== newTex) {
        mat.map = newTex;
        mat.needsUpdate = true;
    }
}

// --- HORSE ---
function createHorse(colorHex,number,mascotIdx){
    const root=new THREE.Group(),body=new THREE.Group();root.add(body);
    const brown=toon({color:0x6B4226}), ltBr=toon({color:0x8B6B4A}), dkBr=toon({color:0x3a2212});
    const hoofM=toon({color:0x1a1a1a}), maneM=toon({color:0x1a0f00}), hoodC=toon({color:new THREE.Color(colorHex)});

    const torso=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),brown);torso.scale.set(6.5,2.6,2.6);torso.position.y=6.5;torso.castShadow=true;body.add(torso);
    const rump=new THREE.Mesh(new THREE.SphereGeometry(3,10,10),brown);rump.position.set(-4.5,7,0);body.add(rump);
    const chest=new THREE.Mesh(new THREE.SphereGeometry(2.6,10,10),brown);chest.position.set(4.5,7,0);body.add(chest);

    const st=saddleTex(number.toString(),colorHex),sm=toon({map:st});
    const sR=new THREE.Mesh(new THREE.PlaneGeometry(5.5,4),sm);sR.position.set(-.5,7,2.7);body.add(sR);
    const sL=new THREE.Mesh(new THREE.PlaneGeometry(5.5,4),sm);sL.position.set(-.5,7,-2.7);sL.rotation.y=Math.PI;body.add(sL);

    const neckCurve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(5,7.5,0),new THREE.Vector3(7,11,0),new THREE.Vector3(9.5,13.5,0));
    const neckGeo=new THREE.TubeGeometry(neckCurve,12,1.6,8,false);
    const neck=new THREE.Mesh(neckGeo,brown);neck.castShadow=true;body.add(neck);

    const skull=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),brown);skull.scale.set(3.2,1.5,1.5);skull.position.set(11,14,0);body.add(skull);
    const muzzle=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),ltBr);muzzle.scale.set(1.6,1.1,1.2);muzzle.position.set(13.5,13.3,0);body.add(muzzle);
    const nm=new THREE.MeshBasicMaterial({color:0x333333});
    for(let s of[-1,1]){const n=new THREE.Mesh(new THREE.SphereGeometry(.3,6,6),nm);n.position.set(15,13.3,s*.6);body.add(n);}
    const hoodMesh=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),hoodC);hoodMesh.scale.set(3.4,1.65,1.65);hoodMesh.position.set(11,14,0);body.add(hoodMesh);
    const ehm=new THREE.MeshBasicMaterial({color:0x111111});
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.CircleGeometry(.65,8),ehm);e.position.set(12.5,14.5,s*1.66);if(s<0)e.rotation.y=Math.PI;body.add(e);}
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.ConeGeometry(.55,2.2,6),hoodC);e.position.set(10,16,s*.9);e.rotation.z=.15;body.add(e);}

    for(let i=0;i<5;i++){const t=new THREE.Mesh(new THREE.SphereGeometry(.6,6,6),maneM);t.scale.set(1,1.2,1.8);t.position.set(6+i*1.1,10+i*1,0);body.add(t);}
    const tailG=new THREE.Group();
    const tail1=new THREE.Mesh(new THREE.SphereGeometry(.4,6,6),maneM);tail1.scale.set(1,2.5,1);tail1.position.y=-1.2;tailG.add(tail1);
    const tail2=new THREE.Mesh(new THREE.SphereGeometry(.35,6,6),maneM);tail2.scale.set(1,2,1);tail2.position.set(-.4,-2.5,0);tailG.add(tail2);
    tailG.position.set(-7.5,8.5,0);tailG.rotation.z=.6;body.add(tailG);

    const legs=[];
    const thighGeo=new THREE.CylinderGeometry(.45,.6,5,8);thighGeo.translate(0,-2.5,0);
    const shinGeo=new THREE.CylinderGeometry(.35,.45,4.5,8);shinGeo.translate(0,-2.25,0);
    const positions=[[4,5,1.7],[4,5,-1.7],[-4,5,1.7],[-4,5,-1.7]];
    positions.forEach((p,idx)=>{
        const thigh=new THREE.Mesh(thighGeo,dkBr);thigh.position.set(p[0],p[1],p[2]);thigh.castShadow=true;body.add(thigh);
        const shin=new THREE.Mesh(shinGeo,dkBr);shin.position.y=-5;thigh.add(shin);
        const hoof=new THREE.Mesh(new THREE.SphereGeometry(.5,6,6),hoofM);hoof.scale.set(1.2,.6,1);hoof.position.y=-4.5;shin.add(hoof);
        legs.push({thigh,shin});
    });

    const jG=new THREE.Group(); jG.position.set(0,9.5,0); body.add(jG);
    const jm=toon({color:new THREE.Color(colorHex)});
    
    // Jockey Body parts adjusted further back (-0.5 on X) to prevent clipping through the head plane
    const jTorso=new THREE.Mesh(new THREE.CylinderGeometry(.3,.4,2.2,6),jm); 
    jTorso.position.set(-0.5, 0.8, 0); 
    jTorso.rotation.z=-0.35;
    jG.add(jTorso);
    
    for(let s of[-1,1]){
        const arm=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,2,5),jm); 
        arm.position.set(0.5, 0.8, s*0.8);
        arm.rotation.z=-0.8;
        jG.add(arm);
        
        const leg=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,2,5),toon({color:0xffffff})); 
        leg.position.set(-0.7, -0.2, s*1);
        leg.rotation.z=0.3;
        jG.add(leg);
    }
    
    const mHead=buildMascotHead(mascotIdx); 
    // Lifted slightly (to 5.5) so heads look more naturally attached to jockeys leaning forward
    mHead.position.set(0, 5.5, 0); 
    jG.add(mHead);
    
    return{root,body,tailG,legs,jG};
}

// --- UI & GAME LOGIC ---
document.getElementById('player-horse-name').innerText=`#${playerHorse.number} ${playerHorse.name}`;

document.getElementById('solo-btn').addEventListener('click',()=>{
    isMultiplayer=false;
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('main-title').classList.add('hidden');
    document.getElementById('tapping-phase').classList.remove('hidden');
    startTapping();
});

document.getElementById('create-btn').addEventListener('click',async()=>{
    isMultiplayer=true;isPlayer1=true;
    const seed=Math.floor(Math.random()*2147483647);
    const doc=await db.collection('shmerbyGames').add({
        p1Id:myPlayerId,p2Id:null, p1Name:playerHorse.name,p1Number:playerHorse.number,p1Color:playerHorse.color,
        p2Name:'',p2Number:0,p2Color:'', p1Taps:null,p2Taps:null,seed,status:'waiting',created:firebase.firestore.FieldValue.serverTimestamp()
    });
    gameDocRef=doc;
    document.getElementById('game-url').value=location.origin+location.pathname+'?gameId='+doc.id;
    document.getElementById('share-area').classList.remove('hidden');
    document.getElementById('create-btn').classList.add('hidden');
    document.getElementById('solo-btn').classList.add('hidden');

    unsubGame=gameDocRef.onSnapshot(snap=>{
        const d=snap.data();if(!d)return;
        if(d.status==='ready'&&d.p2Id){
            document.getElementById('waiting-msg').classList.add('hidden');
            document.getElementById('join-msg').classList.remove('hidden');
            document.getElementById('join-msg').querySelector('p').textContent=`Opponent joined: #${d.p2Number} ${d.p2Name}`;
        }
        if(d.status==='tapping'&&!tappingDone){
            document.getElementById('lobby').classList.add('hidden');
            document.getElementById('main-title').classList.add('hidden');
            document.getElementById('tapping-phase').classList.remove('hidden');
            startTapping();
        }
        if(d.status==='racing'&&d.p1Taps!==null&&d.p2Taps!==null){
            document.getElementById('tapping-phase').classList.add('hidden');
            startRaceFromData(d);
        }
    });
});

document.getElementById('copy-btn').addEventListener('click',()=>{
    const inp=document.getElementById('game-url');inp.select();document.execCommand('copy');
    document.getElementById('copy-btn').textContent='COPIED!';
    setTimeout(()=>document.getElementById('copy-btn').textContent='COPY LINK',2000);
});

document.getElementById('ready-btn').addEventListener('click',async()=>await gameDocRef.update({status:'tapping'}));

const urlParams=new URLSearchParams(location.search);
const joinId=urlParams.get('gameId');
if(joinId){
    isMultiplayer=true;isPlayer1=false;
    document.getElementById('create-btn').classList.add('hidden');
    document.getElementById('solo-btn').classList.add('hidden');
    gameDocRef=db.collection('shmerbyGames').doc(joinId);
    gameDocRef.get().then(async snap=>{
        const d=snap.data();
        if(d&&!d.p2Id){
            await gameDocRef.update({ p2Id:myPlayerId,p2Name:playerHorse.name,p2Number:playerHorse.number,p2Color:playerHorse.color,status:'ready' });
            document.getElementById('join-msg').classList.remove('hidden');
            document.getElementById('join-msg').querySelector('p').textContent='Waiting for host to start...';
            document.getElementById('ready-btn').classList.add('hidden');
        }
        unsubGame=gameDocRef.onSnapshot(snap2=>{
            const d2=snap2.data();if(!d2)return;
            if(d2.status==='tapping'&&!tappingDone){
                document.getElementById('lobby').classList.add('hidden');
                document.getElementById('main-title').classList.add('hidden');
                document.getElementById('tapping-phase').classList.remove('hidden');
                startTapping();
            }
            if(d2.status==='racing'&&d2.p1Taps!==null&&d2.p2Taps!==null){
                document.getElementById('tapping-phase').classList.add('hidden');
                startRaceFromData(d2);
            }
        });
    });
}

// --- TAPPING ---
let tapping=false,tappingDone=false;
function startTapping(){
    if(tapping)return;tapping=true;
    playerHorse.taps=0;
    const st=Date.now();
    const ti=setInterval(()=>{
        let r=(10-(Date.now()-st)/1000).toFixed(1);
        if(r<=0){r=0;clearInterval(ti);endTapping();}
        document.getElementById('timer-display').innerText=r;
    },100);
}
document.getElementById('tap-zone').addEventListener('pointerdown',e=>{e.preventDefault();playerHorse.taps++;});

async function endTapping(){
    tappingDone=true;
    document.getElementById('tapping-phase').classList.add('hidden');
    if(isMultiplayer&&gameDocRef){
        const field=isPlayer1?'p1Taps':'p2Taps';
        await gameDocRef.update({[field]:playerHorse.taps});
        const snap=await gameDocRef.get();const d=snap.data();
        if(d.p1Taps!==null&&d.p2Taps!==null) await gameDocRef.update({status:'racing'});
    } else {
        startSoloRace();
    }
}

// --- RACE ---
let raceStarted=false;
function startRaceFromData(d){
    if(raceStarted)return;raceStarted=true;
    const rng=mulberry32(d.seed);
    const p1Horse={name:d.p1Name,taps:d.p1Taps,isPlayer:isPlayer1,color:d.p1Color||'#e91e63',number:d.p1Number,isHuman:true,style:0};
    const p2Horse={name:d.p2Name,taps:d.p2Taps,isPlayer:!isPlayer1,color:d.p2Color||'#2196f3',number:d.p2Number,isHuman:true,style:0};
    gameHorses.push(p1Horse,p2Horse);
    const usedNums=new Set([p1Horse.number,p2Horse.number]);
    for(let i=0;i<4;i++){
        let n;do{n=Math.floor(rng()*20)+1;}while(usedNums.has(n));usedNums.add(n);
        const botTaps=Math.floor(rng()*45)+20;
        // bots get random styles and indices
        gameHorses.push({name:genName(),taps:botTaps,isPlayer:false,color:botColors[i],number:n,style:Math.floor(rng()*3),isHuman:false});
    }
    buildAndStartRace(rng);
}

function startSoloRace(){
    if(raceStarted)return;raceStarted=true;
    const rng=mulberry32(Date.now());
    gameHorses.push(playerHorse);
    for(let i=0;i<5;i++){
        let n;do{n=Math.floor(rng()*20)+1;}while(gameHorses.some(h=>h.number===n));
        const botTaps=Math.floor(rng()*45)+20;
        // bots get random styles and indices
        gameHorses.push({name:genName(),taps:botTaps,isPlayer:false,color:botColors[i],number:n,style:Math.floor(rng()*3),isHuman:false});
    }
    buildAndStartRace(rng);
}

function buildAndStartRace(rng){
    document.getElementById('race-phase').classList.remove('hidden');
    raceStartTime=Date.now();
    for(let i=gameHorses.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[gameHorses[i],gameHorses[j]]=[gameHorses[j],gameHorses[i]];}
    
    // Assign unique mascot textures to each horse based on character sets available (LT, George, David, Liberty)
    const mi=[0,1,2,3,4,5,6,7];for(let i=mi.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[mi[i],mi[j]]=[mi[j],mi[i]];}

    gameHorses.forEach((h,i)=>{
        h.angle=START_ANGLE-(0.02+i*.015);
        h.baseSpeed=AVG_SPEED*.85+(h.taps*0.0000065);
        h.earlyMod=h.style===0?1.08:h.style===1?0.98:0.92;
        h.lateMod=h.style===0?0.94:h.style===1?1.04:1.12;
        h.energy=1;h.finished=false; h.laneOffset=5+i*6;
        const model=createHorse(h.color,h.number,mi[i]);
        scene.add(model.root);h.model=model;
    });
    updateLB();animate();
}

function updateLB(){
    const sorted=[...gameHorses].sort((a,b)=>{if(a.finished&&!b.finished)return-1;if(!a.finished&&b.finished)return 1;return b.angle-a.angle;});
    const list=document.getElementById('standings-list');list.innerHTML='';
    sorted.forEach((h,i)=>{
        const youTag=h.isPlayer?'<span class="you-tag">YOU</span>':'';
        list.innerHTML+=`<div class="lb-row"><span class="lb-place">${['1ST','2ND','3RD','4TH','5TH','6TH'][i]}</span>
        <div class="lb-color" style="background:${h.color}"></div>
        <span class="lb-name" style="color:${h.isPlayer?'#ffeb3b':'#fff'}">#${h.number} ${h.name}${youTag}</span></div>`;
    });
}

function showNotif(t){
    const e=document.createElement('div');e.className='finish-notif';e.innerText=t;
    document.getElementById('notifications-container').appendChild(e);
    setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),500);},3000);
}

const clock=new THREE.Clock();
function animate(){
    if(!raceFinished)requestAnimationFrame(animate);
    const time=clock.getElapsedTime(),gSpeed=18;
    if(!raceFinished){
        const el=((Date.now()-raceStartTime)/1000);
        document.getElementById('race-timer').innerText=`${Math.floor(el/60)}:${(el%60).toFixed(1).padStart(4,'0')}`;
    }
    
    let leader=null,leaderAngle=-999,maxA=-999;
    gameHorses.forEach(h=>{if(h.angle>maxA)maxA=h.angle;});
    const progress=(maxA-START_ANGLE)/(FINISH_ANGLE-START_ANGLE);
    if(progress>.78&&!stretchCalled){
        stretchCalled=true;camMode='stretch';
        const sc=document.getElementById('stretch-call');sc.innerHTML="AND DOWN THE<br>STRETCH THEY COME!";sc.classList.add('show');
        setTimeout(()=>sc.classList.remove('show'),3500);
    }
    document.getElementById('furlong-fill').style.width=Math.min(100,progress*100)+'%';

    gameHorses.forEach((h,i)=>{
        const raceMod=progress<.5?h.earlyMod:h.lateMod;
        h.energy+=(Math.random()-.5)*.003;h.energy=Math.max(.93,Math.min(1.07,h.energy));
        h.angle+=Math.max(h.baseSpeed*raceMod*h.energy+(Math.random()-.0005)*.0001,.0004);
        
        const rank=gameHorses.filter(o=>o.angle>h.angle).length;
        h.targetLane=Math.max(3,Math.min(3+rank*5+Math.sin(time*.5+i)*1.5,DIRT_W-5));
        h.laneOffset+=(h.targetLane-h.laneOffset)*.025;
        
        const r=BASE_R+h.laneOffset;
        const x=Math.cos(h.angle)*r*TRACK_SX,z=Math.sin(h.angle)*r;
        const dx=-Math.sin(h.angle)*r*TRACK_SX,dz=Math.cos(h.angle)*r;
        h.model.root.position.set(x,0,z);h.model.root.rotation.y=Math.atan2(-dz,dx);

        const c=time*gSpeed+i*1.7, bound=Math.max(0,Math.sin(c))*2;
        h.model.body.position.y=bound;h.model.body.rotation.z=Math.sin(c)*.06;
        h.model.legs.forEach((leg,li)=>{
            const offset=li<2?0:Math.PI;
            const swing=Math.sin(c+offset+(li%2?0.7:0))*.55;
            leg.thigh.rotation.z=swing;
            leg.shin.rotation.z=li<2?(.2+Math.max(0,-swing)*1.2):(-.1+Math.max(0,swing)*1);
        });
        h.model.jG.position.y=9.5+bound*.35;
        // Update texture based on angle to camera
        updateHeadAngle(h.model.root, h.model.jG, camera);

        if(h.angle>=FINISH_ANGLE&&!h.finished){
            h.finished=true;finishOrder.push(h);
            const ps=finishOrder.length===1?"WINS!":finishOrder.length===2?"takes 2nd!":"finishes.";
            showNotif(`🏁 #${h.number} ${h.name} ${ps}`);
        }
        if(!h.finished&&h.angle>leaderAngle){leaderAngle=h.angle;leader=h;}
    });
    updateLB();

    if(leader){
        const r=BASE_R+leader.laneOffset+(camMode==='broadcast'?70:20);
        const camPos=camMode==='broadcast'?new THREE.Vector3(Math.cos(leader.angle+.06)*r*TRACK_SX,30,Math.sin(leader.angle+.06)*r):new THREE.Vector3(80,55,-(BASE_R+DIRT_W/2)+15);
        camera.position.lerp(camPos,.08);
        camTarget.lerp(new THREE.Vector3(Math.cos(leader.angle)*BASE_R*TRACK_SX,5,Math.sin(leader.angle)*BASE_R),.08);
        camera.lookAt(camTarget);
    }

    if(finishOrder.length===gameHorses.length&&!raceFinished){
        raceFinished=true;
        setTimeout(()=>{
            const rl=document.getElementById('results-list');
            finishOrder.forEach((h,i)=>{
                const t=i===0?'WIN':i===1?'PLACE':i===2?'SHOW':`${i+1}TH`;
                rl.innerHTML+=`<div class="result-row"><span class="result-place">${t}</span><div class="lb-color" style="background:${h.color}"></div><span style="color:${h.isPlayer?'#ffeb3b':'#fff'}">#${h.number} ${h.name}${h.isPlayer?' ⭐':''}</span></div>`;
            });
            document.getElementById('results-modal').style.display='flex';
        },2000);
    }
    renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
