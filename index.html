<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Shmerby</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-firestore-compat.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Press Start 2P',monospace;background:#87CEEB;color:#fff;overflow:hidden;user-select:none;}
        .hidden{display:none!important;}
        #game-container{width:100vw;height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;}
        #canvas-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
        .overlay{position:relative;z-index:10;text-align:center;}
        h1{color:#ffd700;font-size:22px;text-shadow:4px 4px 0 #000;margin:18px 0;position:relative;z-index:10;}
        .panel{background:rgba(0,0,0,0.7);padding:24px 32px;border-radius:12px;border:3px solid #ffd700;margin-top:40px;max-width:500px;width:90%;}
        #tap-zone{width:90%;max-width:600px;height:260px;margin:16px auto;background:#e53935;border:8px solid #000;
            box-shadow:0 10px 0 #b71c1c;display:flex;align-items:center;justify-content:center;
            font-size:13px;cursor:pointer;color:#fff;line-height:1.8;text-shadow:2px 2px 0 #000;border-radius:8px;}
        #tap-zone:active{transform:translateY(10px);box-shadow:0 0 0 #b71c1c;}
        button{padding:12px 24px;font-size:12px;font-family:inherit;cursor:pointer;background:#ffeb3b;color:#000;
            border:5px solid #000;box-shadow:0 5px 0 #f57f17;margin-top:14px;text-transform:uppercase;}
        button:hover{background:#fff176;}
        .share-box{margin-top:14px;}
        .share-box input{font-family:inherit;font-size:8px;padding:8px;width:100%;background:#222;color:#ffd700;border:2px solid #ffd700;border-radius:4px;margin-bottom:8px;}
        .share-box button{font-size:10px;padding:8px 16px;}
        .waiting{color:#ffd700;font-size:10px;margin-top:14px;animation:pulse 1.5s infinite;}
        @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.4;}}
        #notifications-container{position:absolute;top:80px;left:50%;transform:translateX(-50%);
            z-index:1000;display:flex;flex-direction:column;align-items:center;pointer-events:none;}
        .finish-notif{background:rgba(0,0,0,0.9);border:2px solid #ffd700;color:#fff;
            padding:10px 20px;margin-bottom:6px;font-size:10px;border-radius:4px;transition:opacity 0.5s ease;}
        #leaderboard{position:absolute;bottom:0;left:0;width:100%;height:52px;
            background:rgba(17,17,17,0.95);border-top:4px solid #ffd700;
            display:flex;align-items:center;justify-content:center;z-index:100;padding:0 8px;}
        #standings-list{display:flex;width:100%;max-width:1400px;justify-content:space-evenly;align-items:center;gap:5px;}
        .lb-row{display:flex;align-items:center;flex:1;min-width:0;background:#333;padding:5px 7px;border-radius:4px;border:1px solid #555;}
        .lb-place{color:#ffd700;margin-right:4px;font-size:8px;flex-shrink:0;}
        .lb-color{width:9px;height:9px;border:2px solid #fff;margin-right:4px;display:inline-block;flex-shrink:0;}
        .lb-name{white-space:nowrap;font-size:8px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-grow:1;text-align:left;}
        #results-modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.95);border:6px solid #ffd700;padding:24px;
            z-index:1000;text-align:left;width:90%;max-width:480px;display:none;flex-direction:column;}
        .result-row{display:flex;align-items:center;margin:6px 0;font-size:10px;border-bottom:2px dashed #444;padding-bottom:6px;}
        .result-place{width:50px;color:#ffd700;}
        #timer-display{font-size:34px;color:#fff;text-shadow:4px 4px #000;}
        #race-header{position:absolute;top:10px;left:0;width:100%;z-index:100;text-align:center;padding:0 12px;}
        #race-status{text-shadow:3px 3px #000;font-size:15px;}
        #race-timer{position:absolute;top:10px;right:16px;z-index:100;font-size:12px;color:#fff;text-shadow:2px 2px #000;}
        #stretch-call{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            z-index:500;font-size:24px;color:#fff;text-shadow:6px 6px 0 #000,-2px -2px 0 #ffd700;
            pointer-events:none;opacity:0;transition:opacity 0.4s;white-space:nowrap;text-align:center;line-height:1.5;}
        #stretch-call.show{opacity:1;}
        .you-tag{font-size:7px;color:#ffeb3b;background:#000;padding:1px 4px;border-radius:2px;margin-left:4px;}
        #furlong-bar{position:absolute;top:45px;left:50%;transform:translateX(-50%);z-index:100;width:280px;}
        #furlong-track{width:100%;height:10px;background:rgba(0,0,0,.6);border:2px solid #ffd700;border-radius:5px;overflow:hidden;}
        #furlong-fill{height:100%;width:0%;background:linear-gradient(90deg,#4caf50,#ffeb3b,#ff5722);border-radius:3px;transition:width .3s;}
        #furlong-labels{display:flex;justify-content:space-between;font-size:6px;color:#ffd700;margin-top:2px;text-shadow:1px 1px #000;}
    </style>
</head>
<body>
<div id="game-container">
    <div id="canvas-container"></div>
    <h1 id="main-title">KENTUCKY SHMERBY</h1>

    <!-- LOBBY -->
    <div id="lobby" class="overlay">
        <div class="panel">
            <p style="font-size:10px;margin-bottom:12px;">Your Steed:</p>
            <h2 id="player-horse-name" style="color:#ffeb3b;text-shadow:2px 2px #000;font-size:14px;margin:0 0 10px 0;">Loading...</h2>
            <p style="font-size:8px;color:#ffd700;margin:0 0 12px 0;">1¼ MILES • RUN FOR THE ROSES</p>
            <button id="solo-btn">SOLO RACE</button>
            <button id="create-btn">CREATE MULTIPLAYER</button>
            <div id="share-area" class="share-box hidden">
                <p style="font-size:8px;color:#fff;margin-bottom:8px;">Share this link:</p>
                <input type="text" id="game-url" readonly>
                <button id="copy-btn">COPY LINK</button>
                <p class="waiting" id="waiting-msg">WAITING FOR OPPONENT...</p>
            </div>
            <div id="join-msg" class="hidden" style="margin-top:12px;">
                <p style="font-size:9px;color:#4caf50;">Opponent found! Get ready...</p>
                <button id="ready-btn">I'M READY</button>
            </div>
        </div>
    </div>

    <!-- TAPPING -->
    <div id="tapping-phase" class="overlay hidden">
        <h2 id="timer-display">10.0</h2>
        <div id="tap-zone">TAP HERE!<br><br>Speed, not force.<br>Your count is hidden!</div>
    </div>

    <!-- RACE -->
    <div id="race-phase" class="hidden">
        <div id="race-header"><h2 id="race-status">AND THEY'RE OFF!</h2></div>
        <div id="furlong-bar">
            <div id="furlong-track"><div id="furlong-fill"></div></div>
            <div id="furlong-labels"><span>START</span><span>5F</span><span>FINISH</span></div>
        </div>
        <div id="race-timer"></div>
        <div id="stretch-call"></div>
        <div id="notifications-container"></div>
        <div id="leaderboard"><div id="standings-list"></div></div>
    </div>

    <div id="results-modal">
        <h2 id="results-title" style="text-align:center;margin-bottom:16px;"></h2>
        <div id="results-list"></div>
        <button onclick="location.reload()" style="margin:16px auto 0;display:block;">Race Again</button>
    </div>
</div>
<script>
// --- FIREBASE ---
firebase.initializeApp({
    apiKey:"AIzaSyDicI1nKcrMDaaYkL_8q70yj1mM05tW5Ak",authDomain:"mookie-pig-challenge.firebaseapp.com",
    projectId:"mookie-pig-challenge",storageBucket:"mookie-pig-challenge.appspot.com",

});
const db=firebase.firestore();
let myPlayerId=localStorage.getItem('shmerbyId');
if(!myPlayerId){myPlayerId=Math.random().toString(36).substr(2,9);localStorage.setItem('shmerbyId',myPlayerId);}
let gameDocRef=null,unsubGame=null,isMultiplayer=false,isPlayer1=true;

// --- NAMES ---
const DW=["Affirmed","Agile","Alysheba","American","Pharoah","Animal","Kingdom","Apollo","Aristides","Assault","Authentic",
"Barbaro","Black","Gold","Bold","Venture","Brokers","Tip","Bubbling","Over","Burgoo","King","California","Chrome",

"Sunday","Silence","Super","Saver","Swale","Swaps","Thunder","Gulch","Unbridled","War","Admiral","Whirlaway","Zev"];
function genName(){return DW[Math.floor(Math.random()*DW.length)]+' '+DW[Math.floor(Math.random()*DW.length)];}

// Seeded random for deterministic races
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;var t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296;};}

let playerHorse={name:genName(),taps:0,isPlayer:true,color:"#e91e63",number:Math.floor(Math.random()*20)+1};
let gameHorses=[],finishOrder=[],raceFinished=false,stretchCalled=false,raceStartTime=0;

const TRACK_SX=1.8,BASE_R=280,DIRT_W=75;

const scene=new THREE.Scene();scene.background=new THREE.Color(0x87CEEB);scene.fog=new THREE.Fog(0x87CEEB,600,1200);

document.getElementById('canvas-container').appendChild(renderer.domElement);

sun.shadow.camera.top=500;sun.shadow.camera.bottom=-500;sun.shadow.camera.left=-600;sun.shadow.camera.right=600;scene.add(sun);

// --- TOON SHADING ---
const gradCanvas=document.createElement('canvas');gradCanvas.width=4;gradCanvas.height=1;
const gctx=gradCanvas.getContext('2d');
gctx.fillStyle='#555';gctx.fillRect(0,0,1,1);
gctx.fillStyle='#999';gctx.fillRect(1,0,1,1);
gctx.fillStyle='#ccc';gctx.fillRect(2,0,1,1);
gctx.fillStyle='#fff';gctx.fillRect(3,0,1,1);
const gradMap=new THREE.CanvasTexture(gradCanvas);
gradMap.minFilter=THREE.NearestFilter;gradMap.magFilter=THREE.NearestFilter;

function toon(opts){return new THREE.MeshToonMaterial({...opts,gradientMap:gradMap});}
function toonTex(opts){return new THREE.MeshToonMaterial({...opts,gradientMap:gradMap});}

// --- TEXTURES ---
function mowedGrass(){const c=document.createElement('canvas');c.width=512;c.height=512;const x=c.getContext('2d');
for(let i=0;i<18;i++){x.fillStyle=i%2?'#3d8a35':'#4da843';x.fillRect(0,i*28.4,512,28.4);}
const d=x.getImageData(0,0,512,512);for(let j=0;j<d.data.length;j+=4){const n=(Math.random()-.5)*8;d.data[j]+=n;d.data[j+1]+=n;d.data[j+2]+=n;}
x.putImageData(d,0,0);const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,6);return t;}

function saddleTex(num,col){const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');
x.fillStyle=col;x.fillRect(0,0,128,128);x.strokeStyle='#000';x.lineWidth=6;x.strokeRect(0,0,128,128);
x.fillStyle='#fff';x.font='bold 64px "Press Start 2P",monospace';x.textAlign='center';x.textBaseline='middle';
x.fillText(num,64,68);x.lineWidth=3;x.strokeText(num,64,68);return new THREE.CanvasTexture(c);}

(function(){const g=new THREE.Group();
const grassMesh=new THREE.Mesh(new THREE.CircleGeometry(BASE_R-3,80),toon({map:mowedGrass()}));grassMesh.rotation.x=-Math.PI/2;grassMesh.receiveShadow=true;g.add(grassMesh);
const dirt=new THREE.Mesh(new THREE.RingGeometry(BASE_R-3,BASE_R+DIRT_W,80),toon({color:0xbd9a6c}));dirt.rotation.x=-Math.PI/2;dirt.receiveShadow=true;g.add(dirt);
const out=new THREE.Mesh(new THREE.RingGeometry(BASE_R+DIRT_W,BASE_R+400,80),toon({color:0x5a9e4b}));out.rotation.x=-Math.PI/2;out.position.y=-.1;g.add(out);
const rm=new THREE.MeshBasicMaterial({color:0xffffff});
[BASE_R-3,BASE_R+DIRT_W].forEach(r=>{const t=new THREE.Mesh(new THREE.TorusGeometry(r,.6,8,80),rm);t.rotation.x=-Math.PI/2;t.position.y=2;g.add(t);});
for(let i=0;i<40;i++){const a=(i/40)*Math.PI*2;const p=new THREE.Mesh(new THREE.CylinderGeometry(.2,.2,4,4),toon({color:0xdddddd}));p.position.set(Math.cos(a)*(BASE_R-3),2,Math.sin(a)*(BASE_R-3));g.add(p);}
const fc=document.createElement('canvas');fc.width=64;fc.height=64;const fx=fc.getContext('2d');
for(let r=0;r<8;r++)for(let c=0;c<8;c++){fx.fillStyle=(r+c)%2?'#000':'#fff';fx.fillRect(c*8,r*8,8,8);}
const fl=new THREE.Mesh(new THREE.PlaneGeometry(DIRT_W+6,5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(fc)}));
fl.rotation.x=-Math.PI/2;fl.rotation.z=Math.PI/2;fl.position.set(0,.2,-(BASE_R+DIRT_W/2));g.add(fl);
[BASE_R-3,BASE_R+DIRT_W].forEach(off=>{const p=new THREE.Mesh(new THREE.CylinderGeometry(.5,.5,22,8),toon({color:0xffffff}));p.position.set(0,11,-off);g.add(p);
const b=new THREE.Mesh(new THREE.SphereGeometry(1.2,8,8),toon({color:0xffd700}));b.position.set(0,22.5,-off);g.add(b);});
g.scale.set(TRACK_SX,1,1);scene.add(g);})();
camera.position.set(0,350,-50);camera.lookAt(0,0,0);renderer.render(scene,camera);

const HEAD_NAMES = Object.keys(HEAD_IMAGES);
const headTextures = {};
const texLoader = new THREE.TextureLoader();
HEAD_NAMES.forEach(name => {
    headTextures[name] = texLoader.load(HEAD_IMAGES[name]);
});

function buildMascotHead(idx) {
    const name = HEAD_NAMES[idx % HEAD_NAMES.length];
    const tex = headTextures[name];
    const g = new THREE.Group();
    // Thick box with head image on front, solid on other faces
    const frontMat = new THREE.MeshBasicMaterial({ map: tex, transparent: true, alphaTest: 0.1 });
    const sideMat = toon({ color: 0x888888 });
    const backMat = toon({ color: 0x666666 });
    // Box faces: +x, -x, +y, -y, +z (front), -z (back)
    const mats = [sideMat, sideMat, sideMat, sideMat, frontMat, backMat];
    const box = new THREE.Mesh(new THREE.BoxGeometry(10, 10, 3), mats);
    g.add(box);
    return g;
}

// --- HORSE (improved neck, legs, jockey) ---
function createHorse(colorHex,number,mascotIdx){
    const root=new THREE.Group(),body=new THREE.Group();root.add(body);
    const brown=toon({color:0x6B4226});
    const ltBr=toon({color:0x8B6B4A});
    const dkBr=toon({color:0x3a2212});
    const hoofM=toon({color:0x1a1a1a});
    const maneM=toon({color:0x1a0f00});
    const hoodC=toon({color:new THREE.Color(colorHex)});

    // Body
    const torso=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),brown);torso.scale.set(6.5,2.6,2.6);torso.position.y=6.5;torso.castShadow=true;body.add(torso);
    const rump=new THREE.Mesh(new THREE.SphereGeometry(3,10,10),brown);rump.position.set(-4.5,7,0);body.add(rump);
    const chest=new THREE.Mesh(new THREE.SphereGeometry(2.6,10,10),brown);chest.position.set(4.5,7,0);body.add(chest);

    // Saddlecloths
    const st=saddleTex(number.toString(),colorHex),sm=toon({map:st});
    const sR=new THREE.Mesh(new THREE.PlaneGeometry(5.5,4),sm);sR.position.set(-.5,7,2.7);body.add(sR);
    const sL=new THREE.Mesh(new THREE.PlaneGeometry(5.5,4),sm);sL.position.set(-.5,7,-2.7);sL.rotation.y=Math.PI;body.add(sL);

    // NECK: smooth tube using TubeGeometry
    const neckCurve=new THREE.QuadraticBezierCurve3(new THREE.Vector3(5,7.5,0),new THREE.Vector3(7,11,0),new THREE.Vector3(9.5,13.5,0));
    const neckGeo=new THREE.TubeGeometry(neckCurve,12,1.6,8,false);
    const neck=new THREE.Mesh(neckGeo,brown);neck.castShadow=true;body.add(neck);

    // HEAD
    const skull=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),brown);skull.scale.set(3.2,1.5,1.5);skull.position.set(11,14,0);body.add(skull);
    const muzzle=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),ltBr);muzzle.scale.set(1.6,1.1,1.2);muzzle.position.set(13.5,13.3,0);body.add(muzzle);
    const nm=new THREE.MeshBasicMaterial({color:0x333333});
    for(let s of[-1,1]){const n=new THREE.Mesh(new THREE.SphereGeometry(.3,6,6),nm);n.position.set(15,13.3,s*.6);body.add(n);}
    // Hood
    const hoodMesh=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),hoodC);hoodMesh.scale.set(3.4,1.65,1.65);hoodMesh.position.set(11,14,0);body.add(hoodMesh);
    const ehm=new THREE.MeshBasicMaterial({color:0x111111});
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.CircleGeometry(.65,8),ehm);e.position.set(12.5,14.5,s*1.66);if(s<0)e.rotation.y=Math.PI;body.add(e);}
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.ConeGeometry(.55,2.2,6),hoodC);e.position.set(10,16,s*.9);e.rotation.z=.15;body.add(e);}

    // Mane
    for(let i=0;i<5;i++){const t=new THREE.Mesh(new THREE.SphereGeometry(.6,6,6),maneM);t.scale.set(1,1.2,1.8);t.position.set(6+i*1.1,10+i*1,0);body.add(t);}

    // Tail
    const tailG=new THREE.Group();
    const tail1=new THREE.Mesh(new THREE.SphereGeometry(.4,6,6),maneM);tail1.scale.set(1,2.5,1);tail1.position.y=-1.2;tailG.add(tail1);
    const tail2=new THREE.Mesh(new THREE.SphereGeometry(.35,6,6),maneM);tail2.scale.set(1,2,1);tail2.position.set(-.4,-2.5,0);tailG.add(tail2);
    tailG.position.set(-7.5,8.5,0);tailG.rotation.z=.6;body.add(tailG);

    // LEGS: upper thigh (angled) + shin (knee bend) + hoof
    const legs=[];
    // Thigh: wider at top, tapers
    const thighGeo=new THREE.CylinderGeometry(.45,.6,5,8);thighGeo.translate(0,-2.5,0);
    // Shin
    const shinGeo=new THREE.CylinderGeometry(.35,.45,4.5,8);shinGeo.translate(0,-2.25,0);
    const positions=[[4,5,1.7],[4,5,-1.7],[-4,5,1.7],[-4,5,-1.7]];
    positions.forEach((p,idx)=>{
        const thigh=new THREE.Mesh(thighGeo,dkBr);thigh.position.set(p[0],p[1],p[2]);thigh.castShadow=true;body.add(thigh);
        const shin=new THREE.Mesh(shinGeo,dkBr);shin.position.y=-5;thigh.add(shin);
        const hoof=new THREE.Mesh(new THREE.SphereGeometry(.5,6,6),hoofM);hoof.scale.set(1.2,.6,1);hoof.position.y=-4.5;shin.add(hoof);
        legs.push({thigh,shin});
    });

    // JOCKEY: stick body + big mascot head
    const jG=new THREE.Group();
    jG.position.set(0,9.5,0);
    body.add(jG);
    const jm=toon({color:new THREE.Color(colorHex)});
    // Simple stick torso
    const torso=new THREE.Mesh(new THREE.CylinderGeometry(.4,.5,3,6),jm);
    torso.position.y=1.5;torso.rotation.z=-.3;jG.add(torso);
    // Stick arms reaching forward
    for(let s of[-1,1]){
        const arm=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,2.5,5),jm);
        arm.position.set(1.2,1.5,s*.8);arm.rotation.z=-.8;jG.add(arm);
    }
    // Stick legs
    const legMat=toon({color:0xffffff});
    for(let s of[-1,1]){
        const leg=new THREE.Mesh(new THREE.CylinderGeometry(.12,.15,2,5),legMat);
        leg.position.set(-.2,-.2,s*1);leg.rotation.z=.3;jG.add(leg);
    }
    // Big mascot head on top, facing forward (+z = forward on the horse after rotation)
    const mHead=buildMascotHead(mascotIdx);
    mHead.position.set(0,4.5,0);
    mHead.rotation.y=Math.PI/2; // face forward (direction of travel)
    jG.add(mHead);

    return{root,body,tailG,legs,jG};
}

// --- TAPPING ---
let tapping=false,tappingDone=false;
function startTapping(){
    if(tapping)return;tapping=true;
    playerHorse.taps=0;
    const st=Date.now();
    const ti=setInterval(()=>{
        let r=(10-(Date.now()-st)/1000).toFixed(1);
        if(r<=0){r=0;clearInterval(ti);endTapping();}
        document.getElementById('timer-display').innerText=r;
    },100);
}
document.getElementById('tap-zone').addEventListener('pointerdown',e=>{e.preventDefault();playerHorse.taps++;});

async function endTapping(){
    tappingDone=true;
    document.getElementById('tapping-phase').classList.add('hidden');
    if(isMultiplayer&&gameDocRef){
        const field=isPlayer1?'p1Taps':'p2Taps';
        await gameDocRef.update({[field]:playerHorse.taps});
        // Check if both submitted
        const snap=await gameDocRef.get();const d=snap.data();
        if(d.p1Taps!==null&&d.p2Taps!==null){
            await gameDocRef.update({status:'racing'});
        }
        // Otherwise wait for snapshot listener to trigger race
    } else {
        startSoloRace();
    }
}

// --- RACE ---
let raceStarted=false;
function startRaceFromData(d){
    if(raceStarted)return;raceStarted=true;
    // Build both human horses + 4 bots from seed
    const rng=mulberry32(d.seed);
    const p1Horse={name:d.p1Name,taps:d.p1Taps,isPlayer:isPlayer1,color:d.p1Color||'#e91e63',number:d.p1Number,isHuman:true,style:0};
    const p2Horse={name:d.p2Name,taps:d.p2Taps,isPlayer:!isPlayer1,color:d.p2Color||'#2196f3',number:d.p2Number,isHuman:true,style:0};
    gameHorses.push(p1Horse,p2Horse);
    const usedNums=new Set([p1Horse.number,p2Horse.number]);
    for(let i=0;i<4;i++){
        let n;do{n=Math.floor(rng()*20)+1;}while(usedNums.has(n));usedNums.add(n);
        const botTaps=Math.floor(rng()*45)+20;
        const style=i<1?0:i<3?1:2;
        gameHorses.push({name:genName(),taps:botTaps,isPlayer:false,color:botColors[i],number:n,style,isHuman:false});
    }
    buildAndStartRace(rng);
}

function startSoloRace(){
    if(raceStarted)return;raceStarted=true;
    const rng=mulberry32(Date.now());
    gameHorses.push(playerHorse);
    for(let i=0;i<5;i++){
        let n;do{n=Math.floor(rng()*20)+1;}while(gameHorses.some(h=>h.number===n));
        const botTaps=Math.floor(rng()*45)+20;
        const style=i<2?0:i<4?1:2;
        gameHorses.push({name:genName(),taps:botTaps,isPlayer:false,color:botColors[i],number:n,style,isHuman:false});
    }
    buildAndStartRace(rng);
}

function buildAndStartRace(rng){
    document.getElementById('race-phase').classList.remove('hidden');
    raceStartTime=Date.now();
    // Shuffle order
    for(let i=gameHorses.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[gameHorses[i],gameHorses[j]]=[gameHorses[j],gameHorses[i]];}
    const mi=[0,1,2,3,4,5,6,7];for(let i=mi.length-1;i>0;i--){const j=Math.floor(rng()*(i+1));[mi[i],mi[j]]=[mi[j],mi[i]];}

    gameHorses.forEach((h,i)=>{
        h.angle=START_ANGLE-(0.02+i*.015);
        const tapFactor=h.taps*0.0000065;
        h.baseSpeed=AVG_SPEED*.85+tapFactor;
        h.earlyMod=1;h.lateMod=1;
        if(!h.isHuman||!h.isPlayer){
            if(h.style===0){h.earlyMod=1.08;h.lateMod=0.94;}
            else if(h.style===1){h.earlyMod=0.98;h.lateMod=1.04;}
            else{h.earlyMod=0.92;h.lateMod=1.12;}
        }
        h.energy=1;h.finished=false;
        h.laneOffset=5+i*6;h.targetLane=3+rng()*4;
        const model=createHorse(h.color,h.number,mi[i]);
        scene.add(model.root);h.model=model;
    });

    const initR=BASE_R+DIRT_W+60;
    camera.position.set(Math.cos(START_ANGLE+.06)*initR*TRACK_SX,25,Math.sin(START_ANGLE+.06)*initR);
    camTarget.set(Math.cos(START_ANGLE)*(BASE_R+15)*TRACK_SX,5,Math.sin(START_ANGLE)*(BASE_R+15));
    camera.lookAt(camTarget);
    updateLB();animate();
}

function updateLB(){
    const sorted=[...gameHorses].sort((a,b)=>{if(a.finished&&!b.finished)return-1;if(!a.finished&&b.finished)return 1;return b.angle-a.angle;});
    const list=document.getElementById('standings-list');list.innerHTML='';
    sorted.forEach((h,i)=>{
        const youTag=h.isPlayer?'<span class="you-tag">YOU</span>':'';
        list.innerHTML+=`<div class="lb-row"><span class="lb-place">${['1ST','2ND','3RD','4TH','5TH','6TH'][i]}</span>
        <div class="lb-color" style="background:${h.color}"></div>
        <span class="lb-name" style="color:${h.isPlayer?'#ffeb3b':'#fff'}">#${h.number} ${h.name}${youTag}</span></div>`;
    });
}
function showNotif(t){const e=document.createElement('div');e.className='finish-notif';e.innerText=t;
document.getElementById('notifications-container').appendChild(e);setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),500);},3000);}

// --- ANIMATE ---
const clock=new THREE.Clock();
function animate(){
    if(!raceFinished)requestAnimationFrame(animate);
    const time=clock.getElapsedTime(),gSpeed=18;
    if(!raceFinished){const el=((Date.now()-raceStartTime)/1000);const m=Math.floor(el/60);const s=(el%60).toFixed(1);
        document.getElementById('race-timer').innerText=`${m}:${s<10?'0':''}${s}`;}
    let leader=null,leaderAngle=-999,lastAngle=999,maxA=-999;
    gameHorses.forEach(h=>{if(h.angle>maxA)maxA=h.angle;});
    const progress=(maxA-START_ANGLE)/(FINISH_ANGLE-START_ANGLE);
    if(progress>.78&&!stretchCalled){stretchCalled=true;camMode='stretch';
        const sc=document.getElementById('stretch-call');sc.innerHTML="AND DOWN THE<br>STRETCH THEY COME!";sc.classList.add('show');
        setTimeout(()=>sc.classList.remove('show'),3500);}
    // Update furlong bar
    const pct=Math.min(100,Math.max(0,progress*100));
    document.getElementById('furlong-fill').style.width=pct+'%';

    gameHorses.forEach((h,i)=>{
        const raceMod=progress<.5?h.earlyMod:h.lateMod;
        h.energy+=(Math.random()-.5)*.003;h.energy=Math.max(.93,Math.min(1.07,h.energy));
        h.angle+=Math.max(h.baseSpeed*raceMod*h.energy+(Math.random()-.0005)*.0001,.0004);
        const rank=gameHorses.filter(o=>o.angle>h.angle).length;
        h.targetLane=3+rank*5+Math.sin(time*.5+i)*1.5;
        // Collision avoidance: push apart from nearby horses
        gameHorses.forEach((other,j)=>{
            if(i===j)return;
            const angleDiff=Math.abs(h.angle-other.angle);
            const laneDiff=h.laneOffset-other.laneOffset;
            if(angleDiff<.06&&Math.abs(laneDiff)<6){
                // Push away laterally
                h.targetLane+=laneDiff>0?3:-3;
            }
        });
        h.targetLane=Math.max(3,Math.min(h.targetLane,DIRT_W-5));
        h.laneOffset+=(h.targetLane-h.laneOffset)*.025;
        const r=BASE_R+h.laneOffset;
        const x=Math.cos(h.angle)*r*TRACK_SX,z=Math.sin(h.angle)*r;
        const tang=Math.atan2(-Math.cos(h.angle)*r,-Math.sin(h.angle)*r*TRACK_SX);
        // Fix tangent calculation
        const dx=-Math.sin(h.angle)*r*TRACK_SX,dz=Math.cos(h.angle)*r;
        const tangent=Math.atan2(-dz,dx);
        h.model.root.position.set(x,0,z);h.model.root.rotation.y=tangent;

        // GALLOP
        const c=time*gSpeed+i*1.7;
        const bound=Math.max(0,Math.sin(c))*2;
        h.model.body.position.y=bound;h.model.body.rotation.z=Math.sin(c)*.06;

        // Front legs: proper 4-beat with knee bend
        const fl0=Math.sin(c)*.55;const fl1=Math.sin(c+.7)*.55;
        h.model.legs[0].thigh.rotation.z=fl0;
        h.model.legs[0].shin.rotation.z=.2+Math.max(0,-fl0)*1.2; // knee bends back on recovery
        h.model.legs[1].thigh.rotation.z=fl1;
        h.model.legs[1].shin.rotation.z=.2+Math.max(0,-fl1)*1.2;
        // Hind legs
        const hl0=Math.sin(c+Math.PI)*.6;const hl1=Math.sin(c+Math.PI+.7)*.6;
        h.model.legs[2].thigh.rotation.z=hl0;
        h.model.legs[2].shin.rotation.z=-.1+Math.max(0,hl0)*1;
        h.model.legs[3].thigh.rotation.z=hl1;
        h.model.legs[3].shin.rotation.z=-.1+Math.max(0,hl1)*1;

        h.model.tailG.rotation.z=.6+Math.sin(time*3+i)*.2;h.model.tailG.rotation.y=Math.sin(time*4+i)*.15;
        h.model.jG.position.y=9.5+bound*.35;h.model.jG.rotation.z=Math.sin(c)*.04;

        if(h.angle>=FINISH_ANGLE&&!h.finished){h.finished=true;finishOrder.push(h);
            const ps=finishOrder.length===1?"WINS!":finishOrder.length===2?"takes 2nd!":finishOrder.length===3?"takes 3rd!":"finishes.";
            showNotif(`🏁 #${h.number} ${h.name} ${ps}`);}
        if(!h.finished){if(h.angle>leaderAngle){leaderAngle=h.angle;leader=h;}if(h.angle<lastAngle)lastAngle=h.angle;}
    });
    updateLB();

    if(leader){
        if(camMode==='broadcast'){
            const ps=leaderAngle-lastAngle,pm=(leaderAngle+lastAngle)/2;
            const cd=45+Math.min(ps*50,30),cr=BASE_R+leader.laneOffset+DIRT_W+cd,ch=20+Math.min(ps*25,15);
            camera.position.lerp(new THREE.Vector3(Math.cos(pm+.06)*cr*TRACK_SX,ch,Math.sin(pm+.06)*cr),.08);
            camTarget.lerp(new THREE.Vector3(Math.cos(pm)*(BASE_R+15)*TRACK_SX,5,Math.sin(pm)*(BASE_R+15)),.08);
        } else {
            const fz=-(BASE_R+DIRT_W/2);
            camera.position.lerp(new THREE.Vector3(80,55,fz+15),.04);
            const pm=(leaderAngle+lastAngle)/2;
            camTarget.lerp(new THREE.Vector3(Math.cos(pm)*(BASE_R+20)*TRACK_SX,4,Math.sin(pm)*(BASE_R+20)),.06);
        }
        camera.lookAt(camTarget);
    }

    if(finishOrder.length===gameHorses.length&&!raceFinished){
        raceFinished=true;document.getElementById('race-status').innerText="RACE COMPLETE!";
        const el=((Date.now()-raceStartTime)/1000);const m=Math.floor(el/60);const s=(el%60).toFixed(1);
        document.getElementById('race-timer').innerText=`FINAL: ${m}:${s<10?'0':''}${s}`;
        setTimeout(()=>{
            const rl=document.getElementById('results-list');
            finishOrder.forEach((h,i)=>{
                const t=i===0?'WIN':i===1?'PLACE':i===2?'SHOW':`${i+1}TH`;
                const youTag=h.isPlayer?' ⭐':'';
                rl.innerHTML+=`<div class="result-row"><span class="result-place">${t}</span>
                <div class="lb-color" style="background:${h.color}"></div>
                <span style="color:${h.isPlayer?'#ffeb3b':'#fff'}">#${h.number} ${h.name}${youTag}</span></div>`;
            });
            document.getElementById('results-title').innerText=finishOrder[0].isPlayer?"🏆 DERBY CHAMPION! 🏆":"YOU LOST";
            document.getElementById('results-title').style.color=finishOrder[0].isPlayer?'#ffd700':'#fff';
            document.getElementById('results-modal').style.display='flex';
        },3000);
    }
    renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
