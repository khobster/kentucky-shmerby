<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Shmerby</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #87CEEB; 
            color: #fff;
            text-align: center;
            margin: 0; padding: 0; overflow: hidden; user-select: none;
        }

        h1 { color: #ffd700; font-size: 28px; text-shadow: 4px 4px 0px #000; margin: 20px 0; position: relative; z-index: 10; }
        .hidden { display: none !important; }
        #game-container { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; align-items: center; }

        /* Tapping Phase UI */
        #tap-zone {
            width: 90%; max-width: 600px; height: 300px; margin: 20px auto;
            background-color: #e53935; border: 8px solid #000; box-shadow: 0px 10px 0px #b71c1c;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; color: white; line-height: 1.8; text-shadow: 2px 2px 0px #000; border-radius: 8px; z-index: 10; position: relative;
        }
        #tap-zone:active { transform: translateY(10px); box-shadow: 0px 0px 0px #b71c1c; }
        button {
            padding: 15px 30px; font-size: 16px; font-family: inherit; cursor: pointer;
            background: #ffeb3b; color: #000; border: 6px solid #000; box-shadow: 0px 6px 0px #f57f17; margin-top: 20px; text-transform: uppercase; z-index: 10; position: relative;
        }
        button:hover { background: #fff176; }

        /* Finish Line Notifications */
        #notifications-container {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; flex-direction: column; align-items: center; pointer-events: none;
        }
        .finish-notif {
            background: rgba(0,0,0,0.9); border: 2px solid #ffd700; color: #fff;
            padding: 10px 20px; margin-bottom: 5px; font-size: 12px; border-radius: 4px;
            box-shadow: 0px 4px 10px rgba(0,0,0,0.5); transition: opacity 0.5s ease;
        }

        /* Broadcast Chyron */
        #leaderboard {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 50px;
            background: rgba(17, 17, 17, 0.95); border-top: 4px solid #ffd700;
            display: flex; align-items: center; justify-content: center;
            z-index: 100; box-shadow: 0px -4px 15px rgba(0,0,0,0.5); box-sizing: border-box;
        }
        #standings-list { display: flex; width: 100%; max-width: 1400px; justify-content: space-evenly; overflow: hidden; }
        .leaderboard-row { display: flex; align-items: center; padding: 0 10px; min-width: 0; flex: 1; }
        .leaderboard-place { color: #ffd700; margin-right: 6px; font-size: 10px; flex-shrink: 0; }
        .leaderboard-color { width: 12px; height: 12px; border: 2px solid #fff; margin-right: 6px; display: inline-block; flex-shrink: 0; }
        .leaderboard-name { white-space: nowrap; font-size: 9px; overflow: hidden; text-overflow: ellipsis; min-width: 0; text-align: left; flex-grow: 1; }

        /* Superfecta Results Modal */
        #results-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 6px solid #ffd700; padding: 30px;
            z-index: 1000; text-align: left; width: 80%; max-width: 500px; display: none; flex-direction: column; box-shadow: 0px 20px 50px rgba(0,0,0,0.8);
        }
        .result-row { display: flex; align-items: center; margin: 10px 0; font-size: 12px; border-bottom: 2px dashed #444; padding-bottom: 10px; }
        .result-place { width: 60px; color: #ffd700; }

        /* 3D Derby Track - TIGHT TV ZOOM */
        #race-phase {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            perspective: 1000px; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        #track-container {
            box-sizing: border-box; width: 1200px; height: 700px;
            background-color: #4caf50; border-radius: 50%;
            border: 110px solid #bd9a6c; outline: 6px solid #fff; box-shadow: inset 0 0 0 6px #fff; 
            /* Massive 3.2x Camera Zoom */
            transform: scale(3.2) rotateX(60deg); 
            position: absolute; transform-style: preserve-3d;
            /* Smooth camera panning */
            transition: transform 0.1s linear; 
        }

        .finish-line {
            position: absolute; top: -110px; left: 50%; width: 14px; height: 110px;
            background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px); border-left: 2px solid #000;
        }

        /* --- TRUE 3D CSS HORSES --- */
        .racer-wrapper {
            position: absolute; left: 50%; top: 50%; margin-left: 0; margin-top: 0;
            transform-style: preserve-3d;
        }
        
        /* The shadow lies flat on the track */
        .horse-shadow {
            position: absolute; left: -16px; top: -8px; width: 32px; height: 16px;
            background: rgba(0,0,0,0.5); border-radius: 50%; transform: translateZ(1px);
        }

        /* The anchor points the horse along the track and stands it up */
        .horse-3d-anchor {
            position: absolute; transform-style: preserve-3d;
            /* rotateZ aligns to track tangent, rotateX(-90deg) stands it up vertically! */
            transform: rotateZ(var(--tangent-angle)) rotateX(-90deg); 
        }

        @keyframes gallop-bob {
            0% { transform: translateY(0px) rotateZ(-3deg); }
            50% { transform: translateY(-4px) rotateZ(3deg); }
            100% { transform: translateY(0px) rotateZ(-3deg); }
        }
        @keyframes leg-front { 0% { transform: translateZ(5px) rotateZ(-35deg); } 100% { transform: translateZ(5px) rotateZ(35deg); } }
        @keyframes leg-back { 0% { transform: translateZ(-5px) rotateZ(35deg); } 100% { transform: translateZ(-5px) rotateZ(-35deg); } }

        .horse-model {
            position: absolute; transform-style: preserve-3d;
            animation: gallop-bob 0.25s infinite linear;
            /* Shift up so feet touch the ground */
            bottom: 0; left: -16px;
        }

        /* Generic 3D Face classes */
        .face { position: absolute; border: 1px solid rgba(0,0,0,0.3); box-sizing: border-box; }

        /* Main Body Box (32x12x10) */
        .body-box { position: absolute; bottom: 12px; left: 0; width: 32px; height: 12px; transform-style: preserve-3d; }
        .body-box .front { width: 10px; height: 12px; background: #4a2e1a; transform: rotateY(90deg) translateZ(27px); }
        .body-box .back  { width: 10px; height: 12px; background: #4a2e1a; transform: rotateY(-90deg) translateZ(5px); }
        /* Left and Right faces act as the saddlecloths! */
        .body-box .left  { width: 32px; height: 12px; background: var(--racer-color); transform: translateZ(5px); color: #fff; font-size: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-shadow: 1px 1px 0 #000; }
        .body-box .right { width: 32px; height: 12px; background: var(--racer-color); transform: rotateY(180deg) translateZ(5px); color: #fff; font-size: 8px; font-weight: bold; display: flex; align-items: center; justify-content: center; text-shadow: 1px 1px 0 #000; }
        .body-box .top   { width: 32px; height: 10px; background: #6d4527; transform: rotateX(90deg) translateZ(6px); }

        /* Head Box (14x8x6) */
        .head-box { position: absolute; bottom: 20px; right: -8px; width: 14px; height: 8px; transform-style: preserve-3d; transform: rotateZ(20deg); }
        .head-box .front { width: 6px; height: 8px; background: #4a2e1a; transform: rotateY(90deg) translateZ(11px); }
        .head-box .back  { width: 6px; height: 8px; background: #4a2e1a; transform: rotateY(-90deg) translateZ(3px); }
        .head-box .left  { width: 14px; height: 8px; background: #6d4527; transform: translateZ(3px); }
        .head-box .right { width: 14px; height: 8px; background: #6d4527; transform: rotateY(180deg) translateZ(3px); }
        .head-box .top   { width: 14px; height: 6px; background: #6d4527; transform: rotateX(90deg) translateZ(4px); }

        .h-tail { position: absolute; left: -4px; bottom: 16px; width: 8px; height: 3px; background: #222; transform: translateZ(0) rotateZ(-30deg); }

        /* Legs */
        .h-leg { position: absolute; bottom: 0px; width: 3px; height: 14px; background: #222; transform-origin: top center; border-radius: 2px; }
        .h-leg.f1 { left: 22px; animation: leg-front 0.25s infinite alternate; }
        .h-leg.f2 { left: 26px; animation: leg-back 0.25s infinite alternate; }
        .h-leg.b1 { left: 4px; animation: leg-back 0.25s infinite alternate; }
        .h-leg.b2 { left: 8px; animation: leg-front 0.25s infinite alternate; }

        /* Smiley Balloon Jockey */
        @keyframes balloon-bob { 0% { transform: translateY(0); } 100% { transform: translateY(-3px); } }
        
        .jockey-anchor {
            position: absolute; left: 10px; bottom: 24px; transform-style: preserve-3d; 
            /* Anchor to the horse, but bob up and down */
            animation: balloon-bob 0.4s infinite alternate;
        }
        
        .balloon {
            position: absolute; width: 14px; height: 14px; background: #ffeb3b; border-radius: 50%; border: 1px solid #000;
            left: -7px; bottom: 10px;
            /* Counter-rotates so it always faces the screen perfectly */
            transform: rotateX(90deg) rotateZ(var(--counter-angle));
        }
        .balloon-string {
            position: absolute; width: 1px; height: 10px; background: #fff;
            left: 0; bottom: 0; transform: rotateX(90deg) rotateY(var(--counter-angle));
        }

        .smiley-eye { position: absolute; width: 2px; height: 2px; background: #000; border-radius: 50%; top: 4px; }
        .smiley-eye.left { left: 3px; }
        .smiley-eye.right { right: 3px; }
        .smiley-mouth { position: absolute; bottom: 3px; left: 3px; width: 6px; height: 2px; border-bottom: 2px solid #000; border-radius: 50%; }

        #timer-display { font-size: 40px; color: #fff; text-shadow: 4px 4px #000; position: relative; z-index: 10;}
        #race-status { text-shadow: 3px 3px #000; line-height: 1.5; text-align: center; position: relative; z-index: 10;}
        #lobby { position: relative; z-index: 10; margin-top: 50px; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1 id="main-title">KENTUCKY SHMERBY</h1>

        <div id="lobby">
            <p>Your Steed:</p>
            <h2 id="player-horse-name" style="color: #ffeb3b; text-shadow: 2px 2px #000;">Loading...</h2>
            <button id="start-btn">ENTER DERBY</button>
        </div>

        <div id="tapping-phase" class="hidden">
            <h2 id="timer-display">10.0</h2>
            <div id="tap-zone">
                TAP HERE!<br><br>
                Speed, not force.<br>
                Your count is hidden!
            </div>
        </div>

        <div id="race-phase" class="hidden">
            <div style="position: absolute; top: 20px; width: 100%; z-index: 100;">
                <h2 id="race-status">AND THEY'RE OFF!</h2>
            </div>
            
            <div id="notifications-container"></div>

            <div id="track-container">
                <div class="finish-line"></div>
                <div id="racers-container"></div>
            </div>

            <div id="leaderboard">
                <div id="standings-list"></div>
            </div>
        </div>

        <div id="results-modal">
            <h2 id="results-title" style="text-align: center; margin-bottom: 20px;"></h2>
            <div id="results-list"></div>
            <button onclick="location.reload()" style="margin: 20px auto 0 auto; display: block;">Race Again</button>
        </div>

    </div>

    <script>
        // --- THE DERBY PDF DICTIONARY ---
        const derbyWords = [
            "Affirmed", "Agile", "Alan", "Dale", "Dreaming", "Alysheba", "American", "Pharoah", "Animal", "Kingdom",
            "Apollo", "Aristides", "Assault", "Authentic", "Azra", "Baden", "Barbaro", "Behave", "Yourself", "Ben", "Ali",
            "Brush", "Brown", "Black", "Gold", "Bold", "Forbes", "Venture", "Brokers", "Tip", "Bubbling", "Over",
            "Buchanan", "Burgoo", "King", "California", "Chrome", "Cannonade", "Canonero", "Carry", "Back", "Cavalcade",
            "Chant", "Charismatic", "Chateaugay", "Citation", "Clyde", "Dusen", "Count", "Fleet", "Turf", "Country", "House",
            "Dark", "Star", "Decidedly", "Determine", "Donau", "Donerail", "Dust", "Commander", "Elwood", "Exterminator",
            "Ferdinand", "Flying", "Ebony", "Fonso", "Foolish", "Pleasure", "Forward", "Pass", "Funny", "Cide", "Fusaichi",
            "Pegasus", "Gallahadion", "Gallant", "Fox", "Gato", "Del", "Sol", "Genuine", "Risk", "George", "Smith", "Giacomo",
            "Gin", "Grindstone", "Halma", "Hill", "Gail", "Hindoo", "Eminence", "Hoop", "Iron", "Liege", "Jet", "Pilot",
            "Joe", "Cotton", "Johnstown", "Judge", "Himes", "Justify", "Kauai", "Lawrin", "Leonatus", "Gibson", "Lil",
            "Tee", "Lookout", "Lord", "Murphy", "Lucky", "Debonair", "Macbeth", "Mage", "Majestic", "Prince", "Mandaloun",
            "Manuel", "Meridian", "Middleground", "Mine", "Bird", "Monarchos", "Montrose", "Morvich", "Mystik", "Dan",
            "Needles", "Northern", "Dancer", "Nyquist", "Rosebud", "Omaha", "Omar", "Khayyam", "Orb", "Paul", "Jones",
            "Pensive", "Pink", "Plaudit", "Pleasant", "Colony", "Ponder", "Proud", "Clarion", "Real", "Quiet", "Regret",
            "Reigh", "Strike", "Riley", "Riva", "Ridge", "Sea", "Hero", "Seattle", "Slew", "Secretariat", "Shut", "Out",
            "Silver", "Charm", "Barton", "Huon", "Smarty", "Sovereignty", "Spectacular", "Bid", "Spend", "Buck",
            "Spokane", "Stone", "Street", "Sense", "Sunday", "Silence", "Sunny", "Halo", "Super", "Saver", "Swale", "Swaps",
            "Thunder", "Gulch", "Tim", "Tam", "Tomy", "Lee", "Twenty", "Grand", "Typhoon", "Unbridled", "Vagrant", "Venetian",
            "Way", "War", "Admiral", "Emblem", "Whirlaway", "Whiskery", "Winning", "Colors", "Wintergreen", "Worth", "Zev",
            "Mystery", "Ghost", "Action", "Affiliate", "Archarcharch", "Avatar", "Bally", "Ache", "Bodemeister", "Capote",
            "Cyberknife", "Danza", "Dornoch", "Epicenter", "Exaggerator", "Frosted", "Girvin", "Hansen", "Ice", "Box",
            "Improbable", "Keen", "Liaison", "Mendelssohn", "Nehro", "Ocho", "Practical", "Joke", "Scat", "Daddy",
            "Tacitus", "Upstart", "Vekoma", "Zandon"
        ];

        function generateWeirdName() {
            let word1 = derbyWords[Math.floor(Math.random() * derbyWords.length)];
            let word2 = derbyWords[Math.floor(Math.random() * derbyWords.length)];
            return `${word1} ${word2}`;
        }

        // --- GAME STATE & CAMERA ---
        let playerHorse = { name: generateWeirdName(), taps: 0, isPlayer: true, color: "#e91e63", number: Math.floor(Math.random() * 20) + 1 }; 
        let horses = [];
        let finishOrder = [];
        let raceFinished = false;
        let timeRemaining = 10;
        const TAP_DURATION = 10; 
        
        const botColors = ["#2196f3", "#4caf50", "#ff9800", "#9c27b0", "#00bcd4"];
        
        let camX = 0;
        let camY = 0;

        // Spread out lanes for 6 horses
        const laneRadii = [
            { rx: 505, ry: 235 }, 
            { rx: 525, ry: 255 }, 
            { rx: 545, ry: 275 }, 
            { rx: 565, ry: 295 },  
            { rx: 585, ry: 315 },  
            { rx: 605, ry: 335 }   
        ];

        // --- DOM ELEMENTS ---
        const lobbyEl = document.getElementById('lobby');
        const startBtn = document.getElementById('start-btn');
        const tapPhaseEl = document.getElementById('tapping-phase');
        const tapZone = document.getElementById('tap-zone');
        const timerDisplay = document.getElementById('timer-display');
        const racePhaseEl = document.getElementById('race-phase');
        const racersContainer = document.getElementById('racers-container');
        const raceStatus = document.getElementById('race-status');
        const standingsList = document.getElementById('standings-list');
        const trackContainer = document.getElementById('track-container');
        const mainTitle = document.getElementById('main-title');
        const resultsModal = document.getElementById('results-modal');
        const resultsList = document.getElementById('results-list');
        const resultsTitle = document.getElementById('results-title');
        const notifContainer = document.getElementById('notifications-container');

        // --- INIT ---
        document.getElementById('player-horse-name').innerText = `#${playerHorse.number} ${playerHorse.name}`;

        startBtn.addEventListener('click', () => {
            lobbyEl.classList.add('hidden');
            mainTitle.classList.add('hidden'); 
            tapPhaseEl.classList.remove('hidden');
            
            let startTime = Date.now();
            let timerInterval = setInterval(() => {
                let elapsedTime = (Date.now() - startTime) / 1000;
                timeRemaining = (TAP_DURATION - elapsedTime).toFixed(1);
                
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    clearInterval(timerInterval);
                    startRace();
                }
                timerDisplay.innerText = timeRemaining;
            }, 100);
        });

        tapZone.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            playerHorse.taps++;
        });

        // --- PHASE 3: RACE LOGIC ---
        function startRace() {
            tapPhaseEl.classList.add('hidden');
            racePhaseEl.classList.remove('hidden');

            horses.push(playerHorse);
            
            for(let i=0; i<5; i++){
                let newNum;
                do { newNum = Math.floor(Math.random() * 20) + 1; } while (horses.some(h => h.number === newNum));
                horses.push({ name: generateWeirdName(), taps: Math.floor(Math.random() * 50) + 30, isPlayer: false, color: botColors[i], number: newNum });
            }
            horses.sort(() => Math.random() - 0.5);

            horses.forEach((horse, index) => {
                horse.angle = -Math.PI / 2 - (0.05 + (index * 0.04)); 
                horse.baseSpeed = 0.00060; 
                horse.speedMultiplier = horse.baseSpeed + (horse.taps * 0.000004); 
                horse.lane = laneRadii[index];
                horse.finished = false;

                const wrapper = document.createElement('div');
                wrapper.className = 'racer-wrapper';
                wrapper.id = `horse-${index}`;
                
                // Constructing the TRUE 3D Horse
                wrapper.innerHTML = `
                    <div class="horse-shadow"></div>
                    <div class="horse-3d-anchor" id="anchor-${index}">
                        <div class="horse-model">
                            <div class="h-tail"></div>
                            <div class="h-leg f1"></div>
                            <div class="h-leg f2"></div>
                            <div class="h-leg b1"></div>
                            <div class="h-leg b2"></div>
                            
                            <div class="face body-box">
                                <div class="face front"></div>
                                <div class="face back"></div>
                                <div class="face left" style="--racer-color: ${horse.color};">${horse.number}</div>
                                <div class="face right" style="--racer-color: ${horse.color};">${horse.number}</div>
                                <div class="face top"></div>
                            </div>
                            
                            <div class="face head-box">
                                <div class="face front"></div>
                                <div class="face back"></div>
                                <div class="face left"></div>
                                <div class="face right"></div>
                                <div class="face top"></div>
                            </div>
                            
                            <div class="jockey-anchor">
                                <div class="balloon-string"></div>
                                <div class="balloon">
                                    <div class="smiley">
                                        <div class="smiley-eye left"></div>
                                        <div class="smiley-eye right"></div>
                                        <div class="smiley-mouth"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                racersContainer.appendChild(wrapper);
            });

            updateLeaderboard();
            setTimeout(raceLoop, 1000); 
        }

        function updateLeaderboard() {
            const sorted = [...horses].sort((a, b) => {
                if (a.finished && !b.finished) return -1;
                if (!a.finished && b.finished) return 1;
                return b.angle - a.angle;
            });
            
            standingsList.innerHTML = '';
            sorted.forEach((horse, i) => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row';
                let place = i === 0 ? '1ST' : i === 1 ? '2ND' : i === 2 ? '3RD' : i === 3 ? '4TH' : i === 4 ? '5TH' : '6TH';
                
                row.innerHTML = `
                    <span class="leaderboard-place">${place}</span>
                    <div class="leaderboard-color" style="background-color: ${horse.color};"></div>
                    <span class="leaderboard-name" style="color: ${horse.isPlayer ? '#ffeb3b' : '#fff'};">
                        #${horse.number} ${horse.name}
                    </span>
                `;
                standingsList.appendChild(row);
            });
        }

        function showNotification(text) {
            const el = document.createElement('div');
            el.className = 'finish-notif';
            el.innerText = text;
            notifContainer.appendChild(el);
            setTimeout(() => {
                el.style.opacity = 0;
                setTimeout(() => el.remove(), 500);
            }, 2500);
        }

        function showResults() {
            resultsList.innerHTML = '';
            finishOrder.forEach((h, i) => {
                let title = i === 0 ? 'WIN' : i === 1 ? 'PLACE' : i === 2 ? 'SHOW' : `${i+1}TH`;
                resultsList.innerHTML += `
                    <div class="result-row">
                        <span class="result-place">${title}</span>
                        <div class="leaderboard-color" style="background-color: ${h.color};"></div>
                        <span style="color: ${h.isPlayer ? '#ffeb3b' : '#fff'}">#${h.number} ${h.name}</span>
                    </div>
                `;
            });
            
            if(finishOrder[0].isPlayer) {
                resultsTitle.innerText = "DERBY CHAMPION!";
                resultsTitle.style.color = "#ffeb3b";
            } else {
                resultsTitle.innerText = "YOU LOST";
                resultsTitle.style.color = "#fff";
            }
            resultsModal.style.display = 'flex';
        }

        function raceLoop() {
            const sortedHorses = [...horses].map((h, i) => ({...h, index: i})).sort((a, b) => {
                 let yA = a.lane.ry * Math.sin(a.angle);
                 let yB = b.lane.ry * Math.sin(b.angle);
                 return yA - yB;
            });

            // TV Zoom Camera Tracking (Targeting the active leader)
            const activeHorses = sortedHorses.filter(h => !horses[h.index].finished);
            const trackingHorse = activeHorses.length > 0 
                ? horses[activeHorses[activeHorses.length - 1].index] 
                : horses[sortedHorses[sortedHorses.length - 1].index];
                
            let targetCamX = -trackingHorse.lane.rx * Math.cos(trackingHorse.angle);
            let targetCamY = -trackingHorse.lane.ry * Math.sin(trackingHorse.angle);

            camX += (targetCamX - camX) * 0.05;
            camY += (targetCamY - camY) * 0.05;
            
            // Massive 3.2x Scale
            trackContainer.style.transform = `scale(3.2) rotateX(60deg) translate(${camX * 0.6}px, ${camY * 0.6}px)`;

            horses.forEach((horse, i) => {
                let randomJitter = (Math.random() * 0.0002); 
                horse.angle += horse.speedMultiplier + randomJitter;

                if (horse.angle >= (3 * Math.PI / 2) && !horse.finished) { 
                    horse.finished = true;
                    finishOrder.push(horse);
                    let placeStr = finishOrder.length === 1 ? "wins" : finishOrder.length === 2 ? "takes 2nd" : finishOrder.length === 3 ? "takes 3rd" : "finishes";
                    showNotification(`🏁 #${horse.number} ${horse.name} ${placeStr}!`);
                }
            });

            updateLeaderboard();

            sortedHorses.forEach((horseData, zIndex) => {
                const horse = horses[horseData.index];
                const index = horseData.index;

                let x = horse.lane.rx * Math.cos(horse.angle);
                let y = horse.lane.ry * Math.sin(horse.angle);

                // Math to figure out the track tangent (which way is forward)
                let tangent = Math.atan2(horse.lane.ry * Math.cos(horse.angle), -horse.lane.rx * Math.sin(horse.angle));

                const horseDiv = document.getElementById(`horse-${index}`);
                const anchor = document.getElementById(`anchor-${index}`);
                
                horseDiv.style.transform = `translate(${x}px, ${y}px)`;
                horseDiv.style.zIndex = zIndex; 
                
                // Rotates the 3D horse perfectly along the track
                anchor.style.setProperty('--tangent-angle', `${tangent}rad`);
                // Counter-rotates the balloon so the face always looks at the camera
                anchor.style.setProperty('--counter-angle', `${-tangent}rad`);
            });

            if (finishOrder.length === horses.length && !raceFinished) {
                raceFinished = true;
                raceStatus.innerText = "RACE COMPLETE!";
                setTimeout(showResults, 2000); 
            }

            if (!raceFinished) {
                requestAnimationFrame(raceLoop);
            }
        }
    </script>
</body>
</html>
