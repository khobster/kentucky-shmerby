<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Shmerby</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', monospace;
            background-color: #87CEEB; 
            color: #fff;
            text-align: center;
            margin: 0;
            padding: 0;
            overflow: hidden; 
            user-select: none;
        }

        h1 { color: #ffd700; font-size: 28px; text-shadow: 4px 4px 0px #000; margin: 20px 0; position: relative; z-index: 10; }
        .hidden { display: none !important; }
        #game-container { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; align-items: center; }

        /* Tapping Phase UI */
        #tap-zone {
            width: 90%; max-width: 600px; height: 300px; margin: 20px auto;
            background-color: #e53935; border: 8px solid #000;
            box-shadow: 0px 10px 0px #b71c1c;
            display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; color: white; line-height: 1.8;
            text-shadow: 2px 2px 0px #000; border-radius: 8px;
            z-index: 10; position: relative;
        }
        #tap-zone:active { transform: translateY(10px); box-shadow: 0px 0px 0px #b71c1c; }

        button {
            padding: 15px 30px; font-size: 16px; font-family: inherit; cursor: pointer;
            background: #ffeb3b; color: #000; border: 6px solid #000;
            box-shadow: 0px 6px 0px #f57f17; margin-top: 20px; text-transform: uppercase;
            z-index: 10; position: relative;
        }
        button:hover { background: #fff176; }

        /* Broadcast Chyron (Bottom Ticker) */
        #leaderboard {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60px;
            background: rgba(17, 17, 17, 0.95);
            border-top: 4px solid #ffd700;
            display: flex; align-items: center; justify-content: space-evenly;
            z-index: 100; font-size: 10px; box-shadow: 0px -4px 15px rgba(0,0,0,0.5);
        }
        .leaderboard-row { display: flex; align-items: center; }
        .leaderboard-place { color: #ffd700; margin-right: 8px; font-size: 12px; }
        .leaderboard-color { width: 15px; height: 15px; border: 2px solid #fff; margin-right: 8px; display: inline-block; }
        .leaderboard-name { white-space: nowrap; max-width: 180px; overflow: hidden; text-overflow: ellipsis; }

        /* 3D Derby Track - CAMERA VIEW */
        #race-phase {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            perspective: 800px; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }

        #track-container {
            box-sizing: border-box; 
            width: 900px; height: 500px;
            background-color: #4caf50; 
            border-radius: 50%;
            border: 75px solid #bd9a6c; /* The Dirt Track */
            outline: 6px solid #fff; 
            box-shadow: inset 0 0 0 6px #fff; 
            transform: scale(1.6) rotateX(55deg); 
            position: absolute;
            transform-style: preserve-3d;
            transition: transform 0.1s linear;
        }

        .finish-line {
            position: absolute; top: -75px; left: 50%; width: 14px; height: 75px;
            background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px);
            border-left: 2px solid #000;
        }

        /* --- THE NEW 2.5D BILLBOARD HORSES --- */
        .racer-wrapper {
            position: absolute; left: 50%; top: 50%; 
            /* Centers the wrapper exactly on the calculation point */
            margin-left: 0px; margin-top: 0px;
        }

        /* The shadow lies FLAT on the 3D dirt track */
        .horse-shadow {
            position: absolute; left: -15px; top: -5px; width: 30px; height: 10px;
            background: rgba(0,0,0,0.4); border-radius: 50%;
        }

        /* The billboard stands UP towards the camera */
        .billboard-container {
            position: absolute; left: -15px; top: -35px; /* Centers the horse over the shadow */
            width: 30px; height: 35px;
            transform-origin: bottom center;
            /* Will be dynamically rotated and flipped by JS */
        }

        /* Clean 2D Horse Profile */
        @keyframes gallop-bob {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }
        @keyframes leg-scissor {
            0% { transform: rotate(-25deg); }
            100% { transform: rotate(25deg); }
        }

        .horse-2d {
            position: absolute; width: 100%; height: 100%;
            animation: gallop-bob 0.25s infinite linear;
        }
        .h-body {
            position: absolute; bottom: 10px; left: 0; width: 30px; height: 12px;
            background: #5c3a21; border-radius: 6px; border: 1px solid #3a2212;
        }
        .h-head {
            position: absolute; right: -8px; top: -8px; width: 12px; height: 16px;
            background: #5c3a21; border-radius: 4px; transform: rotate(15deg); border: 1px solid #3a2212;
        }
        .h-tail {
            position: absolute; left: -6px; top: 2px; width: 10px; height: 4px;
            background: #222; transform: rotate(-30deg);
        }
        .h-leg {
            position: absolute; bottom: -2px; width: 4px; height: 12px; background: #3a2212;
            transform-origin: top center; border-radius: 2px;
        }
        .h-leg.front { right: 4px; animation: leg-scissor 0.25s infinite alternate; }
        .h-leg.back { left: 4px; animation: leg-scissor 0.25s infinite alternate-reverse; }

        /* Saddlecloth */
        .h-saddle {
            position: absolute; left: 10px; top: -2px; width: 12px; height: 10px;
            background-color: var(--racer-color); color: #fff; font-size: 7px; font-family: sans-serif; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            border: 1px solid #000; text-shadow: 1px 1px 0px #000;
        }

        /* Smiley Balloon Jockey */
        @keyframes balloon-float {
            0% { transform: translateY(0px) rotate(-5deg); }
            100% { transform: translateY(-4px) rotate(5deg); }
        }

        .balloon-jockey {
            position: absolute; left: 8px; top: -22px; width: 16px; height: 18px;
            background: #ffeb3b; border-radius: 50%; border: 1px solid #000;
            animation: balloon-float 0.4s infinite alternate ease-in-out;
        }
        /* The string attaching it to the horse */
        .balloon-jockey::after {
            content: ''; position: absolute; left: 7px; bottom: -10px; width: 1px; height: 10px; background: #fff;
        }
        /* Happy Face */
        .smiley {
            position: absolute; top: 4px; left: 3px; width: 10px; height: 8px;
        }
        .smiley-eye {
            position: absolute; width: 2px; height: 2px; background: #000; border-radius: 50%; top: 0;
        }
        .smiley-eye.left { left: 1px; }
        .smiley-eye.right { right: 1px; }
        .smiley-mouth {
            position: absolute; bottom: 0; left: 1px; width: 6px; height: 3px;
            border-bottom: 2px solid #000; border-radius: 50%;
        }

        #timer-display { font-size: 40px; color: #fff; text-shadow: 4px 4px #000; position: relative; z-index: 10;}
        #race-status { text-shadow: 3px 3px #000; line-height: 1.5; text-align: center; position: relative; z-index: 10;}
        #lobby { position: relative; z-index: 10; margin-top: 50px; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1 id="main-title">KENTUCKY SHMERBY</h1>

        <div id="lobby">
            <p>Your Steed:</p>
            <h2 id="player-horse-name" style="color: #ffeb3b; text-shadow: 2px 2px #000;">Loading...</h2>
            <button id="start-btn">ENTER DERBY</button>
        </div>

        <div id="tapping-phase" class="hidden">
            <h2 id="timer-display">10.0</h2>
            <div id="tap-zone">
                TAP HERE!<br><br>
                Speed, not force.<br>
                Your count is hidden!
            </div>
        </div>

        <div id="race-phase" class="hidden">
            <div style="position: absolute; top: 20px; width: 100%; z-index: 100;">
                <h2 id="race-status">AND THEY'RE OFF!</h2>
                <button id="restart-btn" class="hidden" onclick="location.reload()" style="margin: 0 auto; display: block;">Race Again</button>
            </div>
            
            <div id="track-container">
                <div class="finish-line"></div>
                <div id="racers-container"></div>
            </div>

            <div id="leaderboard">
                <div id="standings-list" style="display: flex; width: 100%; justify-content: space-evenly;"></div>
            </div>
        </div>
    </div>

    <script>
        // --- THE DERBY PDF DICTIONARY ---
        const derbyWords = [
            "Affirmed", "Agile", "Alan", "Dale", "Always", "Dreaming", "Alysheba", "American", "Pharoah", "Animal", "Kingdom",
            "Apollo", "Aristides", "Assault", "Authentic", "Azra", "Baden", "Barbaro", "Behave", "Yourself", "Ben", "Ali",
            "Brush", "Big", "Brown", "Black", "Gold", "Bold", "Forbes", "Venture", "Brokers", "Tip", "Bubbling", "Over",
            "Buchanan", "Burgoo", "King", "California", "Chrome", "Cannonade", "Canonero", "Carry", "Back", "Cavalcade",
            "Chant", "Charismatic", "Chateaugay", "Citation", "Clyde", "Dusen", "Count", "Fleet", "Turf", "Country", "House",
            "Dark", "Star", "Day", "Decidedly", "Determine", "Donau", "Donerail", "Dust", "Commander", "Elwood", "Exterminator",
            "Ferdinand", "Flying", "Ebony", "Fonso", "Foolish", "Pleasure", "Forward", "Pass", "Funny", "Cide", "Fusaichi",
            "Pegasus", "Gallahadion", "Gallant", "Fox", "Gato", "Del", "Sol", "Genuine", "Risk", "George", "Smith", "Giacomo",
            "Gin", "Grindstone", "Halma", "Hill", "Gail", "Hindoo", "His", "Eminence", "Hoop", "Iron", "Liege", "Jet", "Pilot",
            "Joe", "Cotton", "Johnstown", "Judge", "Himes", "Justify", "Kauai", "Lawrin", "Leonatus", "Lieut", "Gibson", "Lil",
            "Tee", "Lookout", "Lord", "Murphy", "Lucky", "Debonair", "Macbeth", "Mage", "Majestic", "Prince", "Mandaloun",
            "Manuel", "Meridian", "Middleground", "Mine", "Bird", "Monarchos", "Montrose", "Morvich", "Mystik", "Dan",
            "Needles", "Northern", "Dancer", "Nyquist", "Old", "Rosebud", "Omaha", "Omar", "Khayyam", "Orb", "Paul", "Jones",
            "Pensive", "Pink", "Plaudit", "Pleasant", "Colony", "Ponder", "Proud", "Clarion", "Real", "Quiet", "Regret",
            "Reigh", "Strike", "Riley", "Riva", "Ridge", "Sea", "Hero", "Seattle", "Slew", "Secretariat", "Shut", "Out",
            "Silver", "Charm", "Sir", "Barton", "Huon", "Smarty", "Sovereignty", "Spectacular", "Bid", "Spend", "Buck",
            "Spokane", "Stone", "Street", "Sense", "Sunday", "Silence", "Sunny", "Halo", "Super", "Saver", "Swale", "Swaps",
            "Thunder", "Gulch", "Tim", "Tam", "Tomy", "Lee", "Twenty", "Grand", "Typhoon", "Unbridled", "Vagrant", "Venetian",
            "Way", "War", "Admiral", "Emblem", "Whirlaway", "Whiskery", "Winning", "Colors", "Wintergreen", "Worth", "Zev",
            "Mystery", "Ghost", "Action", "Affiliate", "Archarcharch", "Avatar", "Bally", "Ache", "Bodemeister", "Capote",
            "Cyberknife", "Danza", "Dornoch", "Epicenter", "Exaggerator", "Frosted", "Girvin", "Hansen", "Ice", "Box",
            "Improbable", "Keen", "Liaison", "Mendelssohn", "Nehro", "Ocho", "Practical", "Joke", "Scat", "Daddy",
            "Tacitus", "Upstart", "Vekoma", "Zandon"
        ];

        function generateWeirdName() {
            let word1 = derbyWords[Math.floor(Math.random() * derbyWords.length)];
            let word2 = derbyWords[Math.floor(Math.random() * derbyWords.length)];
            return `${word1} ${word2}`;
        }

        // --- GAME STATE & CAMERA ---
        let playerHorse = { name: generateWeirdName(), taps: 0, isPlayer: true, color: "#e91e63", number: Math.floor(Math.random() * 20) + 1 }; 
        let horses = [];
        let timeRemaining = 10;
        const TAP_DURATION = 10; 
        const botColors = ["#2196f3", "#4caf50", "#ff9800", "#9c27b0"];
        
        let camX = 0;
        let camY = 0;

        // WIDER TRACK RADII: Spread out to prevent clumping
        const laneRadii = [
            { rx: 385, ry: 185 }, 
            { rx: 405, ry: 205 }, 
            { rx: 425, ry: 225 }, 
            { rx: 445, ry: 245 }  
        ];

        // --- DOM ELEMENTS ---
        const lobbyEl = document.getElementById('lobby');
        const startBtn = document.getElementById('start-btn');
        const tapPhaseEl = document.getElementById('tapping-phase');
        const tapZone = document.getElementById('tap-zone');
        const timerDisplay = document.getElementById('timer-display');
        const racePhaseEl = document.getElementById('race-phase');
        const racersContainer = document.getElementById('racers-container');
        const raceStatus = document.getElementById('race-status');
        const restartBtn = document.getElementById('restart-btn');
        const standingsList = document.getElementById('standings-list');
        const trackContainer = document.getElementById('track-container');
        const mainTitle = document.getElementById('main-title');

        // --- INIT ---
        document.getElementById('player-horse-name').innerText = `#${playerHorse.number} ${playerHorse.name}`;

        // --- PHASE 2: TAPPING LOGIC ---
        startBtn.addEventListener('click', () => {
            lobbyEl.classList.add('hidden');
            mainTitle.classList.add('hidden'); 
            tapPhaseEl.classList.remove('hidden');
            
            let startTime = Date.now();
            let timerInterval = setInterval(() => {
                let elapsedTime = (Date.now() - startTime) / 1000;
                timeRemaining = (TAP_DURATION - elapsedTime).toFixed(1);
                
                if (timeRemaining <= 0) {
                    timeRemaining = 0;
                    clearInterval(timerInterval);
                    startRace();
                }
                timerDisplay.innerText = timeRemaining;
            }, 100);
        });

        tapZone.addEventListener('pointerdown', (e) => {
            e.preventDefault(); 
            playerHorse.taps++;
        });

        // --- PHASE 3: RACE LOGIC ---
        function startRace() {
            tapPhaseEl.classList.add('hidden');
            racePhaseEl.classList.remove('hidden');

            horses.push(playerHorse);
            
            for(let i=0; i<3; i++){
                let newNum;
                do { newNum = Math.floor(Math.random() * 20) + 1; } while (horses.some(h => h.number === newNum));

                horses.push({
                    name: generateWeirdName(),
                    taps: Math.floor(Math.random() * 50) + 30, 
                    isPlayer: false,
                    color: botColors[i],
                    number: newNum
                });
            }
            horses.sort(() => Math.random() - 0.5);

            horses.forEach((horse, index) => {
                // STAGGERED START: Spreads them out behind the starting gate
                horse.angle = -Math.PI / 2 - (0.05 + (index * 0.04)); 
                
                horse.baseSpeed = 0.00080; 
                horse.speedMultiplier = horse.baseSpeed + (horse.taps * 0.000004); 
                horse.lane = laneRadii[index];

                const wrapper = document.createElement('div');
                wrapper.className = 'racer-wrapper';
                wrapper.id = `horse-${index}`;
                
                // BILLBOARD HORSE & SMILEY BALLOON
                wrapper.innerHTML = `
                    <div class="horse-shadow"></div>
                    <div class="billboard-container" id="billboard-${index}">
                        <div class="horse-2d">
                            <div class="h-tail"></div>
                            <div class="h-leg back"></div>
                            <div class="h-leg front"></div>
                            <div class="h-body"></div>
                            <div class="h-head"></div>
                            
                            <div class="balloon-jockey">
                                <div class="smiley">
                                    <div class="smiley-eye left"></div>
                                    <div class="smiley-eye right"></div>
                                    <div class="smiley-mouth"></div>
                                </div>
                            </div>
                            
                            <div class="h-saddle" style="--racer-color: ${horse.color};">${horse.number}</div>
                        </div>
                    </div>
                `;
                racersContainer.appendChild(wrapper);
            });

            updateLeaderboard();
            setTimeout(raceLoop, 1000); 
        }

        function updateLeaderboard() {
            const sorted = [...horses].sort((a, b) => b.angle - a.angle);
            standingsList.innerHTML = '';
            sorted.forEach((horse, i) => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row';
                let place = i === 0 ? '1ST' : i === 1 ? '2ND' : i === 2 ? '3RD' : '4TH';
                
                row.innerHTML = `
                    <span class="leaderboard-place">${place}</span>
                    <div class="leaderboard-color" style="background-color: ${horse.color};"></div>
                    <span class="leaderboard-name" style="color: ${horse.isPlayer ? '#ffeb3b' : '#fff'};">
                        #${horse.number} ${horse.name}
                    </span>
                `;
                standingsList.appendChild(row);
            });
        }

        function raceLoop() {
            let raceFinished = false;

            const sortedHorses = [...horses].map((h, i) => ({...h, index: i})).sort((a, b) => {
                 let yA = a.lane.ry * Math.sin(a.angle);
                 let yB = b.lane.ry * Math.sin(b.angle);
                 return yA - yB;
            });

            // Camera Tracking
            const leadHorse = horses[sortedHorses[sortedHorses.length - 1].index]; 
            let targetCamX = -leadHorse.lane.rx * Math.cos(leadHorse.angle);
            let targetCamY = -leadHorse.lane.ry * Math.sin(leadHorse.angle);

            camX += (targetCamX - camX) * 0.05;
            camY += (targetCamY - camY) * 0.05;
            
            trackContainer.style.transform = `scale(1.7) rotateX(55deg) translate(${camX * 0.6}px, ${camY * 0.6}px)`;

            horses.forEach((horse, i) => {
                let randomJitter = (Math.random() * 0.0002); 
                horse.angle += horse.speedMultiplier + randomJitter;
            });

            updateLeaderboard();

            sortedHorses.forEach((horseData, zIndex) => {
                const horse = horses[horseData.index];
                const index = horseData.index;

                let x = horse.lane.rx * Math.cos(horse.angle);
                let y = horse.lane.ry * Math.sin(horse.angle);

                const horseDiv = document.getElementById(`horse-${index}`);
                const billboard = document.getElementById(`billboard-${index}`);
                
                // Move the wrapper around the track
                horseDiv.style.transform = `translate(${x}px, ${y}px)`;
                horseDiv.style.zIndex = zIndex; 

                // BILLBOARDING LOGIC: Find out if the horse is moving left or right
                // Math.sin(angle) goes positive on the bottom half of the track (moving left)
                let movingRight = Math.sin(horse.angle) < 0; 
                let flip = movingRight ? 1 : -1;
                
                // Keep the horse standing straight up, but flip horizontally if moving left
                billboard.style.transform = `rotateX(-55deg) scaleX(${flip})`;

                if (horse.angle >= (3 * Math.PI / 2) && !raceFinished) { 
                    raceFinished = true;
                    if(horse.isPlayer) {
                        raceStatus.style.color = "#ffeb3b";
                        raceStatus.innerText = `YOU WIN! \n ${horse.name} takes the Derby!`; 
                    } else {
                        raceStatus.style.color = "#fff";
                        raceStatus.innerText = `YOU LOST. \n ${horse.name} takes the Derby!`;
                    }
                    restartBtn.classList.remove('hidden');
                }
            });

            if (!raceFinished) {
                requestAnimationFrame(raceLoop);
            }
        }
    </script>
</body>
</html>
