<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Shmerby</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');
        *{margin:0;padding:0;box-sizing:border-box;}
        body{font-family:'Press Start 2P',monospace;background:#000;color:#fff;overflow:hidden;user-select:none;}
        .hidden{display:none!important;}
        #game-container{width:100vw;height:100vh;position:relative;display:flex;flex-direction:column;align-items:center;}
        #canvas-container{position:absolute;top:0;left:0;width:100%;height:100%;z-index:1;}
        #lobby,#tapping-phase{position:relative;z-index:10;margin-top:50px;text-align:center;}
        h1{color:#ffd700;font-size:24px;text-shadow:4px 4px 0 #000;margin:20px 0;position:relative;z-index:10;}
        #tap-zone{width:90%;max-width:600px;height:280px;margin:20px auto;background:#e53935;border:8px solid #000;
            box-shadow:0 10px 0 #b71c1c;display:flex;align-items:center;justify-content:center;
            font-size:14px;cursor:pointer;color:#fff;line-height:1.8;text-shadow:2px 2px 0 #000;border-radius:8px;}
        #tap-zone:active{transform:translateY(10px);box-shadow:0 0 0 #b71c1c;}
        button{padding:15px 30px;font-size:14px;font-family:inherit;cursor:pointer;background:#ffeb3b;color:#000;
            border:6px solid #000;box-shadow:0 6px 0 #f57f17;margin-top:20px;text-transform:uppercase;}
        button:hover{background:#fff176;}
        #notifications-container{position:absolute;top:80px;left:50%;transform:translateX(-50%);
            z-index:1000;display:flex;flex-direction:column;align-items:center;pointer-events:none;}
        .finish-notif{background:rgba(0,0,0,0.9);border:2px solid #ffd700;color:#fff;
            padding:12px 24px;margin-bottom:8px;font-size:11px;border-radius:4px;
            box-shadow:0 4px 15px rgba(0,0,0,0.6);transition:opacity 0.5s ease;}
        #leaderboard{position:absolute;bottom:0;left:0;width:100%;height:55px;
            background:rgba(17,17,17,0.95);border-top:4px solid #ffd700;
            display:flex;align-items:center;justify-content:center;
            z-index:100;padding:0 10px;}
        #standings-list{display:flex;width:100%;max-width:1400px;justify-content:space-evenly;align-items:center;gap:6px;}
        .lb-row{display:flex;align-items:center;flex:1;min-width:0;background:#333;padding:6px 8px;border-radius:4px;border:1px solid #555;}
        .lb-place{color:#ffd700;margin-right:5px;font-size:9px;flex-shrink:0;}
        .lb-color{width:10px;height:10px;border:2px solid #fff;margin-right:5px;display:inline-block;flex-shrink:0;}
        .lb-name{white-space:nowrap;font-size:9px;overflow:hidden;text-overflow:ellipsis;min-width:0;flex-grow:1;text-align:left;}
        #results-modal{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            background:rgba(0,0,0,0.95);border:6px solid #ffd700;padding:30px;
            z-index:1000;text-align:left;width:90%;max-width:500px;display:none;flex-direction:column;box-shadow:0 20px 50px rgba(0,0,0,0.8);}
        .result-row{display:flex;align-items:center;margin:8px 0;font-size:11px;border-bottom:2px dashed #444;padding-bottom:8px;}
        .result-place{width:55px;color:#ffd700;}
        #timer-display{font-size:36px;color:#fff;text-shadow:4px 4px #000;position:relative;z-index:10;}
        #race-header{position:absolute;top:12px;left:0;width:100%;z-index:100;text-align:center;padding:0 15px;}
        #race-status{text-shadow:3px 3px #000;font-size:16px;line-height:1.4;}
        #lap-display{font-size:12px;text-shadow:2px 2px #000;color:#ffd700;margin-top:3px;}
        /* Stretch call flash */
        #stretch-call{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);
            z-index:500;font-size:28px;color:#fff;text-shadow:6px 6px 0 #000,-2px -2px 0 #ffd700;
            pointer-events:none;opacity:0;transition:opacity 0.4s;white-space:nowrap;text-align:center;line-height:1.4;}
        #stretch-call.show{opacity:1;}
    </style>
</head>
<body>
<div id="game-container">
    <div id="canvas-container"></div>
    <h1 id="main-title">KENTUCKY SHMERBY</h1>
    <div id="lobby">
        <p style="font-size:11px;">Your Steed:</p>
        <h2 id="player-horse-name" style="color:#ffeb3b;text-shadow:2px 2px #000;font-size:16px;">Loading...</h2>
        <p style="font-size:9px;color:#ffd700;margin-top:12px;">1¼ MILES • RUN FOR THE ROSES</p>
        <button id="start-btn">ENTER DERBY</button>
    </div>
    <div id="tapping-phase" class="hidden">
        <h2 id="timer-display">10.0</h2>
        <div id="tap-zone">TAP HERE!<br><br>Speed, not force.<br>Your count is hidden!</div>
    </div>
    <div id="race-phase" class="hidden">
        <div id="race-header">
            <h2 id="race-status">AND THEY'RE OFF!</h2>
            <div id="lap-display"></div>
        </div>
        <div id="stretch-call"></div>
        <div id="notifications-container"></div>
        <div id="leaderboard"><div id="standings-list"></div></div>
    </div>
    <div id="results-modal">
        <h2 id="results-title" style="text-align:center;margin-bottom:20px;"></h2>
        <div id="results-list"></div>
        <button onclick="location.reload()" style="margin:20px auto 0;display:block;">Race Again</button>
    </div>
</div>
<script>
// --- NAMES ---
const DW=["Affirmed","Agile","Alysheba","American","Pharoah","Animal","Kingdom","Apollo","Aristides","Assault","Authentic",
"Barbaro","Behave","Black","Gold","Bold","Venture","Brokers","Tip","Bubbling","Over","Burgoo","King","California","Chrome",
"Cannonade","Carry","Back","Cavalcade","Charismatic","Citation","Count","Fleet","Country","House","Dark","Star","Decidedly",
"Donerail","Dust","Commander","Elwood","Exterminator","Ferdinand","Flying","Ebony","Foolish","Pleasure","Forward","Pass",
"Funny","Cide","Fusaichi","Pegasus","Gallant","Fox","Genuine","Risk","Giacomo","Grindstone","Halma","Hindoo","Eminence",
"Iron","Liege","Jet","Pilot","Johnstown","Justify","Kauai","Lawrin","Lucky","Debonair","Mage","Majestic","Prince",
"Monarchos","Montrose","Mystik","Dan","Needles","Northern","Dancer","Nyquist","Omaha","Omar","Khayyam","Orb",
"Pensive","Plaudit","Pleasant","Colony","Ponder","Proud","Clarion","Real","Quiet","Regret","Riva","Ridge","Sea","Hero",
"Seattle","Slew","Secretariat","Silver","Charm","Smarty","Spectacular","Bid","Spend","Buck","Spokane","Sunday","Silence",
"Super","Saver","Swale","Swaps","Thunder","Gulch","Typhoon","Unbridled","War","Admiral","Whirlaway","Winning","Colors","Zev"];
function genName(){return DW[Math.floor(Math.random()*DW.length)]+' '+DW[Math.floor(Math.random()*DW.length)];}

let playerHorse={name:genName(),taps:0,isPlayer:true,color:"#e91e63",number:Math.floor(Math.random()*20)+1};
let gameHorses=[],finishOrder=[],raceFinished=false,stretchCalled=false;
const botColors=["#2196f3","#4caf50","#ff9800","#9c27b0","#00bcd4"];

// Track: bigger oval
const TRACK_SX=1.8, BASE_R=280, DIRT_W=75;
// KD is 1.25 miles. We do 1 full lap. Target time ~2min = 120s at 60fps = 7200 frames
// 1 lap = 2*PI. So avg speed = 2*PI/7200 ≈ 0.000873 rad/frame
const START_ANGLE=-Math.PI/2;
const FINISH_ANGLE=START_ANGLE+2*Math.PI; // 1 full lap
const AVG_SPEED=0.000873;

// --- THREE.JS ---
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x87CEEB);
scene.fog=new THREE.Fog(0x87CEEB,500,1100);
const camera=new THREE.PerspectiveCamera(45,innerWidth/innerHeight,1,3000);
const camTarget=new THREE.Vector3();
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setSize(innerWidth,innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true;
document.getElementById('canvas-container').appendChild(renderer.domElement);
scene.add(new THREE.AmbientLight(0xffffff,0.6));
const sun=new THREE.DirectionalLight(0xffffff,0.75);
sun.position.set(150,300,80);sun.castShadow=true;
sun.shadow.camera.top=500;sun.shadow.camera.bottom=-500;
sun.shadow.camera.left=-600;sun.shadow.camera.right=600;
scene.add(sun);

// --- TEXTURES ---
function mowedGrass(){
    const c=document.createElement('canvas');c.width=512;c.height=512;
    const x=c.getContext('2d');
    for(let i=0;i<18;i++){x.fillStyle=i%2?'#3d8a35':'#4da843';x.fillRect(0,i*28.4,512,28.4);}
    const d=x.getImageData(0,0,512,512);
    for(let j=0;j<d.data.length;j+=4){const n=(Math.random()-.5)*8;d.data[j]+=n;d.data[j+1]+=n;d.data[j+2]+=n;}
    x.putImageData(d,0,0);
    const t=new THREE.CanvasTexture(c);t.wrapS=t.wrapT=THREE.RepeatWrapping;t.repeat.set(6,6);return t;
}
function saddleTex(num,col){
    const c=document.createElement('canvas');c.width=128;c.height=128;const x=c.getContext('2d');
    x.fillStyle=col;x.fillRect(0,0,128,128);
    x.strokeStyle='#000';x.lineWidth=6;x.strokeRect(0,0,128,128);
    x.fillStyle='#fff';x.font='bold 64px "Press Start 2P",monospace';
    x.textAlign='center';x.textBaseline='middle';x.fillText(num,64,68);
    x.lineWidth=3;x.strokeText(num,64,68);
    return new THREE.CanvasTexture(c);
}

// --- TRACK ---
(function buildTrack(){
    const g=new THREE.Group();
    // Infield
    const grass=new THREE.Mesh(new THREE.CircleGeometry(BASE_R-3,80),new THREE.MeshLambertMaterial({map:mowedGrass()}));
    grass.rotation.x=-Math.PI/2;grass.receiveShadow=true;g.add(grass);
    // Dirt
    const dirt=new THREE.Mesh(new THREE.RingGeometry(BASE_R-3,BASE_R+DIRT_W,80),new THREE.MeshLambertMaterial({color:0xbd9a6c}));
    dirt.rotation.x=-Math.PI/2;dirt.receiveShadow=true;g.add(dirt);
    // Outer
    const out=new THREE.Mesh(new THREE.RingGeometry(BASE_R+DIRT_W,BASE_R+400,80),new THREE.MeshLambertMaterial({color:0x5a9e4b}));
    out.rotation.x=-Math.PI/2;out.position.y=-0.1;g.add(out);
    // Rails
    const rm=new THREE.MeshBasicMaterial({color:0xffffff});
    const ir=new THREE.Mesh(new THREE.TorusGeometry(BASE_R-3,.6,8,80),rm);ir.rotation.x=-Math.PI/2;ir.position.y=2;g.add(ir);
    const or2=new THREE.Mesh(new THREE.TorusGeometry(BASE_R+DIRT_W,.6,8,80),rm);or2.rotation.x=-Math.PI/2;or2.position.y=2;g.add(or2);
    // Finish line at START_ANGLE position (top of oval, z=-radius area)
    const fc=document.createElement('canvas');fc.width=64;fc.height=64;const fx=fc.getContext('2d');
    for(let r=0;r<8;r++)for(let c2=0;c2<8;c2++){fx.fillStyle=(r+c2)%2?'#000':'#fff';fx.fillRect(c2*8,r*8,8,8);}
    const fl=new THREE.Mesh(new THREE.PlaneGeometry(DIRT_W+6,5),new THREE.MeshBasicMaterial({map:new THREE.CanvasTexture(fc)}));
    fl.rotation.x=-Math.PI/2;fl.rotation.z=Math.PI/2;
    fl.position.set(0,.2,-(BASE_R+DIRT_W/2));g.add(fl);
    // Finish poles
    for(let s of[-1,1]){
        const p=new THREE.Mesh(new THREE.CylinderGeometry(.4,.4,18,8),new THREE.MeshLambertMaterial({color:0xffffff}));
        p.position.set(0,9,-(BASE_R-3+s*(DIRT_W+3)));g.add(p);
    }
    g.scale.set(TRACK_SX,1,1);scene.add(g);
})();

// --- MASCOT HEADS ---
function buildLiberty(){
    const g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:0x6dbfa1});
    g.add(new THREE.Mesh(new THREE.SphereGeometry(2.2,12,12),m));
    const cb=new THREE.Mesh(new THREE.CylinderGeometry(2.3,2,1.2,8),m);cb.position.y=2;g.add(cb);
    for(let i=0;i<7;i++){const s=new THREE.Mesh(new THREE.ConeGeometry(.35,2.5,4),new THREE.MeshLambertMaterial({color:0x5aa88a}));
        const a=(i/7)*Math.PI*2;s.position.set(Math.cos(a)*1.8,3.5,Math.sin(a)*1.8);g.add(s);}
    const em=new THREE.MeshBasicMaterial({color:0x222});
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.35,6,6),em);e.position.set(s*.8,.4,1.8);g.add(e);}
    return g;
}
function buildBunny(){
    const g=new THREE.Group(),pk=new THREE.MeshLambertMaterial({color:0xffc0cb}),wh=new THREE.MeshLambertMaterial({color:0xffffff});
    g.add(new THREE.Mesh(new THREE.SphereGeometry(2.2,12,12),wh));
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.CylinderGeometry(.6,.8,4.5,8),wh);e.position.set(s*1,4,0);e.rotation.z=s*-.15;g.add(e);
        const ie=new THREE.Mesh(new THREE.CylinderGeometry(.3,.5,3.5,8),pk);ie.position.set(s*1,4.2,.1);ie.rotation.z=s*-.15;g.add(ie);}
    const em=new THREE.MeshBasicMaterial({color:0x222});
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.35,6,6),em);e.position.set(s*.8,.4,1.8);g.add(e);}
    const n=new THREE.Mesh(new THREE.SphereGeometry(.4,6,6),pk);n.position.set(0,-.2,2);g.add(n);
    return g;
}
function buildMouse(){
    const g=new THREE.Group(),dk=new THREE.MeshLambertMaterial({color:0x333});
    g.add(new THREE.Mesh(new THREE.SphereGeometry(2,12,12),dk));
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(1.8,12,12),dk);e.position.set(s*2,2.5,0);e.scale.set(1,1,.3);g.add(e);}
    const sn=new THREE.Mesh(new THREE.SphereGeometry(1,10,10),new THREE.MeshLambertMaterial({color:0xddccbb}));
    sn.position.set(0,-.3,1.5);sn.scale.set(1,.7,.8);g.add(sn);
    const ns=new THREE.Mesh(new THREE.SphereGeometry(.4,6,6),new THREE.MeshLambertMaterial({color:0x111}));ns.position.set(0,0,2.2);g.add(ns);
    const wm=new THREE.MeshBasicMaterial({color:0xfff});
    for(let s of[-1,1]){const ew=new THREE.Mesh(new THREE.SphereGeometry(.6,8,8),wm);ew.position.set(s*.9,.7,1.6);ew.scale.set(.8,1,.5);g.add(ew);
        const p=new THREE.Mesh(new THREE.SphereGeometry(.3,6,6),new THREE.MeshBasicMaterial({color:0x000}));p.position.set(s*.9,.7,1.9);g.add(p);}
    return g;
}
function buildTennis(){
    const g=new THREE.Group(),m=new THREE.MeshLambertMaterial({color:0xccff00});
    g.add(new THREE.Mesh(new THREE.SphereGeometry(2.5,16,16),m));
    const sm=new THREE.MeshBasicMaterial({color:0xfff});
    const s1=new THREE.Mesh(new THREE.TorusGeometry(2.5,.12,8,32),sm);s1.rotation.x=Math.PI/3;g.add(s1);
    const s2=new THREE.Mesh(new THREE.TorusGeometry(2.5,.12,8,32),sm);s2.rotation.x=-Math.PI/3;s2.rotation.y=Math.PI;g.add(s2);
    const gm=new THREE.MeshBasicMaterial({color:0x111});
    for(let s of[-1,1]){const l=new THREE.Mesh(new THREE.BoxGeometry(1.1,.6,.3),gm);l.position.set(s*.8,.4,2.3);g.add(l);}
    const br=new THREE.Mesh(new THREE.BoxGeometry(.5,.15,.3),gm);br.position.set(0,.4,2.3);g.add(br);
    return g;
}
function buildHelmet(){
    const g=new THREE.Group(),hm=new THREE.MeshLambertMaterial({color:0x0033a0});
    const sh=new THREE.Mesh(new THREE.SphereGeometry(2.5,14,14),hm);sh.scale.set(1,1.05,1.1);g.add(sh);
    const bm=new THREE.MeshLambertMaterial({color:0xaaa});
    for(let j=0;j<3;j++){const b=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,3,6),bm);b.rotation.z=Math.PI/2;b.position.set(0,-.3+j*.7,2.3);g.add(b);}
    const vb=new THREE.Mesh(new THREE.CylinderGeometry(.1,.1,2,6),bm);vb.position.set(0,.4,2.3);g.add(vb);
    const st=new THREE.Mesh(new THREE.BoxGeometry(.5,.2,5),new THREE.MeshLambertMaterial({color:0xfff}));st.position.y=2.6;g.add(st);
    const fc=new THREE.Mesh(new THREE.SphereGeometry(1.5,10,10),new THREE.MeshLambertMaterial({color:0xddb89a}));fc.position.set(0,-.2,.8);g.add(fc);
    const em=new THREE.MeshBasicMaterial({color:0x222});
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.SphereGeometry(.25,6,6),em);e.position.set(s*.55,.2,2);g.add(e);}
    return g;
}
function buildTiger(){
    const g=new THREE.Group(),om=new THREE.MeshLambertMaterial({color:0xff8c00}),wm=new THREE.MeshLambertMaterial({color:0xffeedd}),bk=new THREE.MeshLambertMaterial({color:0x222});
    g.add(new THREE.Mesh(new THREE.SphereGeometry(2.3,14,14),om));
    const mz=new THREE.Mesh(new THREE.SphereGeometry(1.2,10,10),wm);mz.position.set(0,-.5,1.5);mz.scale.set(1.2,.8,.8);g.add(mz);
    const ns=new THREE.Mesh(new THREE.SphereGeometry(.4,6,6),new THREE.MeshLambertMaterial({color:0xff5555}));ns.position.set(0,0,2.1);g.add(ns);
    for(let s of[-1,1]){const ea=new THREE.Mesh(new THREE.SphereGeometry(.8,8,8),om);ea.position.set(s*1.7,2,-.3);ea.scale.set(1,1,.4);g.add(ea);}
    for(let i=-1;i<=1;i++){const st=new THREE.Mesh(new THREE.BoxGeometry(.25,1.2,.3),bk);st.position.set(i*.7,1.8,1.6);st.rotation.x=-.3;g.add(st);}
    const ym=new THREE.MeshLambertMaterial({color:0xffee77}),em=new THREE.MeshBasicMaterial({color:0x222});
    for(let s of[-1,1]){const ew=new THREE.Mesh(new THREE.SphereGeometry(.5,8,8),ym);ew.position.set(s*.9,.6,1.7);ew.scale.set(1,.7,.5);g.add(ew);
        const ep=new THREE.Mesh(new THREE.SphereGeometry(.25,6,6),em);ep.position.set(s*.9,.6,2);g.add(ep);}
    return g;
}
const mascotBuilders=[buildLiberty,buildBunny,buildMouse,buildTennis,buildHelmet,buildTiger];

// --- ROUNDED 3D HORSE ---
function createHorse(colorHex,number,mascotIdx){
    const root=new THREE.Group(),body=new THREE.Group();root.add(body);
    const brown=new THREE.MeshLambertMaterial({color:0x6B4226});
    const dkBrown=new THREE.MeshLambertMaterial({color:0x3a2212});
    const hoof=new THREE.MeshLambertMaterial({color:0x1a1a1a});
    const mane=new THREE.MeshLambertMaterial({color:0x1a0f00});
    const hood=new THREE.MeshLambertMaterial({color:new THREE.Color(colorHex)});

    // BODY - elongated sphere
    const torso=new THREE.Mesh(new THREE.SphereGeometry(1,14,10),brown);
    torso.scale.set(7,2.8,2.8);torso.position.y=6;torso.castShadow=true;body.add(torso);

    // Rump (rear sphere for roundness)
    const rump=new THREE.Mesh(new THREE.SphereGeometry(3,10,10),brown);
    rump.position.set(-5,6.5,0);rump.castShadow=true;body.add(rump);

    // Saddlecloths
    const st=saddleTex(number.toString(),colorHex);const sm=new THREE.MeshLambertMaterial({map:st});
    const sR=new THREE.Mesh(new THREE.PlaneGeometry(6,4.5),sm);sR.position.set(-1,6.5,2.9);body.add(sR);
    const sL=new THREE.Mesh(new THREE.PlaneGeometry(6,4.5),sm);sL.position.set(-1,6.5,-2.9);sL.rotation.y=Math.PI;body.add(sL);

    // NECK - cylinder angled forward
    const neckGeo=new THREE.CylinderGeometry(1.5,2,8,8);
    const neck=new THREE.Mesh(neckGeo,brown);
    neck.position.set(6,10,0);neck.rotation.z=.55;neck.castShadow=true;body.add(neck);

    // HEAD - elongated sphere (horse skull shape)
    const skull=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),brown);
    skull.scale.set(3.5,1.6,1.6);skull.position.set(10.5,13,0);body.add(skull);

    // Muzzle (front of head, slightly wider/lower)
    const muzzle=new THREE.Mesh(new THREE.SphereGeometry(1,10,8),new THREE.MeshLambertMaterial({color:0x8B6B4A}));
    muzzle.scale.set(1.8,1.2,1.3);muzzle.position.set(13.5,12.3,0);body.add(muzzle);

    // Nostrils
    const nm=new THREE.MeshBasicMaterial({color:0x333});
    const nL=new THREE.Mesh(new THREE.SphereGeometry(.3,6,6),nm);nL.position.set(15,12.3,.7);body.add(nL);
    const nR=new THREE.Mesh(new THREE.SphereGeometry(.3,6,6),nm);nR.position.set(15,12.3,-.7);body.add(nR);

    // HOOD over skull
    const hoodMesh=new THREE.Mesh(new THREE.SphereGeometry(1,12,10),hood);
    hoodMesh.scale.set(3.7,1.75,1.75);hoodMesh.position.set(10.5,13,0);body.add(hoodMesh);

    // Eye holes
    const ehm=new THREE.MeshBasicMaterial({color:0x111});
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.CircleGeometry(.7,8),ehm);e.position.set(12.5,13.5,s*1.77);if(s<0)e.rotation.y=Math.PI;body.add(e);}

    // Ears through hood
    for(let s of[-1,1]){const e=new THREE.Mesh(new THREE.ConeGeometry(.6,2.5,6),hood);e.position.set(9.5,15.5,s*1);e.rotation.z=.15;body.add(e);}

    // Mane tufts
    for(let i=0;i<5;i++){const t=new THREE.Mesh(new THREE.SphereGeometry(.8,6,6),mane);t.scale.set(1,1.5,2);
        t.position.set(5+i*1.3,11+i*.55,0);body.add(t);}

    // Tail
    const tailG=new THREE.Group();
    const tail=new THREE.Mesh(new THREE.CylinderGeometry(.3,.6,5,6),mane);
    tail.rotation.z=.8;tail.position.y=-1;tailG.add(tail);
    tailG.position.set(-8,7.5,0);body.add(tailG);

    // LEGS - cylinders with proper gallop pivot
    const legs=[];
    const legR=.65, legH=6;
    const legGeo=new THREE.CylinderGeometry(legR*.7,legR,legH,8);
    legGeo.translate(0,-legH/2,0); // pivot at top
    const positions=[[4.5,4.5,1.8],[4.5,4.5,-1.8],[-4.5,4.5,1.8],[-4.5,4.5,-1.8]];
    positions.forEach(p=>{
        const leg=new THREE.Mesh(legGeo,dkBrown);
        leg.position.set(p[0],p[1],p[2]);leg.castShadow=true;body.add(leg);
        // Lower leg
        const lowerGeo=new THREE.CylinderGeometry(legR*.5,legR*.6,4,6);
        lowerGeo.translate(0,-2,0);
        const lower=new THREE.Mesh(lowerGeo,dkBrown);
        lower.position.y=-legH;leg.add(lower);
        // Hoof
        const h=new THREE.Mesh(new THREE.CylinderGeometry(legR*.8,legR*.9,1,6),hoof);
        h.position.y=-4;lower.add(h);
        legs.push({upper:leg,lower:lower});
    });

    // JOCKEY
    const jG=new THREE.Group();jG.position.set(-2,10,0);body.add(jG);
    const jm=new THREE.MeshLambertMaterial({color:new THREE.Color(colorHex)});
    // Torso
    const jt=new THREE.Mesh(new THREE.CylinderGeometry(.7,1,2.5,8),jm);jt.position.y=1.5;jG.add(jt);
    // Arms
    for(let s of[-1,1]){const a=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,2.5,6),jm);a.position.set(.5,2,s*1.3);a.rotation.x=s*-.3;a.rotation.z=-.5;jG.add(a);}
    // Legs
    const pm=new THREE.MeshLambertMaterial({color:0xffffff});
    for(let s of[-1,1]){const l=new THREE.Mesh(new THREE.CylinderGeometry(.25,.3,1.8,6),pm);l.position.set(0,.2,s*.5);jG.add(l);}
    // Mascot head
    const mHead=mascotBuilders[mascotIdx]();mHead.position.set(0,4.5,0);mHead.scale.set(.8,.8,.8);mHead.rotation.y=Math.PI/2;jG.add(mHead);

    return{root,body,tailG,legs,jG};
}

// --- UI ---
document.getElementById('player-horse-name').innerText=`#${playerHorse.number} ${playerHorse.name}`;
document.getElementById('start-btn').addEventListener('click',()=>{
    document.getElementById('lobby').classList.add('hidden');
    document.getElementById('main-title').classList.add('hidden');
    document.getElementById('tapping-phase').classList.remove('hidden');
    let st=Date.now();
    let ti=setInterval(()=>{
        let r=(10-(Date.now()-st)/1000).toFixed(1);
        if(r<=0){r=0;clearInterval(ti);startRace();}
        document.getElementById('timer-display').innerText=r;
    },100);
});
document.getElementById('tap-zone').addEventListener('pointerdown',e=>{e.preventDefault();playerHorse.taps++;});

// --- RACE ---
function startRace(){
    document.getElementById('tapping-phase').classList.add('hidden');
    document.getElementById('race-phase').classList.remove('hidden');

    gameHorses.push(playerHorse);
    for(let i=0;i<5;i++){
        let n;do{n=Math.floor(Math.random()*20)+1;}while(gameHorses.some(h=>h.number===n));
        // Wider range of bot taps: 20-65 for more variance
        const botTaps=Math.floor(Math.random()*45)+20;
        // Running styles: 0=frontrunner, 1=stalker, 2=closer
        const style=i<2?0:i<4?1:2;
        gameHorses.push({name:genName(),taps:botTaps,isPlayer:false,color:botColors[i],number:n,style});
    }
    gameHorses.sort(()=>Math.random()-.5);

    // Shuffle mascots
    const mi=[0,1,2,3,4,5];for(let i=5;i>0;i--){const j=Math.floor(Math.random()*(i+1));[mi[i],mi[j]]=[mi[j],mi[i]];}

    gameHorses.forEach((h,i)=>{
        h.angle=START_ANGLE-(0.02+i*.015); // tight starting gate
        // Base speed calibrated for ~2min race
        const tapFactor=h.taps*0.0000065;
        h.baseSpeed=AVG_SPEED*.85+tapFactor;
        // Running style modifiers
        h.earlyMod=1; h.lateMod=1;
        if(!h.isPlayer){
            if(h.style===0){h.earlyMod=1.08;h.lateMod=0.94;} // frontrunner: fast early, fades
            else if(h.style===1){h.earlyMod=0.98;h.lateMod=1.04;} // stalker
            else{h.earlyMod=0.92;h.lateMod=1.12;} // closer: hangs back, big kick
        }
        h.energy=1; // stamina factor
        h.finished=false;
        // Lane behavior: post position determines starting lane, but all gravitate toward rail
        h.postPos=i;
        h.laneOffset=5+i*6; // starting spread
        h.targetLane=3+Math.random()*4; // all want to be near rail

        const model=createHorse(h.color,h.number,mi[i]);
        scene.add(model.root);
        h.model=model;
    });
    updateLB();
    animate();
}

function updateLB(){
    const sorted=[...gameHorses].sort((a,b)=>{
        if(a.finished&&!b.finished)return-1;if(!a.finished&&b.finished)return 1;return b.angle-a.angle;});
    const list=document.getElementById('standings-list');list.innerHTML='';
    sorted.forEach((h,i)=>{
        list.innerHTML+=`<div class="lb-row"><span class="lb-place">${['1ST','2ND','3RD','4TH','5TH','6TH'][i]}</span>
        <div class="lb-color" style="background:${h.color}"></div>
        <span class="lb-name" style="color:${h.isPlayer?'#ffeb3b':'#fff'}">#${h.number} ${h.name}</span></div>`;
    });
}
function showNotif(t){
    const e=document.createElement('div');e.className='finish-notif';e.innerText=t;
    document.getElementById('notifications-container').appendChild(e);
    setTimeout(()=>{e.style.opacity=0;setTimeout(()=>e.remove(),500);},3000);
}

// --- ANIMATE ---
const clock=new THREE.Clock();
function animate(){
    if(!raceFinished)requestAnimationFrame(animate);
    const time=clock.getElapsedTime();
    const gSpeed=18; // gallop cycle speed

    let leader=null,leaderAngle=-999,lastAngle=999;

    // Race progress
    let maxA=-999;
    gameHorses.forEach(h=>{if(h.angle>maxA)maxA=h.angle;});
    const progress=(maxA-START_ANGLE)/(FINISH_ANGLE-START_ANGLE);

    // Stretch call at ~75%
    if(progress>.72&&!stretchCalled){
        stretchCalled=true;
        const sc=document.getElementById('stretch-call');
        sc.innerHTML="AND DOWN THE<br>STRETCH THEY COME!";
        sc.classList.add('show');
        setTimeout(()=>sc.classList.remove('show'),3500);
    }

    gameHorses.forEach((h,i)=>{
        // Speed with running style modifier
        const raceMod=progress<.5?h.earlyMod:h.lateMod;
        // Random energy fluctuation (simulates real race dynamics)
        h.energy+=(Math.random()-.5)*.003;
        h.energy=Math.max(.93,Math.min(1.07,h.energy));
        const frameSpeed=h.baseSpeed*raceMod*h.energy+(Math.random()-.0005)*.0001;
        h.angle+=Math.max(frameSpeed,.0004);

        // Lane behavior: gravitate toward target, with some jostling
        // Leaders earn the rail, others spread slightly
        const rank=gameHorses.filter(o=>o.angle>h.angle).length;
        h.targetLane=3+rank*4+Math.sin(time*.5+i)*1.5; // inner=leader, outer=trailing
        h.laneOffset+=(h.targetLane-h.laneOffset)*.02;

        const r=BASE_R+h.laneOffset;
        const x=Math.cos(h.angle)*r*TRACK_SX;
        const z=Math.sin(h.angle)*r;
        const dx=-Math.sin(h.angle)*r*TRACK_SX;
        const dz=Math.cos(h.angle)*r;
        const tang=Math.atan2(-dz,dx);

        h.model.root.position.set(x,0,z);
        h.model.root.rotation.y=tang;

        // --- GALLOP ANIMATION (4-beat approximation) ---
        const c=time*gSpeed+i*1.7;
        // Body: bound + pitch
        const bound=Math.max(0,Math.sin(c))*2.2;
        h.model.body.position.y=bound;
        h.model.body.rotation.z=Math.sin(c)*.08; // slight pitch

        // Front legs: reach forward then pull back (offset from each other)
        const fl0=Math.sin(c)*.65;
        const fl1=Math.sin(c+.8)*.65;
        h.model.legs[0].upper.rotation.z=fl0;
        h.model.legs[0].lower.rotation.z=Math.max(0,-fl0)*.8; // knee bends on backstroke
        h.model.legs[1].upper.rotation.z=fl1;
        h.model.legs[1].lower.rotation.z=Math.max(0,-fl1)*.8;
        // Hind legs: opposite phase, more range
        const hl0=Math.sin(c+Math.PI)*.7;
        const hl1=Math.sin(c+Math.PI+.8)*.7;
        h.model.legs[2].upper.rotation.z=hl0;
        h.model.legs[2].lower.rotation.z=Math.max(0,hl0)*.6;
        h.model.legs[3].upper.rotation.z=hl1;
        h.model.legs[3].lower.rotation.z=Math.max(0,hl1)*.6;

        // Tail swish
        h.model.tailG.rotation.z=Math.sin(time*3+i)*.25;
        h.model.tailG.rotation.y=Math.sin(time*4+i)*.15;

        // Jockey bounce
        h.model.jG.position.y=10+bound*.4;
        h.model.jG.rotation.z=Math.sin(c)*.05;

        // Finish
        if(h.angle>=FINISH_ANGLE&&!h.finished){
            h.finished=true;finishOrder.push(h);
            const ps=finishOrder.length===1?"WINS!":finishOrder.length===2?"takes 2nd!":finishOrder.length===3?"takes 3rd!":"finishes.";
            showNotif(`🏁 #${h.number} ${h.name} ${ps}`);
        }
        if(!h.finished){
            if(h.angle>leaderAngle){leaderAngle=h.angle;leader=h;}
            if(h.angle<lastAngle)lastAngle=h.angle;
        }
    });
    updateLB();

    // --- BROADCAST CAMERA ---
    if(leader){
        const packSpread=leaderAngle-lastAngle;
        const packMid=(leaderAngle+lastAngle)/2;

        // Camera rides alongside on outside rail, slightly ahead of pack center
        const camAngle=packMid+0.06;
        // Pull back just enough to frame the pack; closer than before
        const camDist=45+Math.min(packSpread*50,30);
        const camR=leader.radius+DIRT_W+camDist;
        const camH=20+Math.min(packSpread*25,15); // lower = more dramatic

        const tx=Math.cos(camAngle)*camR*TRACK_SX;
        const tz=Math.sin(camAngle)*camR;
        camera.position.lerp(new THREE.Vector3(tx,camH,tz),.04);

        // Look at the middle of the pack
        const lookR=(BASE_R+15);
        const lx=Math.cos(packMid)*lookR*TRACK_SX;
        const lz=Math.sin(packMid)*lookR;
        camTarget.lerp(new THREE.Vector3(lx,5,lz),.04);
        camera.lookAt(camTarget);
    }

    // End
    if(finishOrder.length===gameHorses.length&&!raceFinished){
        raceFinished=true;
        document.getElementById('race-status').innerText="RACE COMPLETE!";
        document.getElementById('lap-display').innerText='';
        setTimeout(()=>{
            const rl=document.getElementById('results-list');
            finishOrder.forEach((h,i)=>{
                const t=i===0?'WIN':i===1?'PLACE':i===2?'SHOW':`${i+1}TH`;
                rl.innerHTML+=`<div class="result-row"><span class="result-place">${t}</span>
                <div class="lb-color" style="background:${h.color}"></div>
                <span style="color:${h.isPlayer?'#ffeb3b':'#fff'}">#${h.number} ${h.name}</span></div>`;
            });
            document.getElementById('results-title').innerText=finishOrder[0].isPlayer?"DERBY CHAMPION!":"YOU LOST";
            document.getElementById('results-modal').style.display='flex';
        },3000);
    }
    renderer.render(scene,camera);
}
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);});
</script>
