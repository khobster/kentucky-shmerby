<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Kentucky Shmerby</title>
    <link rel="icon" href="data:;base64,iVBORw0KGgo=">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap');

        body {
            font-family: 'Press Start 2P', monospace; background-color: #87CEEB; color: #fff;
            text-align: center; margin: 0; padding: 0; overflow: hidden; user-select: none;
        }

        h1 { color: #ffd700; font-size: 28px; text-shadow: 4px 4px 0px #000; margin: 20px 0; position: relative; z-index: 10; }
        .hidden { display: none !important; }
        #game-container { width: 100vw; height: 100vh; position: relative; display: flex; flex-direction: column; align-items: center; }

        /* Tapping Phase UI */
        #tap-zone {
            width: 90%; max-width: 600px; height: 300px; margin: 20px auto; background-color: #e53935; border: 8px solid #000;
            box-shadow: 0px 10px 0px #b71c1c; display: flex; align-items: center; justify-content: center;
            font-size: 16px; cursor: pointer; color: white; line-height: 1.8; text-shadow: 2px 2px 0px #000; border-radius: 8px; z-index: 10; position: relative;
        }
        #tap-zone:active { transform: translateY(10px); box-shadow: 0px 0px 0px #b71c1c; }

        button {
            padding: 15px 30px; font-size: 16px; font-family: inherit; cursor: pointer; background: #ffeb3b; color: #000;
            border: 6px solid #000; box-shadow: 0px 6px 0px #f57f17; margin-top: 20px; text-transform: uppercase; z-index: 10; position: relative;
        }
        button:hover { background: #fff176; }

        /* Finish Line Broadcast Notifications */
        #notifications-container {
            position: absolute; top: 80px; left: 50%; transform: translateX(-50%);
            z-index: 1000; display: flex; flex-direction: column; align-items: center; pointer-events: none;
        }
        .finish-notif {
            background: rgba(0,0,0,0.9); border: 2px solid #ffd700; color: #fff;
            padding: 12px 24px; margin-bottom: 8px; font-size: 12px; border-radius: 4px;
            box-shadow: 0px 4px 15px rgba(0,0,0,0.6); transition: opacity 0.5s ease;
        }

        /* Broadcast Chyron - Flexbox Fix */
        #leaderboard {
            position: absolute; bottom: 0; left: 0; width: 100%; height: 60px;
            background: rgba(17, 17, 17, 0.95); border-top: 4px solid #ffd700;
            display: flex; align-items: center; justify-content: center;
            z-index: 100; box-shadow: 0px -4px 15px rgba(0,0,0,0.5); padding: 0 10px; box-sizing: border-box;
        }
        #standings-list { display: flex; width: 100%; height: 100%; max-width: 1400px; justify-content: space-evenly; align-items: center; gap: 8px; }
        .leaderboard-row { 
            display: flex; align-items: center; flex: 1; min-width: 0; 
            background: #333; padding: 8px 10px; border-radius: 4px; border: 1px solid #555;
        }
        .leaderboard-place { color: #ffd700; margin-right: 6px; font-size: 10px; flex-shrink: 0; }
        .leaderboard-color { width: 12px; height: 12px; border: 2px solid #fff; margin-right: 6px; display: inline-block; flex-shrink: 0; }
        .leaderboard-name { white-space: nowrap; font-size: 10px; overflow: hidden; text-overflow: ellipsis; min-width: 0; flex-grow: 1; text-align: left; }

        /* Superfecta Results Modal */
        #results-modal {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: rgba(0,0,0,0.95); border: 6px solid #ffd700; padding: 30px;
            z-index: 1000; text-align: left; width: 90%; max-width: 500px; display: none; flex-direction: column; box-shadow: 0px 20px 50px rgba(0,0,0,0.8);
        }
        .result-row { display: flex; align-items: center; margin: 10px 0; font-size: 12px; border-bottom: 2px dashed #444; padding-bottom: 10px; }
        .result-place { width: 60px; color: #ffd700; }

        /* 3D Derby Track - DYNAMIC DRONE CAMERA */
        #race-phase {
            position: absolute; top: 0; left: 0; width: 100%; height: 100%;
            perspective: 1000px; display: flex; justify-content: center; align-items: center; overflow: hidden;
        }
        
        #camera-rig {
            position: absolute; width: 100%; height: 100%;
            transform-style: preserve-3d; transition: transform 0.1s linear; 
        }

        #track-container {
            box-sizing: border-box; width: 1400px; height: 800px;
            background-color: #4caf50; border-radius: 50%; border: 120px solid #bd9a6c; outline: 6px solid #fff; box-shadow: inset 0 0 0 6px #fff; 
            transform: rotateX(60deg); 
            position: absolute; left: 50%; top: 50%; margin-left: -700px; margin-top: -400px;
            transform-style: preserve-3d;
        }

        .finish-line {
            position: absolute; top: -120px; left: 50%; width: 16px; height: 120px;
            background: repeating-linear-gradient(0deg, #fff, #fff 10px, #000 10px, #000 20px); border-left: 2px solid #000;
        }

        /* --- THE REPAIRED 2.5D BILLBOARD HORSES --- */
        .racer-wrapper {
            position: absolute; left: 50%; top: 50%; margin-left: 0; margin-top: 0;
        }
        
        .horse-shadow {
            position: absolute; left: -20px; top: -10px; width: 40px; height: 20px;
            background: rgba(0,0,0,0.5); border-radius: 50%;
        }

        .billboard-container {
            position: absolute; left: -20px; top: -38px; width: 40px; height: 40px;
            transform-origin: bottom center;
            /* Counters the 60deg track tilt so the horse ALWAYS stands perfectly upright */
            transform: rotateX(-60deg); 
        }

        @keyframes gallop-bob {
            0% { transform: translateY(0px); }
            50% { transform: translateY(-4px); }
            100% { transform: translateY(0px); }
        }
        @keyframes leg-scissor {
            0% { transform: rotate(-35deg); }
            100% { transform: rotate(35deg); }
        }

        .horse-2d {
            position: absolute; width: 100%; height: 100%;
            animation: gallop-bob 0.3s infinite linear;
        }
        
        /* Clean 2D Details */
        .h-body {
            position: absolute; bottom: 8px; left: 2px; width: 34px; height: 14px;
            background: #5c3a21; border-radius: 6px; border: 1px solid #3a2212; z-index: 2;
        }
        .h-head {
            position: absolute; right: 0px; top: 8px; width: 12px; height: 16px;
            background: #5c3a21; border-radius: 4px; transform: rotate(15deg); border: 1px solid #3a2212; z-index: 2;
        }
        .h-tail {
            position: absolute; left: -2px; top: 18px; width: 10px; height: 4px;
            background: #222; transform: rotate(-30deg); z-index: 1;
        }
        
        /* Scissor Legs */
        .h-leg {
            position: absolute; bottom: -2px; width: 4px; height: 12px; background: #3a2212;
            transform-origin: top center; border-radius: 2px; z-index: 1;
        }
        .h-leg.front-1 { right: 8px; animation: leg-scissor 0.3s infinite alternate; }
        .h-leg.front-2 { right: 12px; animation: leg-scissor 0.3s infinite alternate-reverse; }
        .h-leg.back-1 { left: 6px; animation: leg-scissor 0.3s infinite alternate-reverse; }
        .h-leg.back-2 { left: 10px; animation: leg-scissor 0.3s infinite alternate; }

        /* Highly readable Saddlecloth */
        .h-saddle {
            position: absolute; left: 10px; top: 10px; width: 16px; height: 14px;
            background-color: var(--racer-color); color: #fff; font-size: 9px; font-family: sans-serif; font-weight: bold;
            display: flex; align-items: center; justify-content: center;
            border: 2px solid #000; box-sizing: border-box; z-index: 3;
        }
        .saddle-text {
            display: inline-block; text-shadow: 1px 1px 0px #000;
        }

        /* Smiley Balloon Jockey - Firmly anchored! */
        @keyframes balloon-float {
            0% { transform: translateY(0px) rotate(-5deg); }
            100% { transform: translateY(-4px) rotate(5deg); }
        }

        .balloon-jockey {
            position: absolute; left: 10px; top: -10px; width: 16px; height: 16px;
            background: #ffeb3b; border-radius: 50%; border: 1px solid #000;
            animation: balloon-float 0.4s infinite alternate ease-in-out;
            z-index: 4;
        }
        .balloon-jockey::after {
            content: ''; position: absolute; left: 7px; bottom: -12px; width: 1px; height: 12px; background: #fff;
        }
        .smiley { position: absolute; top: 4px; left: 3px; width: 10px; height: 8px; }
        .smiley-eye { position: absolute; width: 2px; height: 2px; background: #000; border-radius: 50%; top: 0; }
        .smiley-eye.left { left: 1px; }
        .smiley-eye.right { right: 5px; }
        .smiley-mouth {
            position: absolute; bottom: 0; left: 1px; width: 6px; height: 3px;
            border-bottom: 2px solid #000; border-radius: 50%;
        }

        #timer-display { font-size: 40px; color: #fff; text-shadow: 4px 4px #000; position: relative; z-index: 10;}
        #race-status { text-shadow: 3px 3px #000; line-height: 1.5; text-align: center; position: relative; z-index: 10;}
        #lobby { position: relative; z-index: 10; margin-top: 50px; }
    </style>
</head>
<body>

    <div id="game-container">
        <h1 id="main-title">KENTUCKY SHMERBY</h1>

        <div id="lobby">
            <p>Your Steed:</p>
            <h2 id="player-horse-name" style="color: #ffeb3b; text-shadow: 2px 2px #000;">Loading...</h2>
            <button id="start-btn">ENTER DERBY</button>
        </div>

        <div id="tapping-phase" class="hidden">
            <h2 id="timer-display">10.0</h2>
            <div id="tap-zone">
                TAP HERE!<br><br>Speed, not force.<br>Your count is hidden!
            </div>
        </div>

        <div id="race-phase" class="hidden">
            <div style="position: absolute; top: 20px; width: 100%; z-index: 100;">
                <h2 id="race-status">AND THEY'RE OFF!</h2>
            </div>
            
            <div id="notifications-container"></div>

            <div id="camera-rig">
                <div id="track-container">
                    <div class="finish-line"></div>
                    <div id="racers-container"></div>
                </div>
            </div>

            <div id="leaderboard">
                <div id="standings-list"></div>
            </div>
        </div>

        <div id="results-modal">
            <h2 id="results-title" style="text-align: center; margin-bottom: 20px;"></h2>
            <div id="results-list"></div>
            <button onclick="location.reload()" style="margin: 20px auto 0 auto; display: block;">Race Again</button>
        </div>

    </div>

    <script>
        // --- THE DERBY PDF DICTIONARY ---
        const derbyWords = [
            "Affirmed", "Agile", "Alan", "Dale", "Dreaming", "Alysheba", "American", "Pharoah", "Animal", "Kingdom",
            "Apollo", "Aristides", "Assault", "Authentic", "Azra", "Baden", "Barbaro", "Behave", "Yourself", "Ben", "Ali",
            "Brush", "Brown", "Black", "Gold", "Bold", "Forbes", "Venture", "Brokers", "Tip", "Bubbling", "Over",
            "Buchanan", "Burgoo", "King", "California", "Chrome", "Cannonade", "Canonero", "Carry", "Back", "Cavalcade",
            "Chant", "Charismatic", "Chateaugay", "Citation", "Clyde", "Dusen", "Count", "Fleet", "Turf", "Country", "House",
            "Dark", "Star", "Decidedly", "Determine", "Donau", "Donerail", "Dust", "Commander", "Elwood", "Exterminator",
            "Ferdinand", "Flying", "Ebony", "Fonso", "Foolish", "Pleasure", "Forward", "Pass", "Funny", "Cide", "Fusaichi",
            "Pegasus", "Gallahadion", "Gallant", "Fox", "Gato", "Del", "Sol", "Genuine", "Risk", "George", "Smith", "Giacomo",
            "Gin", "Grindstone", "Halma", "Hill", "Gail", "Hindoo", "Eminence", "Hoop", "Iron", "Liege", "Jet", "Pilot",
            "Joe", "Cotton", "Johnstown", "Judge", "Himes", "Justify", "Kauai", "Lawrin", "Leonatus", "Gibson", "Lil",
            "Tee", "Lookout", "Lord", "Murphy", "Lucky", "Debonair", "Macbeth", "Mage", "Majestic", "Prince", "Mandaloun",
            "Manuel", "Meridian", "Middleground", "Mine", "Bird", "Monarchos", "Montrose", "Morvich", "Mystik", "Dan",
            "Needles", "Northern", "Dancer", "Nyquist", "Rosebud", "Omaha", "Omar", "Khayyam", "Orb", "Paul", "Jones",
            "Pensive", "Pink", "Plaudit", "Pleasant", "Colony", "Ponder", "Proud", "Clarion", "Real", "Quiet", "Regret",
            "Reigh", "Strike", "Riley", "Riva", "Ridge", "Sea", "Hero", "Seattle", "Slew", "Secretariat", "Shut", "Out",
            "Silver", "Charm", "Barton", "Huon", "Smarty", "Sovereignty", "Spectacular", "Bid", "Spend", "Buck",
            "Spokane", "Stone", "Street", "Sense", "Sunday", "Silence", "Sunny", "Halo", "Super", "Saver", "Swale", "Swaps",
            "Thunder", "Gulch", "Tim", "Tam", "Tomy", "Lee", "Twenty", "Grand", "Typhoon", "Unbridled", "Vagrant", "Venetian",
            "Way", "War", "Admiral", "Emblem", "Whirlaway", "Whiskery", "Winning", "Colors", "Wintergreen", "Worth", "Zev"
        ];

        function generateWeirdName() {
            let word1 = derbyWords[Math.floor(Math.random() * derbyWords.length)];
            let word2 = derbyWords[Math.floor(Math.random() * derbyWords.length)];
            return `${word1} ${word2}`;
        }

        // --- GAME STATE ---
        let playerHorse = { name: generateWeirdName(), taps: 0, isPlayer: true, color: "#e91e63", number: Math.floor(Math.random() * 20) + 1 }; 
        let horses = [];
        let finishOrder = [];
        let raceFinished = false;
        let timeRemaining = 10;
        const TAP_DURATION = 10; 
        
        const botColors = ["#2196f3", "#4caf50", "#ff9800", "#9c27b0", "#00bcd4"];
        
        let camX = 0;
        let camY = 0;

        const laneRadii = [
            { rx: 510, ry: 290 }, 
            { rx: 530, ry: 310 }, 
            { rx: 550, ry: 330 }, 
            { rx: 570, ry: 350 },  
            { rx: 590, ry: 370 },  
            { rx: 610, ry: 390 }   
        ];

        // --- DOM ELEMENTS ---
        const lobbyEl = document.getElementById('lobby');
        const startBtn = document.getElementById('start-btn');
        const tapPhaseEl = document.getElementById('tapping-phase');
        const tapZone = document.getElementById('tap-zone');
        const timerDisplay = document.getElementById('timer-display');
        const racePhaseEl = document.getElementById('race-phase');
        const racersContainer = document.getElementById('racers-container');
        const raceStatus = document.getElementById('race-status');
        const standingsList = document.getElementById('standings-list');
        const cameraRig = document.getElementById('camera-rig');
        const mainTitle = document.getElementById('main-title');
        const resultsModal = document.getElementById('results-modal');
        const resultsList = document.getElementById('results-list');
        const resultsTitle = document.getElementById('results-title');
        const notifContainer = document.getElementById('notifications-container');

        // --- INIT ---
        document.getElementById('player-horse-name').innerText = `#${playerHorse.number} ${playerHorse.name}`;

        startBtn.addEventListener('click', () => {
            lobbyEl.classList.add('hidden');
            mainTitle.classList.add('hidden'); 
            tapPhaseEl.classList.remove('hidden');
            
            let startTime = Date.now();
            let timerInterval = setInterval(() => {
                let elapsedTime = (Date.now() - startTime) / 1000;
                timeRemaining = (TAP_DURATION - elapsedTime).toFixed(1);
                
                if (timeRemaining <= 0) {
                    timeRemaining = 0; clearInterval(timerInterval); startRace();
                }
                timerDisplay.innerText = timeRemaining;
            }, 100);
        });

        tapZone.addEventListener('pointerdown', (e) => { e.preventDefault(); playerHorse.taps++; });

        // --- PHASE 3: RACE LOGIC ---
        function startRace() {
            tapPhaseEl.classList.add('hidden');
            racePhaseEl.classList.remove('hidden');

            horses.push(playerHorse);
            
            for(let i=0; i<5; i++){
                let newNum;
                do { newNum = Math.floor(Math.random() * 20) + 1; } while (horses.some(h => h.number === newNum));
                horses.push({ name: generateWeirdName(), taps: Math.floor(Math.random() * 50) + 30, isPlayer: false, color: botColors[i], number: newNum });
            }
            horses.sort(() => Math.random() - 0.5);

            horses.forEach((horse, index) => {
                horse.angle = -Math.PI / 2 - (0.04 + (index * 0.03)); 
                horse.baseSpeed = 0.00060; 
                horse.speedMultiplier = horse.baseSpeed + (horse.taps * 0.000004); 
                horse.lane = laneRadii[index];
                horse.prevX = 0;
                horse.flip = 1;
                horse.finished = false;

                const wrapper = document.createElement('div');
                wrapper.className = 'racer-wrapper';
                wrapper.id = `horse-${index}`;
                
                wrapper.innerHTML = `
                    <div class="horse-shadow"></div>
                    <div class="billboard-container" id="billboard-${index}">
                        <div class="horse-2d">
                            <div class="h-tail"></div>
                            <div class="h-leg back-1"></div>
                            <div class="h-leg back-2"></div>
                            <div class="h-leg front-1"></div>
                            <div class="h-leg front-2"></div>
                            <div class="h-body"></div>
                            <div class="h-head"></div>
                            
                            <div class="h-saddle" style="--racer-color: ${horse.color};">
                                <span class="saddle-text" id="saddle-text-${index}">${horse.number}</span>
                            </div>

                            <div class="balloon-jockey">
                                <div class="smiley">
                                    <div class="smiley-eye left"></div>
                                    <div class="smiley-eye right"></div>
                                    <div class="smiley-mouth"></div>
                                </div>
                            </div>
                        </div>
                    </div>
                `;
                racersContainer.appendChild(wrapper);
            });

            updateLeaderboard();
            setTimeout(raceLoop, 1000); 
        }

        function updateLeaderboard() {
            const sorted = [...horses].sort((a, b) => {
                if (a.finished && !b.finished) return -1;
                if (!a.finished && b.finished) return 1;
                return b.angle - a.angle;
            });
            
            standingsList.innerHTML = '';
            sorted.forEach((horse, i) => {
                const row = document.createElement('div');
                row.className = 'leaderboard-row';
                let place = i === 0 ? '1ST' : i === 1 ? '2ND' : i === 2 ? '3RD' : i === 3 ? '4TH' : i === 4 ? '5TH' : '6TH';
                row.innerHTML = `
                    <span class="leaderboard-place">${place}</span>
                    <div class="leaderboard-color" style="background-color: ${horse.color};"></div>
                    <span class="leaderboard-name" style="color: ${horse.isPlayer ? '#ffeb3b' : '#fff'};">#${horse.number} ${horse.name}</span>
                `;
                standingsList.appendChild(row);
            });
        }

        function showNotification(text) {
            const el = document.createElement('div');
            el.className = 'finish-notif'; el.innerText = text;
            notifContainer.appendChild(el);
            setTimeout(() => { el.style.opacity = 0; setTimeout(() => el.remove(), 500); }, 3000);
        }

        function showResults() {
            resultsList.innerHTML = '';
            finishOrder.forEach((h, i) => {
                let title = i === 0 ? 'WIN' : i === 1 ? 'PLACE' : i === 2 ? 'SHOW' : `${i+1}TH`;
                resultsList.innerHTML += `
                    <div class="result-row">
                        <span class="result-place">${title}</span>
                        <div class="leaderboard-color" style="background-color: ${h.color};"></div>
                        <span style="color: ${h.isPlayer ? '#ffeb3b' : '#fff'}">#${h.number} ${h.name}</span>
                    </div>
                `;
            });
            
            if(finishOrder[0].isPlayer) {
                resultsTitle.innerText = "DERBY CHAMPION!"; resultsTitle.style.color = "#ffeb3b";
            } else {
                resultsTitle.innerText = "YOU LOST"; resultsTitle.style.color = "#fff";
            }
            resultsModal.style.display = 'flex';
        }

        function raceLoop() {
            const sortedHorses = [...horses].map((h, i) => ({...h, index: i})).sort((a, b) => {
                 let yA = a.lane.ry * Math.sin(a.angle);
                 let yB = b.lane.ry * Math.sin(b.angle);
                 return yA - yB;
            });

            const activeHorses = sortedHorses.filter(h => !horses[h.index].finished);
            const trackingHorse = activeHorses.length > 0 ? horses[activeHorses[activeHorses.length - 1].index] : horses[sortedHorses[sortedHorses.length - 1].index];
                
            let targetCamX = -trackingHorse.lane.rx * Math.cos(trackingHorse.angle);
            let targetCamY = -trackingHorse.lane.ry * Math.sin(trackingHorse.angle);

            camX += (targetCamX - camX) * 0.1; 
            camY += (targetCamY - camY) * 0.1;
            
            cameraRig.style.transform = `scale(3.2) translate(${camX * 0.6}px, ${camY * 0.6}px)`;

            horses.forEach((horse, i) => {
                let randomJitter = (Math.random() * 0.0002); 
                horse.angle += horse.speedMultiplier + randomJitter;

                if (horse.angle >= (3 * Math.PI / 2) && !horse.finished) { 
                    horse.finished = true;
                    finishOrder.push(horse);
                    let placeStr = finishOrder.length === 1 ? "WINS!" : finishOrder.length === 2 ? "takes 2nd!" : finishOrder.length === 3 ? "takes 3rd!" : "finishes.";
                    showNotification(`🏁 #${horse.number} ${horse.name} ${placeStr}`);
                }
            });

            updateLeaderboard();

            sortedHorses.forEach((horseData, zIndex) => {
                const horse = horses[horseData.index];
                const index = horseData.index;

                let x = horse.lane.rx * Math.cos(horse.angle);
                let y = horse.lane.ry * Math.sin(horse.angle);

                // By ONLY translating the wrapper, the horse never rotates upside down.
                const horseDiv = document.getElementById(`horse-${index}`);
                const billboard = document.getElementById(`billboard-${index}`);
                const saddleText = document.getElementById(`saddle-text-${index}`);
                
                horseDiv.style.transform = `translate(${x}px, ${y}px)`;
                horseDiv.style.zIndex = zIndex; 
                
                // Flip the horse sprite based on X velocity
                let dx = x - horse.prevX;
                if (Math.abs(dx) > 0.01) { horse.flip = dx > 0 ? 1 : -1; }
                horse.prevX = x;

                // Keeps billboard perfectly vertical against the tilted track
                billboard.style.transform = `rotateX(-60deg) scaleX(${horse.flip})`;
                
                // CRUCIAL: Counter-flip the saddle text so it NEVER reads backward
                saddleText.style.transform = `scaleX(${horse.flip})`;
            });

            if (finishOrder.length === horses.length && !raceFinished) {
                raceFinished = true;
                raceStatus.innerText = "RACE COMPLETE!";
                setTimeout(showResults, 2500); 
            }

            if (!raceFinished) {
                requestAnimationFrame(raceLoop);
            }
        }
    </script>
</body>
</html>
